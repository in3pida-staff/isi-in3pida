name: Invia email feedback albergatore

on:
  issues:
    types: [opened]

jobs:
  send-email:
    if: contains(toJSON(github.event.issue.labels.*.name), 'feedback')
    runs-on: ubuntu-latest
    steps:
      - name: Invia email via SMTP
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, ssl, os
          from email.mime.text import MIMEText

          host = os.environ['SMTP_HOST']
          port = int(os.environ['SMTP_PORT'])
          user = os.environ['SMTP_USER']
          pwd  = os.environ['SMTP_PASS']
          title = os.environ.get('ISSUE_TITLE', 'Nuovo feedback ISI')
          body  = os.environ.get('ISSUE_BODY', '')

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = f"Feedback ISI: {title}"
          msg['From']    = f"Eletta ISI <{user}>"
          msg['To']      = "mario@in3pida.it"

          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL(host, port, context=ctx) as s:
              s.login(user, pwd)
              s.sendmail(user, ['mario@in3pida.it'], msg.as_bytes())
          print("Email inviata")
          PYEOF
