<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletta — Posiziona il tuo sito nelle ricerche AI — Accedi</title>
    <link rel="icon" type="image/png" href="images/favicon.png?v=2">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500&family=Source+Code+Pro:wght@400&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sarabun', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            background: #FFFBF8;
        }

        /* ── Layout split ── */
        .login-split {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* ── Left panel ── */
        .login-left {
            flex: 0 0 52%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #c8d2ea 0%, #b8c0de 100%);
            overflow: hidden;
            padding: 60px 48px;
        }

        .geo-back { display: none; }

        .login-left-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Logo ELETTA — placeholder fino all'SVG del grafico */
        .logo-eletta-text {
            font-family: 'Commissioner', sans-serif;
            font-weight: 500;
            font-size: 68px;
            letter-spacing: 0.18em;
            color: #0D5F75;
            text-transform: lowercase;
            line-height: 1;
            margin-bottom: 20px;
            display: block;
        }

        .logo-tagline {
            font-family: 'Source Code Pro', monospace;
            font-weight: 400;
            font-size: 13px;
            color: #0D5F75;
            letter-spacing: 0.03em;
            opacity: 0.85;
        }

        .login-brand {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: #0D5F75;
            opacity: 0.8;
        }

        .login-brand img {
            height: 22px;
            width: auto;
        }

        /* ── Right panel ── */
        .login-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFBF8;
            padding: 60px 40px;
            position: relative;
        }

        .login-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 18%;
            height: 12%;
            background: #c8d2ea;
            clip-path: polygon(0% 0%, 100% 0%, 0% 100%);
            z-index: 0;
        }

        .login-form-wrap {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .login-title {
            font-family: 'Commissioner', sans-serif;
            font-weight: 400;
            font-size: 50px;
            color: #0D5F75;
            letter-spacing: 0;
            margin-bottom: 40px;
            line-height: 1.2;
        }

        .login-title em {
            font-style: italic;
            font-weight: 500;
        }

        /* Messaggi */
        .login-msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            font-weight: 300;
        }
        .login-msg-success { background: #e8ecf7; color: #0D5F75; }
        .login-msg-error   { background: #fdecea; color: #c62828; }

        /* Form */
        .form-group { margin-bottom: 20px; }

        .form-row-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .form-label {
            font-family: 'Commissioner', sans-serif;
            font-weight: 600;
            font-size: 16px;
            color: #0D5F75;
        }

        .btn-forgot {
            background: none;
            border: none;
            font-family: 'Commissioner', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #9ca3b8;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
        }
        .btn-forgot:hover { color: #0D5F75; }

        .input-wrap { position: relative; }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #dde0ea;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            font-weight: 300;
            color: #0D5F75;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .form-input:focus { border-color: #0D5F75; }
        .form-input::placeholder { color: #b8bdd0; }

        .btn-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #b8bdd0;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .btn-eye:hover { color: #0D5F75; }

        /* Bottone principale — Limone */
        .btn-primary {
            width: 100%;
            padding: 20px;
            margin-top: 8px;
            background: #EFEF14;
            color: #0D5F75;
            border: none;
            border-radius: 8px;
            font-family: 'Commissioner', sans-serif;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.88; }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

        /* Divider */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
            font-family: 'Sarabun', sans-serif;
            font-size: 13px;
            font-weight: 300;
            color: #b8bdd0;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e4e6f0;
        }

        /* Google */
        .btn-google {
            width: 100%;
            padding: 13px 16px;
            background: #fff;
            border: 1.5px solid #dde0ea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Commissioner', sans-serif;
            font-weight: 400;
            font-size: 15px;
            color: #0D5F75;
            letter-spacing: 0;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .btn-google:hover { border-color: #0D5F75; }
        .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Register */
        .login-register {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 28px;
            font-family: 'Commissioner', sans-serif;
            font-weight: 600;
            font-size: 24px;
            color: #0D5F75;
            letter-spacing: 0;
        }

        .btn-register {
            display: inline-block;
            padding: 12px 26px;
            background: #FF8500;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Commissioner', sans-serif;
            font-weight: 500;
            font-size: 17px;
            letter-spacing: 0;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-register:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <div class="login-split">

        <!-- LEFT -->
        <div class="login-left">
            <div class="geo-back"></div>
            <div class="geo-front"></div>
            <div class="login-left-content">
                <img src="images/logo-eletta.png" alt="Eletta" style="width:78%;max-width:460px;height:auto;margin-bottom:20px">
                <div class="logo-tagline">Posiziona il tuo sito nelle ricerche AI</div>
            </div>
            <div class="login-brand">
                <span>Eletta è un prodotto di</span>
                <img src="images/logo.png" alt="in3pida">
            </div>
        </div>

        <!-- RIGHT -->
        <div class="login-right">
            <div class="login-form-wrap">
                <h1 class="login-title">Accedi ad <em>Eletta</em></h1>

                <div id="msg-success" class="login-msg login-msg-success" style="display:none"></div>
                <div id="msg-error"   class="login-msg login-msg-error"   style="display:none"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <div class="input-wrap">
                            <input type="email" class="form-input" id="email" placeholder="mario@in3pida.it" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-row-label">
                            <label class="form-label" for="password">Password</label>
                            <button type="button" id="btn-forgot" class="btn-forgot">Password dimenticata?</button>
                        </div>
                        <div class="input-wrap">
                            <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="btn-eye" id="btn-eye" aria-label="Mostra password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="btn-primary" type="submit" id="btn-login">Accedi</button>
                </form>

                <div class="login-divider"><span>Oppure</span></div>

                <button class="btn-google" id="btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink:0">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continua con Google
                </button>

                <div class="login-register">
                    <span>Non hai un account?</span>
                    <a href="register.html" class="btn-register">Registrati!</a>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
    const _SB = window.supabase.createClient(
        'https://yyauvoqjdzrbmebeafit.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w'
    );

    // Se già loggato → vai alla dashboard corretta in base al ruolo
    _SB.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            const role = session.user?.user_metadata?.role;
            window.location.href = role === 'albergatore' ? 'hotel.html' : 'index.html';
        }
    });

    // Messaggi da URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'unauthorized') showMsg('error', 'Il tuo account non ha accesso a questa area. Contatta Mario.');

    // Mostra/nascondi password
    document.getElementById('btn-eye').addEventListener('click', () => {
        const inp = document.getElementById('password');
        const btn = document.getElementById('btn-eye');
        if (inp.type === 'password') {
            inp.type = 'text';
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
        } else {
            inp.type = 'password';
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }
    });

    // Login
    document.getElementById('login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.textContent = '...'; btn.disabled = true;
        clearMsg();
        const { error } = await _SB.auth.signInWithPassword({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
        });
        if (error) {
            const msg = error.message.includes('Invalid login') || error.message.includes('invalid_credentials')
                ? 'Email o password non corrette.'
                : error.message.includes('Email not confirmed')
                ? 'Devi confermare la tua email prima di accedere. Controlla la casella di posta.'
                : error.message;
            showMsg('error', msg);
            btn.textContent = 'accedi'; btn.disabled = false;
        } else {
            const { data: { session: sess } } = await _SB.auth.getSession();
            const role = sess?.user?.user_metadata?.role;
            window.location.href = role === 'albergatore' ? 'hotel.html' : 'index.html';
        }
    });

    // Password dimenticata
    document.getElementById('btn-forgot').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        if (!email) { showMsg('error', 'Inserisci prima la tua email.'); return; }
        const btn = document.getElementById('btn-forgot');
        btn.disabled = true;
        clearMsg();
        const { error } = await _SB.auth.resetPasswordForEmail(email, {
            redirectTo: 'https://app.eletta-ai.it/index.html',
        });
        btn.disabled = false;
        if (error) showMsg('error', error.message);
        else showMsg('success', 'Email inviata! Controlla la casella di posta e clicca il link per reimpostare la password.');
    });

    // Google OAuth
    document.getElementById('btn-google').addEventListener('click', async () => {
        const btn = document.getElementById('btn-google');
        btn.disabled = true;
        await _SB.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: 'https://app.eletta-ai.it/login.html' },
        });
    });

    function showMsg(type, text) {
        const s = document.getElementById('msg-success');
        const e = document.getElementById('msg-error');
        s.style.display = 'none'; e.style.display = 'none';
        const el = type === 'success' ? s : e;
        el.textContent = text; el.style.display = 'block';
    }
    function clearMsg() {
        document.getElementById('msg-success').style.display = 'none';
        document.getElementById('msg-error').style.display   = 'none';
    }
    </script>
</body>
</html>
