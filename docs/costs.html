<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Costi AI — iSI</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>
    <style>
        .flatpickr-calendar { font-family: var(--font, 'Inter', sans-serif) !important; border:1px solid #e4e4ec !important; box-shadow:0 4px 16px rgba(23,27,51,.10) !important; border-radius:10px !important; }
        .flatpickr-day.selected, .flatpickr-day.selected:hover { background:#d82d6b !important; border-color:#d82d6b !important; }
        .flatpickr-day.inRange { background:#fce8ef !important; border-color:#fce8ef !important; color:#d82d6b !important; }
        .flatpickr-day:hover { background:#fbf4f7 !important; border-color:#ead0dc !important; }
        .flatpickr-day.today { border-color:#d82d6b !important; }
        .flatpickr-day.today:hover { background:#d82d6b !important; color:#fff !important; }
        .flatpickr-months .flatpickr-month, .flatpickr-weekdays { background:#d82d6b !important; border-radius:8px 8px 0 0 !important; }
        .flatpickr-current-month, .flatpickr-current-month .cur-month, .flatpickr-current-month input.cur-year { color:#fff !important; }
        .flatpickr-weekday { color:#fff !important; font-weight:700 !important; }
        .flatpickr-prev-month svg, .flatpickr-next-month svg { fill:#fff !important; }
        .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill:#fce8ef !important; }
        .flatpickr-input { cursor:pointer !important; }
    </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="navbar-left">
        <div class="navbar-logo" onclick="window.location.href='index.html'" style="cursor:pointer"><img src="images/logo.png" alt="in3pida"></div>
        <span class="navbar-badge">iSI</span>
    </div>
    <div class="navbar-center"></div>
    <div class="navbar-right">
        <div class="navbar-user-pill" id="user-pill" style="cursor:default">
            <div class="navbar-avatar" id="nav-avatar">U</div>
            <div class="navbar-user-text">
                <div class="navbar-user-name" id="nav-name">Utente</div>
                <div class="navbar-user-sub">Admin</div>
            </div>
        </div>
    </div>
  </div>
</nav>

<div class="main-content" style="max-width:1200px;margin:0 auto;padding:30px 20px">

    <div style="margin-bottom:20px">
        <button class="btn-back" onclick="window.location.href='index.html'" style="margin-bottom:0">← Torna alle installazioni</button>
    </div>

    <div style="display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start">

        <!-- SIDEBAR -->
        <div style="position:sticky;top:80px;background:white;border-radius:4px;overflow:hidden;border:1px solid #e2e2e2;box-shadow:none">
            <div style="padding:14px 20px;border-bottom:1px solid #e2e2e2">
                <div style="font-size:15px;font-weight:700;color:#171b33">Costi AI</div>
                <div style="font-size:11px;color:#666b84;margin-top:3px">Riepilogo chiamate</div>
            </div>

            <!-- FILTRI header -->
            <div style="font-size:10px;font-weight:700;color:#4a4a6a;letter-spacing:.08em;text-transform:uppercase;padding:10px 0 8px 16px;border-bottom:1px solid #e2e2e2;background:#fafafa">FILTRI</div>

            <!-- PERIODO row -->
            <div style="display:flex;align-items:center;border-bottom:1px solid #e2e2e2">
                <div style="width:90px;flex-shrink:0;background:#fafafa;padding:11px 14px;border-right:1px solid #e2e2e2;font-size:10px;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase">PERIODO</div>
                <div style="flex:1;padding:4px 8px">
                    <select id="filter-period" style="width:100%;border:none;background:transparent;font-size:12px;color:#35364f;font-family:var(--font);padding:6px 4px;cursor:pointer;outline:none">
                        <option value="all">Dall'inizio</option>
                        <option value="today">Oggi</option>
                        <option value="week">Ultima settimana</option>
                        <option value="month">Ultimo mese</option>
                        <option value="custom">Personalizzato</option>
                    </select>
                </div>
            </div>

            <!-- Date personalizzate (solo se custom) -->
            <div id="custom-range" style="display:none;flex-direction:column;gap:6px;padding:10px 14px;border-bottom:1px solid #e2e2e2;background:#fafafa">
                <input type="text" id="date-from" class="profile-input" placeholder="gg/mm/aaaa" maxlength="10" style="padding:6px 10px;font-size:12px;width:100%;box-sizing:border-box">
                <input type="text" id="date-to" class="profile-input" placeholder="gg/mm/aaaa" maxlength="10" style="padding:6px 10px;font-size:12px;width:100%;box-sizing:border-box">
            </div>

            <!-- TIPO row -->
            <div style="display:flex;align-items:center;border-bottom:1px solid #e2e2e2">
                <div style="width:90px;flex-shrink:0;background:#fafafa;padding:11px 14px;border-right:1px solid #e2e2e2;font-size:10px;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase">TIPO</div>
                <div style="flex:1;padding:4px 8px">
                    <select id="filter-type" style="width:100%;border:none;background:transparent;font-size:12px;color:#35364f;font-family:var(--font);padding:6px 4px;cursor:pointer;outline:none">
                        <option value="">— Tutti —</option>
                        <option value="pse">PSE Query</option>
                        <option value="reason_gap">Reason Gap</option>
                    </select>
                </div>
            </div>

            <!-- HOTEL row -->
            <div style="display:flex;align-items:center;border-bottom:1px solid #e2e2e2">
                <div style="width:90px;flex-shrink:0;background:#fafafa;padding:11px 14px;border-right:1px solid #e2e2e2;font-size:10px;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase">HOTEL</div>
                <div style="flex:1;padding:4px 8px">
                    <select id="filter-site" style="width:100%;border:none;background:transparent;font-size:12px;color:#35364f;font-family:var(--font);padding:6px 4px;cursor:pointer;outline:none">
                        <option value="">— Tutti —</option>
                    </select>
                </div>
            </div>

            <!-- CARICA button -->
            <div style="padding:14px 16px">
                <button id="btn-carica" style="width:100%;background:#d82d6b;color:white;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)">CARICA</button>
            </div>
        </div>

        <!-- COLONNA DESTRA -->
        <div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
                <div class="card" style="border:1px solid #e4e4ec;box-shadow:none;padding:16px 18px">
                    <div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Totale dall'inizio</div>
                    <div id="grand-total" style="font-size:26px;font-weight:800;color:#d82d6b">—</div>
                </div>
                <div class="card" style="border:1px solid #e4e4ec;box-shadow:none;padding:16px 18px">
                    <div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Costo totale</div>
                    <div id="kpi-cost" style="font-size:26px;font-weight:800;color:#171b33">—</div>
                </div>
                <div class="card" style="border:1px solid #e4e4ec;box-shadow:none;padding:16px 18px">
                    <div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Chiamate totali</div>
                    <div id="kpi-calls" style="font-size:26px;font-weight:800;color:#171b33">—</div>
                </div>
                <div class="card" style="border:1px solid #e4e4ec;box-shadow:none;padding:16px 18px">
                    <div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Costo medio/chiamata</div>
                    <div id="kpi-avg" style="font-size:26px;font-weight:800;color:#171b33">—</div>
                </div>
            </div>

            <div class="card" style="border:1px solid #e4e4ec;box-shadow:none">
                <div class="card-header" style="border-bottom:1px solid #ececf2;background:#fafafa">
                    <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#d82d6b;display:inline-block;flex-shrink:0"></span><div style="font-size:11px;font-weight:700;color:#171b33;letter-spacing:.05em;text-transform:uppercase">Dettaglio chiamate</div></div>
                    <span id="rows-count" style="font-size:12px;color:#666b84"></span>
                </div>
                <div style="overflow-x:auto">
                    <table class="sites-table">
                        <thead><tr>
                            <th>Data</th><th>Hotel</th><th>Tipo</th><th>Query</th><th class="th-center">Costo</th>
                        </tr></thead>
                        <tbody id="costs-tbody"><tr><td colspan="5" style="text-align:center;padding:30px;color:#666b84">Premi CARICA per visualizzare i dati</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const SUPABASE_URL = 'https://yyauvoqjdzrbmebeafit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w';
const _SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allRows = [];
const urlParams = new URLSearchParams(window.location.search);
const presetSiteId = urlParams.get('site_id') || '';

async function init() {
    const { data: { user } } = await _SB.auth.getUser();
    if (!user || user.user_metadata?.role === 'albergatore') { window.location.href = 'login.html'; return; }

    const _name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Admin';
    document.getElementById('nav-name').textContent = _name;
    const _avEl = document.getElementById('nav-avatar');
    const _avUrl = user.user_metadata?.avatar_url;
    if (_avUrl) { _avEl.style.backgroundImage=`url(${_avUrl})`; _avEl.style.backgroundSize='cover'; _avEl.style.backgroundPosition='center'; _avEl.textContent=''; }
    else { _avEl.textContent = _name[0].toUpperCase(); }

    const [{ data: pse }, { data: rg }] = await Promise.all([
        _SB.from('isi_pse_queries').select('created_at,cost_usd,site_id,site_name,query').order('created_at',{ascending:false}).limit(5000),
        _SB.from('isi_reason_gap_results').select('created_at,cost_usd,site_id,site_name,query').order('created_at',{ascending:false}).limit(5000),
    ]);

    allRows = [
        ...(pse||[]).map(r => ({...r, type:'pse', type_label:'PSE Query'})),
        ...(rg||[]).map(r => ({...r, type:'reason_gap', type_label:'Reason Gap'})),
    ].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    document.getElementById('grand-total').textContent = '€' + allRows.reduce((s,r)=>s+(parseFloat(r.cost_usd)||0),0).toFixed(4);


    const seen = new Set();
    const sel = document.getElementById('filter-site');
    allRows.forEach(r => {
        if (!seen.has(r.site_id)) {
            seen.add(r.site_id);
            const opt = document.createElement('option');
            opt.value = r.site_id; opt.textContent = r.site_name || r.site_id;
            sel.appendChild(opt);
        }
    });
    if (presetSiteId) sel.value = presetSiteId;
}

function render() {
    const period = document.getElementById('filter-period').value;
    const filterType = document.getElementById('filter-type').value;
    const filterSite = document.getElementById('filter-site').value;
    const now = new Date();
    let from = null, to = null;
    if (period === 'today') { from = new Date(now); from.setHours(0,0,0,0); to = now; }
    else if (period === 'week') { from = new Date(now); from.setDate(from.getDate()-7); to = now; }
    else if (period === 'month') { from = new Date(now); from.setMonth(from.getMonth()-1); to = now; }
    else if (period === 'custom') {
        const parseIt = s => { const p=s.split('/'); return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null; };
        from = parseIt(document.getElementById('date-from').value||'');
        to   = parseIt(document.getElementById('date-to').value||'');
        if (to) to.setHours(23,59,59,999);
    }

    const filtered = allRows.filter(r => {
        const d = new Date(r.created_at);
        if (from && d < from) return false;
        if (to   && d > to)   return false;
        if (filterSite && r.site_id !== filterSite) return false;
        if (filterType && r.type !== filterType) return false;
        return true;
    });

    const total = filtered.reduce((s,r)=>s+(parseFloat(r.cost_usd)||0),0);
    const avg = filtered.length ? total/filtered.length : 0;
    document.getElementById('kpi-cost').textContent  = '€' + total.toFixed(4);
    document.getElementById('kpi-calls').textContent = filtered.length;
    document.getElementById('kpi-avg').textContent   = '€' + avg.toFixed(6);
    document.getElementById('rows-count').textContent = filtered.length + ' righe';

    const tbody = document.getElementById('costs-tbody');
    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#666b84">Nessun dato per il periodo selezionato</td></tr>';
        return;
    }
    tbody.innerHTML = filtered.slice(0,500).map(r=>`
        <tr>
            <td style="font-size:12px;color:#666b84;white-space:nowrap">${new Date(r.created_at).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
            <td style="font-size:13px;font-weight:600;color:#171b33">${r.site_name||r.site_id||'—'}</td>
            <td><span style="background:${r.type==='pse'?'#fbf4f7':'#f4f4f8'};color:${r.type==='pse'?'#d82d6b':'#4b4d68'};font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">${r.type_label}</span></td>
            <td style="font-size:12px;color:#4b4d68;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.query||'—'}</td>
            <td class="td-center" style="font-size:12px;font-weight:700;color:#171b33">€${(parseFloat(r.cost_usd)||0).toFixed(6)}</td>
        </tr>`).join('');
}

document.getElementById('filter-period').addEventListener('change', e => {
    document.getElementById('custom-range').style.display = e.target.value === 'custom' ? 'flex' : 'none';
});

flatpickr.localize(flatpickr.l10ns.it);
const _fpFrom = flatpickr('#date-from', { dateFormat:'d/m/Y', allowInput:true, disableMobile:true });
const _fpTo   = flatpickr('#date-to',   { dateFormat:'d/m/Y', allowInput:true, disableMobile:true });

document.getElementById('btn-carica').addEventListener('click', render);

init();
</script>
</body>
</html>
