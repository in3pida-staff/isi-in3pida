<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletta — Imposta una nuova password</title>
    <link rel="icon" type="image/png" href="images/favicon.png?v=2">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sarabun', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFBF8;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e7e2de;
            border-radius: 16px;
            padding: 44px 40px;
            box-shadow: 0 8px 30px rgba(13,95,117,0.06);
        }
        .logo {
            font-family: 'Commissioner', sans-serif;
            font-weight: 500;
            font-size: 40px;
            letter-spacing: 0.16em;
            color: #0D5F75;
            text-transform: lowercase;
            text-align: center;
            margin-bottom: 8px;
        }
        h1 {
            font-family: 'Commissioner', sans-serif;
            font-weight: 500;
            font-size: 20px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 6px;
        }
        .sub { text-align: center; color: #6b6b6b; font-size: 14px; margin-bottom: 28px; }
        label { display: block; font-size: 13px; color: #444; margin-bottom: 6px; margin-top: 16px; }
        input[type=password] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9d4cf;
            border-radius: 10px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            background: #fff;
            color: #1a1a1a;
        }
        input[type=password]:focus { outline: none; border-color: #0D5F75; }
        .btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0D5F75;
            color: #fff;
            font-family: 'Commissioner', sans-serif;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background .15s;
        }
        .btn:hover { background: #0a4c5e; }
        .btn:disabled { opacity: .5; cursor: default; }
        .msg { margin-top: 18px; font-size: 14px; text-align: center; min-height: 20px; }
        .msg.error { color: #b02a4a; }
        .msg.ok { color: #0D5F75; }
        .hint { margin-top: 10px; font-size: 12px; color: #8a8a8a; }
        .back { display: block; text-align: center; margin-top: 22px; font-size: 13px; color: #0D5F75; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        #state-loading, #state-form, #state-expired { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">eletta</div>

        <div id="state-loading">
            <p class="sub">Verifica del link in corso…</p>
        </div>

        <div id="state-form">
            <h1>Imposta una nuova password</h1>
            <p class="sub">Scegli la password con cui accederai da ora in poi.</p>
            <form id="form">
                <label for="pw1">Nuova password</label>
                <input type="password" id="pw1" autocomplete="new-password" minlength="8" required>
                <label for="pw2">Ripeti la password</label>
                <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
                <p class="hint">Almeno 8 caratteri.</p>
                <button type="submit" class="btn" id="btn">Salva la password</button>
            </form>
            <div class="msg" id="msg"></div>
        </div>

        <div id="state-expired">
            <h1>Link non più valido</h1>
            <p class="sub">Il link per reimpostare la password è scaduto o è già stato usato. Richiedine uno nuovo dalla pagina di accesso.</p>
            <a class="back" href="login.html">← Torna all'accesso</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
    const _SB = window.supabase.createClient(
        'https://yyauvoqjdzrbmebeafit.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w'
    );

    const show = id => {
        ['state-loading','state-form','state-expired'].forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none');
    };
    const setMsg = (type, text) => {
        const m = document.getElementById('msg');
        m.className = 'msg ' + type;
        m.textContent = text;
    };

    let recoveryReady = false;

    // Un link di recupero valido crea una sessione (evento PASSWORD_RECOVERY o SIGNED_IN).
    _SB.auth.onAuthStateChange((event, session) => {
        if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) {
            recoveryReady = true;
            show('state-form');
        }
    });

    (async () => {
        show('state-loading');
        try {
            // Flusso PKCE: il link arriva con ?code=...
            const params = new URLSearchParams(window.location.search);
            if (params.get('code')) {
                const { error } = await _SB.auth.exchangeCodeForSession(window.location.href);
                if (error) throw error;
            }
        } catch (e) { /* gestito sotto dal controllo sessione */ }

        // Dà tempo a detectSessionInUrl/onAuthStateChange di stabilire la sessione
        await new Promise(r => setTimeout(r, 400));
        const { data: { session } } = await _SB.auth.getSession();
        if (session || recoveryReady) {
            show('state-form');
        } else {
            show('state-expired');
        }
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw1 = document.getElementById('pw1').value;
        const pw2 = document.getElementById('pw2').value;
        setMsg('', '');
        if (pw1.length < 8) { setMsg('error', 'La password deve avere almeno 8 caratteri.'); return; }
        if (pw1 !== pw2) { setMsg('error', 'Le due password non coincidono.'); return; }

        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = 'Salvataggio…';

        const { error } = await _SB.auth.updateUser({ password: pw1 });
        if (error) {
            btn.disabled = false;
            btn.textContent = 'Salva la password';
            setMsg('error', 'Non è stato possibile salvare: ' + error.message);
            return;
        }
        setMsg('ok', 'Password aggiornata. Reindirizzamento all’accesso…');
        await _SB.auth.signOut();
        setTimeout(() => { window.location.href = 'login.html?reset=ok'; }, 1400);
    });
    </script>
</body>
</html>
