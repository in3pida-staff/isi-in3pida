                            <div style="font-size:13px;color:#666b84;margin-bottom:14px;line-height:1.6">Serve un <strong>Google OAuth Client ID</strong> — si crea una volta sola e vale per tutti gli hotel.</div>
                            <ol style="font-size:13px;color:#171b33;margin:0 0 16px 16px;padding:0;line-height:2.2">
                                <li>Vai su <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:#0D5F75">console.cloud.google.com/apis/credentials</a></li>
                                <li>Abilita la <strong>Google Search Console API</strong></li>
                                <li>Crea credenziali → <strong>ID client OAuth 2.0</strong> → Applicazione web</li>
                                <li>Aggiungi origine autorizzata: <code style="background:#f4f4f8;padding:1px 6px;border-radius:3px;font-size:12px">https://isi.in3pida.it</code></li>
                                <li>Copia il <strong>Client ID</strong> e incollalo qui:</li>
                            </ol>
                            <input id="_hgsc-cid-input" type="text" placeholder="123456789-xxxx.apps.googleusercontent.com" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e4e4ec;border-radius:4px;font-size:13px;margin-bottom:8px">
                            <div id="_hgsc-cid-msg" style="font-size:12px;color:#d82d6b;margin-bottom:12px;min-height:16px"></div>
                            <div style="display:flex;gap:8px;justify-content:flex-end">
                                <button id="_hgsc-cid-cancel" class="btn-ping" style="padding:7px 18px">Annulla</button>
                                <button id="_hgsc-cid-save" class="btn-update" style="padding:7px 18px">Salva e continua</button>
                            </div></div>`;
                        document.body.appendChild(ov);
                        ov.querySelector('#_hgsc-cid-cancel').addEventListener('click', () => { document.body.removeChild(ov); rej2(new Error('annullato')); });
                        ov.querySelector('#_hgsc-cid-save').addEventListener('click', () => {
                            const v = (ov.querySelector('#_hgsc-cid-input').value || '').trim();
                            if (!v.includes('.apps.googleusercontent.com')) {
                                ov.querySelector('#_hgsc-cid-msg').textContent = 'Il Client ID deve terminare con .apps.googleusercontent.com';
                                return;
                            }
                            localStorage.setItem('isi_gsc_client_id', v);
                            document.body.removeChild(ov);
                            res2(v);
                        });
                    });
                }

                await _loadGisScript();
                let sitesData = null, userEmail = '';
                await new Promise((resolve, reject) => {
                    const tokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: clientId,
                        scope: 'https://www.googleapis.com/auth/webmasters.readonly https://www.googleapis.com/auth/userinfo.email',
                        callback: async (resp) => {
                            if (resp.error) { reject(new Error(resp.error)); return; }
                            try {
                                const meRes = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { 'Authorization': 'Bearer ' + resp.access_token } });
                                const me = await meRes.json(); userEmail = me.email || '';
                                const sitesRes = await fetch('https://searchconsole.googleapis.com/webmasters/v3/sites', { headers: { 'Authorization': 'Bearer ' + resp.access_token } });
                                const sitesJson = await sitesRes.json();
                                sitesData = { token: resp.access_token, sites: sitesJson.siteEntry || [] };

                _configInited = false;

// ─── PSE CHARTS ───────────────────────────────────────────────────────────────
function _buildPseWeeklyChart(canvasId, items, rangeDays, chartKey) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (window[chartKey]) { try { window[chartKey].destroy(); } catch(e){} }
    if (!items.length) { canvas.style.display = 'none'; return; }
    canvas.style.display = '';
    const now = new Date();
    const cutoff = rangeDays >= 9999 ? new Date(0) : new Date(now.getTime() - rangeDays * 86400000);
    const filtered = items.filter(r => r.created_at && new Date(r.created_at) >= cutoff);
    const wkOf = dt => { const d = new Date(dt); d.setHours(0,0,0,0); const day = d.getDay(); d.setDate(d.getDate() - (day===0?6:day-1)); return d.toISOString().slice(0,10); };
    const weeks = {};
    filtered.forEach(r => {
        const wk = wkOf(r.created_at);
        if (!weeks[wk]) weeks[wk] = { total:0, cited:0 };
        weeks[wk].total++;
        if (r.result?.llm_results?.groq?.cited ?? !!(r.result?.cited||r.result?.found||r.result?.match_found)) weeks[wk].cited++;
    });
    const keys = Object.keys(weeks).sort();
    if (!keys.length) { canvas.style.display = 'none'; return; }
    const labels = keys.map(w => new Date(w).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}));
    window[chartKey] = new Chart(canvas, {
        type: 'bar',
        data: {
            labels,
            datasets: [
                { label:'Query', data:keys.map(k=>weeks[k].total), backgroundColor:'#C1CBE8', borderRadius:3 },
                { label:'Citate', data:keys.map(k=>weeks[k].cited), backgroundColor:'#0D5F75', borderRadius:3 }
            ]
        },
        options: {
            responsive:true, maintainAspectRatio:true,
            plugins:{ legend:{ position:'top', labels:{ font:{size:11}, color:'#666b84', boxWidth:10 } } },
            scales:{
                x:{ ticks:{ font:{size:10}, color:'#aaa', maxTicksLimit:10 }, grid:{ display:false } },
                y:{ ticks:{ font:{size:11}, color:'#aaa', precision:0 }, grid:{ color:'#f4f4f8' }, beginAtZero:true }
            }
        }
    });
}

function _renderLlmBars(items, elId) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (!items.length) { el.style.display = 'none'; return; }
    const groqTotal = items.length;
    const groqCited = items.filter(r => r.result?.llm_results?.groq?.cited !== undefined ? r.result.llm_results.groq.cited : !!(r.result?.cited||r.result?.found||r.result?.match_found)).length;
    const groqProbs = items.map(r => r.result?.llm_results?.groq?.probability ?? r.result?.probability).filter(p => p != null);
    const groqAvgProb = groqProbs.length ? Math.round(groqProbs.reduce((a,b)=>a+b,0)/groqProbs.length) : null;
    const gemItems = items.filter(r => r.result?.llm_results?.gemini);
    const gemTotal = gemItems.length;
    const gemCited = gemItems.filter(r => r.result.llm_results.gemini.cited).length;
    const gemProbs = gemItems.map(r => r.result.llm_results.gemini.probability).filter(p => p != null);
    const gemAvgProb = gemProbs.length ? Math.round(gemProbs.reduce((a,b)=>a+b,0)/gemProbs.length) : null;
    const groqCitedPct = groqTotal > 0 ? Math.round(groqCited/groqTotal*100) : 0;
    const gemCitedPct  = gemTotal  > 0 ? Math.round(gemCited/gemTotal*100)  : 0;
    const mkRow = (name, barPct, pctLabel, count) => `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div style="width:120px;font-size:13px;color:#171b33;font-weight:500;flex-shrink:0">${name}</div><div style="flex:1;background:#f0f0f4;border-radius:3px;height:8px;overflow:hidden"><div style="height:100%;width:${Math.max(0,Math.min(100,barPct))}%;background:#0D5F75;border-radius:3px"></div></div><div style="width:44px;text-align:right;font-size:13px;color:#171b33;font-weight:500">${pctLabel}</div><div style="width:36px;text-align:right;font-size:13px;font-weight:700;color:#0D5F75">${count}</div></div>`;
    const noGem = '<div style="font-size:12px;color:#C1CBE8;padding:4px 0 2px">Gemini Flash — dati disponibili dopo le prossime query</div>';
    const citedRows = mkRow('Groq Llama 3.1', groqCitedPct, groqCitedPct+'%', groqCited) + (gemTotal>0 ? mkRow('Gemini Flash', gemCitedPct, gemCitedPct+'%', gemCited) : noGem);
    const probRows  = mkRow('Groq Llama 3.1', groqAvgProb??0, groqAvgProb!=null?groqAvgProb+'%':'—', groqAvgProb!=null?groqAvgProb+'%':'—') + (gemAvgProb!=null ? mkRow('Gemini Flash', gemAvgProb, gemAvgProb+'%', gemAvgProb+'%') : noGem);
    el.innerHTML = `<div style="font-size:15px;font-weight:700;color:#171b33;margin-bottom:14px">Distribuzione per LLM</div><div style="display:inline-flex;border:1px solid #e4e4ec;border-radius:6px;overflow:hidden;margin-bottom:18px"><button data-llmtab="cited" style="padding:6px 16px;font-size:13px;background:#e8ecf7;border:none;cursor:pointer;color:#0D5F75;font-weight:600">Citazioni</button><button data-llmtab="prob" style="padding:6px 16px;font-size:13px;background:white;border:none;border-left:1px solid #e4e4ec;cursor:pointer;color:#666b84;font-weight:400">Probabilità media</button></div><div class="llm-tab-pane" data-pane="cited">${citedRows}</div><div class="llm-tab-pane" data-pane="prob" style="display:none">${probRows}</div>`;
    el.style.display = 'block';
    el.querySelectorAll('[data-llmtab]').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.llmtab;
            el.querySelectorAll('[data-llmtab]').forEach(b => { b.style.background='white'; b.style.color='#666b84'; b.style.fontWeight='400'; });
            btn.style.background='#e8ecf7'; btn.style.color='#0D5F75'; btn.style.fontWeight='600';
            el.querySelectorAll('.llm-tab-pane').forEach(p => { p.style.display = p.dataset.pane===tab?'block':'none'; });
        });
    });
}

// ─── GAUGE E BAR CHART ────────────────────────────────────────────────────────
function gaugeHtml(pct, threshold, opts={}) {
    const cx=90, cy=88, r=68, sw=26;
    const suffix = opts.suffix ?? '%';
    const statusFn = opts.statusFn ?? (p => p >= threshold ? 'buona copertura' : 'da migliorare');
    const fillColor = pct===null ? '#e8ecf7' : '#0D5F75';
    const bgPath = `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
    let fillPath = '';
    if (pct !== null && pct > 0) {
        const p = Math.min(pct, 99.9);
        const rad = (180 - p * 1.8) * Math.PI / 180;
        const ex = (cx + r * Math.cos(rad)).toFixed(1);
        const ey = (cy - r * Math.sin(rad)).toFixed(1);
        fillPath = `<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${ex} ${ey}" fill="none" stroke="${fillColor}" stroke-width="${sw}" stroke-linecap="round"/>`;
    }
    const valText = pct !== null ? pct + suffix : '—';
    const subText = pct === null ? 'nessun dato' : statusFn(pct);
    const subColor = pct === null ? '#C1CBE8' : '#0D5F75';
    if (opts.compact) {
        const cc=90, yc=64, rc=58, sc=14;
        const bgC = `M ${cc-rc} ${yc} A ${rc} ${rc} 0 0 1 ${cc+rc} ${yc}`;
        let fillC = '';
        if (pct !== null && pct > 0) {
            const p = Math.min(pct, 99.9);
            const rad = (180 - p * 1.8) * Math.PI / 180;
            const ex = (cc + rc * Math.cos(rad)).toFixed(1);
            const ey = (yc - rc * Math.sin(rad)).toFixed(1);
            fillC = `<path d="M ${cc-rc} ${yc} A ${rc} ${rc} 0 0 1 ${ex} ${ey}" fill="none" stroke="${fillColor}" stroke-width="${sc}" stroke-linecap="round"/>`;
        }
        return `<svg viewBox="0 0 180 86" style="width:100%;max-width:180px;height:auto;display:block;margin:0 auto">` +
            `<path d="${bgC}" fill="none" stroke="#e8ecf7" stroke-width="${sc}" stroke-linecap="round"/>` +
            fillC +
            `<text x="${cc}" y="${yc+4}" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="800" fill="${pct!==null?'#171b33':'#C1CBE8'}" font-family="system-ui,sans-serif">${valText}</text>` +
            `<text x="${cc-rc}" y="${yc+16}" text-anchor="middle" font-size="8" fill="#C1CBE8" font-family="system-ui,sans-serif">0</text>` +
            `<text x="${cc+rc}" y="${yc+16}" text-anchor="middle" font-size="8" fill="#C1CBE8" font-family="system-ui,sans-serif">100</text>` +
            `<text x="${cc}" y="83" text-anchor="middle" font-size="11" font-weight="600" fill="${subColor}" font-family="system-ui,sans-serif">${subText}</text>` +
            `</svg>`;
    }
    return `<svg viewBox="0 0 180 122" style="width:100%;height:auto;display:block;margin:0 auto">` +
        `<path d="${bgPath}" fill="none" stroke="#e8ecf7" stroke-width="${sw}" stroke-linecap="round"/>` +
        fillPath +
        `<text x="${cx}" y="${cy+4}" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="800" fill="${pct!==null?'#171b33':'#C1CBE8'}">${valText}</text>` +
        `<text x="${cx-r}" y="116" text-anchor="middle" font-size="9" fill="#C1CBE8" font-family="system-ui,sans-serif">0</text>` +
        `<text x="${cx+r}" y="116" text-anchor="middle" font-size="9" fill="#C1CBE8" font-family="system-ui,sans-serif">100</text>` +
        `</svg><div style="font-size:12px;font-weight:600;color:${subColor};text-align:center;margin-top:2px">${subText}</div>`;
}

function barChartHtml(uncovered, total, covered) {
    if (total === null) return '<div style="text-align:center;color:#C1CBE8;font-size:14px;padding:28px 0">nessun dato</div>';
    const vals = [
        { l1:'SENZA',  l2:'RISPOSTA', v:uncovered??0, tip:'Categorie di domande degli ospiti senza una risposta configurata.' },
        { l1:'QUERY',  l2:'TOTALI',   v:total,        tip:'Numero totale di categorie di domande degli ospiti monitorate.' },
        { l1:'QUERY',  l2:'COPERTE',  v:covered??0,   tip:'Categorie di domande con risposta configurata, leggibili dai motori AI.' }
    ];
    const maxV = Math.max(...vals.map(x=>x.v), 1);
    const W=420, H=158, barW=52, padL=38, padR=8, padT=24, padB=52;
    const areaW = W - padL - padR;
    const areaH = H - padT - padB;
    const n = vals.length;
    const spc = Math.round((areaW - n*barW) / (n+1));
    let svg = '';
    const half = Math.round(maxV / 2);
    [0, half, maxV].forEach((v, ti) => {
        const gy = (padT + areaH * (1 - v/maxV)).toFixed(1);
        svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="${ti===0?'#dde0ea':'#f0f2f8'}" stroke-width="${ti===0?'1.5':'1'}"/>`;
        svg += `<text x="${padL-5}" y="${(parseFloat(gy)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af" font-family="system-ui,sans-serif">${v}</text>`;
    });
    svg += `<line x1="${padL}" y1="${padT-6}" x2="${padL}" y2="${padT+areaH}" stroke="#dde0ea" stroke-width="1.5"/>`;
    vals.forEach((it, i) => {
        const x = padL + spc + i*(barW+spc);
        const xc = x + barW/2;
        const h = Math.max(Math.round(it.v/maxV*areaH), 2);
        const y = padT + areaH - h;
        svg += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="#0D5F75"/>`;
        svg += `<text x="${xc}" y="${y-6}" text-anchor="middle" font-size="13" font-weight="800" fill="#171b33" font-family="system-ui,sans-serif">${it.v}</text>`;
        const ly1 = padT + areaH + 13;
        const ly2 = ly1 + 11;
        svg += `<text x="${xc}" y="${ly1}" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9ca3af" font-family="system-ui,sans-serif" letter-spacing=".4">${it.l1}</text>`;
        svg += `<text x="${xc}" y="${ly2}" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9ca3af" font-family="system-ui,sans-serif" letter-spacing=".4">${it.l2}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">${svg}</svg>`;
}

// ─── SCORE HISTORY CHART ──────────────────────────────────────────────────────
let _hScoreChartInstance = null;
async function initScoreHistoryChart(site, geoAvg, cs, covPct) {
    const canvas = document.getElementById('hchart-score-history');
    if (!canvas) return;

    const faqData = site.faq_data || {};
    const todayStr = new Date().toISOString().slice(0, 10);
    const geoSub = faqData.geo || {};

    let history = Array.isArray(faqData.score_history) ? [...faqData.score_history] : [];
    try {
        const { data: fresh } = await _SBq.from('isi_sites').select('faq_data').eq('site_id', site.site_id).single();
        const dbHistory = Array.isArray(fresh?.faq_data?.score_history) ? fresh.faq_data.score_history : [];
        if (dbHistory.length > history.length) history = [...dbHistory];
    } catch(_) {}

    const todayEntry = history.find(h => h.date === todayStr);
    if (todayEntry) {
        if (todayEntry.ai_readiness === undefined) {
            todayEntry.ai_readiness = geoSub.ai_readiness ?? null;
            todayEntry.answer_extraction = geoSub.answer_extraction ?? null;
            todayEntry.quality_safety = geoSub.quality_safety ?? null;
            todayEntry.ai_visibility = geoSub.ai_visibility ?? null;
            _SBq.from('isi_sites').update({ faq_data: { ...faqData, score_history: history } }).eq('site_id', site.site_id).then(() => {});
        }
    } else if (geoAvg !== null || cs !== null || covPct !== null) {
        history.push({ date: todayStr, geo: geoAvg, completeness: cs, coverage: covPct,
            ai_readiness: geoSub.ai_readiness ?? null, answer_extraction: geoSub.answer_extraction ?? null,
            quality_safety: geoSub.quality_safety ?? null, ai_visibility: geoSub.ai_visibility ?? null });
        _SBq.from('isi_sites').update({ faq_data: { ...faqData, score_history: history } }).eq('site_id', site.site_id).then(() => {});
    }

    history.sort((a, b) => a.date.localeCompare(b.date));
    faqData.score_history = history;

    const COLORS  = ['#0D5F75', '#2a8a9e', '#8aa8bc', '#666b84'];
    const KEYS    = ['ai_readiness', 'answer_extraction', 'quality_safety', 'ai_visibility'];
    const SUFFIXES = ['', '', '', ''];
    let currentDays = 30;
    const visible = [true, true, true, true];

    function filtered(days) {
        if (days >= 9000) return history;
        const cut = new Date(); cut.setDate(cut.getDate() - days);
        const cutStr = cut.toISOString().slice(0, 10);
        return history.filter(h => h.date >= cutStr);
    }

    function fmtDate(d) {
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
    }

    function updateSummary(data) {
        KEYS.forEach((k, i) => {
            const vals = data.map(h => h[k]).filter(v => v !== null && v !== undefined);
            const last = vals.length ? vals[vals.length - 1] : null;
            const first = vals.length > 1 ? vals[0] : null;
            const valEl = document.getElementById('hsc-val-' + i);
            const deltaEl = document.getElementById('hsc-delta-' + i);
            if (valEl) valEl.textContent = last !== null ? last + SUFFIXES[i] : '—';
            if (deltaEl && last !== null && first !== null) {
                const d = last - first;
                const sign = d > 0 ? '+' : '';
                deltaEl.textContent = sign + d + SUFFIXES[i] + ' nel periodo';
                deltaEl.style.color = d > 0 ? '#0D5F75' : d < 0 ? '#b00020' : '#9ca3af';
            } else if (deltaEl) { deltaEl.textContent = ''; }
        });
    }

    function aggregateWeekly(data) {
        if (data.length <= 8) return data;
        const weeks = {};
        data.forEach(h => {
            const d = new Date(h.date + 'T00:00:00');
            const mon = new Date(d); mon.setDate(d.getDate() - d.getDay() + 1);
            const key = mon.toISOString().slice(0, 10);
            if (!weeks[key]) weeks[key] = { date: key, _items: [] };
            weeks[key]._items.push(h);
        });
        const weekly = Object.values(weeks).map(w => {
            const items = w._items;
            const avg = k => { const vs = items.map(i => i[k]).filter(v => v != null); return vs.length ? Math.round(vs.reduce((a,b)=>a+b,0)/vs.length) : null; };
            return { date: w.date, geo: avg('geo'), completeness: avg('completeness'), coverage: avg('coverage'), ai_readiness: avg('ai_readiness'), answer_extraction: avg('answer_extraction'), quality_safety: avg('quality_safety'), ai_visibility: avg('ai_visibility') };
        }).sort((a,b) => a.date.localeCompare(b.date));
        return weekly;
    }

    function render(days) {
        const raw = filtered(days);
        let data = aggregateWeekly(raw);
        while (data.length > 1 && KEYS.every(k => data[data.length - 1][k] == null)) data = data.slice(0, -1);
        const labels = data.map(h => fmtDate(h.date));
        updateSummary(data);
        const datasets = KEYS.map((k, i) => ({
            label: ['AI Readiness', 'Answer Extraction', 'Quality Safety', 'AI Visibility'][i],
            data: data.map(h => h[k] ?? null),
            borderColor: COLORS[i],
            backgroundColor: 'transparent',
            fill: false,
            tension: 0.35,
            pointRadius: 0,
            pointHoverRadius: 4.5,
            pointBackgroundColor: COLORS[i],
            pointBorderColor: COLORS[i],
            borderWidth: 2.5,
            spanGaps: true,
            hidden: !visible[i],
        }));
        if (_hScoreChartInstance) _hScoreChartInstance.destroy();
        _hScoreChartInstance = new Chart(canvas, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'white', titleColor: '#171b33', bodyColor: '#4b4d68',
                        borderColor: '#e4e4ec', borderWidth: 1, padding: 9,
                        usePointStyle: true,
                        bodyFont: { size: 11 }, titleFont: { size: 11 },
                        callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y ?? '—') }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9ca3af', maxTicksLimit: 8 } },

                }
            }
        });
    }

    render(currentDays);

    document.querySelectorAll('.hsc-range').forEach(el => {
        el.addEventListener('click', () => {
            currentDays = parseInt(el.dataset.days);
            document.querySelectorAll('.hsc-range').forEach(r => {
                const active = r === el;
                r.style.color = active ? '#0D5F75' : '#9ca3af';

                r.style.paddingBottom = active ? '2px' : '0';
            });
            render(currentDays);
        });
    });

    document.querySelectorAll('.hsc-metric').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);

                _hScoreChartInstance.data.datasets[idx].hidden = !visible[idx];
                _hScoreChartInstance.update();
            }
        });
    });
}

// ─── GEO MINI CHART ───────────────────────────────────────────────────────────
let _geoMiniChartInst = null;
function initGeoScoreMiniChart(site) {
    const canvas = document.getElementById('hchart-geo-score-mini');
    if (!canvas) return;
    const faqData = site.faq_data || {};
    const history = Array.isArray(faqData.score_history) ? [...faqData.score_history] : [];
    history.sort((a, b) => a.date.localeCompare(b.date));
    if (history.length === 0) { if (canvas.parentElement?.parentElement) canvas.parentElement.parentElement.style.display = 'none'; return; }
    let _miniDays = 30;

    function filteredMini(days) {
        if (days >= 9000) return history;
        const cut = new Date(); cut.setDate(cut.getDate() - days);
        const cutStr = cut.toISOString().slice(0, 10);
        return history.filter(h => h.date >= cutStr);
    }

    function aggregateMiniWeekly(data) {
        if (data.length <= 8) return data;
        const weeks = {};
        data.forEach(h => {
            const d = new Date(h.date + 'T00:00:00');
            const mon = new Date(d); mon.setDate(d.getDate() - d.getDay() + 1);
            const key = mon.toISOString().slice(0, 10);
            if (!weeks[key]) weeks[key] = { date: key, _items: [] };
            weeks[key]._items.push(h);
        });
        return Object.values(weeks).map(w => {
            const items = w._items;
            const avg = k => { const vs = items.map(i => i[k]).filter(v => v != null); return vs.length ? Math.round(vs.reduce((a,b)=>a+b,0)/vs.length) : null; };
            return { date: w.date, geo: avg('geo'), completeness: avg('completeness'), coverage: avg('coverage') };
        }).sort((a,b) => a.date.localeCompare(b.date));
    }

    function renderMini(days) {
        const raw = filteredMini(days).length ? filteredMini(days) : history;
        let data = aggregateMiniWeekly(raw);
        while (data.length > 1 && ['geo','completeness','coverage'].every(k => data[data.length-1][k] == null)) data = data.slice(0,-1);
        const labels = data.map(h => { const dt = new Date(h.date+'T00:00:00'); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}); });
        const datasets = [
            { label:'GEO Score',    data:data.map(h=>h.geo??null),        borderColor:'#0D5F75', backgroundColor:'transparent', fill:false, tension:0.35, pointRadius:0, pointHoverRadius:3.5, pointBackgroundColor:'#0D5F75', pointBorderColor:'#0D5F75', borderWidth:2.5, spanGaps:true },
            { label:'Completezza',  data:data.map(h=>h.completeness??null),borderColor:'#5c6ac4', backgroundColor:'transparent', fill:false, tension:0.35, pointRadius:0, pointHoverRadius:3.5, pointBackgroundColor:'#5c6ac4', pointBorderColor:'#5c6ac4', borderWidth:2.5, spanGaps:true },
            { label:'Coverage FAQ', data:data.map(h=>h.coverage??null),   borderColor:'#a29bfe', backgroundColor:'transparent', fill:false, tension:0.35, pointRadius:0, pointHoverRadius:3.5, pointBackgroundColor:'#a29bfe', pointBorderColor:'#a29bfe', borderWidth:2.5, spanGaps:true },
        ];
        if (_geoMiniChartInst) _geoMiniChartInst.destroy();
        _geoMiniChartInst = new Chart(canvas, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                layout: { padding: { right: 10 } },
                interaction: { mode:'index', intersect:false },
                plugins: {
                    legend: { display:false },
                    tooltip: { backgroundColor:'white', titleColor:'#171b33', bodyColor:'#4b4d68', borderColor:'#e4e4ec', borderWidth:1, padding:7, usePointStyle:true, bodyFont:{size:11}, titleFont:{size:11}, callbacks:{ label: ctx => ' '+ctx.dataset.label+': '+(ctx.parsed.y??'—') } }
                },
                scales: {
                    x: { grid:{ display:false }, ticks:{ font:{size:10}, color:'#9ca3af', maxTicksLimit:6 } },
                    y: { min:0, max:100, grid:{ color:'#f0f0f5', drawBorder:false }, ticks:{ font:{size:10}, color:'#9ca3af', stepSize:25 } }
                }
            }
        });
    }

    renderMini(_miniDays);

    document.querySelectorAll('.hgeo-mini-range').forEach(el => {
        el.addEventListener('click', () => {
            _miniDays = parseInt(el.dataset.days);
            document.querySelectorAll('.hgeo-mini-range').forEach(r => {
                const active = r === el;
                r.style.color = active ? '#0D5F75' : '#9ca3af';
                r.style.borderBottom = active ? '2px solid #0D5F75' : 'none';
                r.style.paddingBottom = active ? '2px' : '0';
            });
            renderMini(_miniDays);
        });
    });
}

                return `<tr style="border-bottom:1px solid #f4f4f8"><td style="padding:5px 8px 5px 0;color:#171b33;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(page_url)}</td><td style="padding:5px 8px;color:#666b84">${esc(event_type)}</td><td style="padding:5px 0;text-align:right;color:#0D5F75;font-weight:600">${count}</td></tr>`;
            }).join('') +
            '</table></div></div>';
    }

    if (!html) {
        html = `<div class="card" style="${cardStyle}"><div style="padding:20px 24px;font-size:14px;color:#666b84">Nessun dato. Collega Google Search Console dalla sezione Configurazione.</div></div>`;
    }

    cont.innerHTML = html;

    if (cfg.gsc_email && cfg.gsc_site && cfg.gsc_token) {
        const datiGscCont = document.getElementById('hdati-gsc-container');
        let _activeToken = cfg.gsc_token;
        let _activeTokenTs = cfg.gsc_token_ts || 0;
        try {
            const _ls = JSON.parse(localStorage.getItem('isi_gsc_tok_' + site.site_id) || 'null');
            if (_ls && _ls.ts && _ls.ts > _activeTokenTs) { _activeToken = _ls.token; _activeTokenTs = _ls.ts; }
        } catch {}
        const tokenAgeSec = _activeTokenTs ? (Date.now() - _activeTokenTs) / 1000 : Infinity;
        let _gscActiveDays = 28;

        function _gscDateRange(days) {
            const end = new Date();
            const start = days >= 9999 ? new Date(end.getTime() - 16*30*86400000) : new Date(end.getTime() - days*86400000);
            return { startDate: start.toISOString().slice(0,10), endDate: end.toISOString().slice(0,10) };
        }

        async function _fetchGscData(token, days) {
            const { startDate, endDate } = _gscDateRange(days);
            const base = `https://searchconsole.googleapis.com/webmasters/v3/sites/${encodeURIComponent(cfg.gsc_site)}/searchAnalytics/query`;
            const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
            const [qRes, pRes, totRes] = await Promise.all([
                fetch(base, { method:'POST', headers, body: JSON.stringify({ startDate, endDate, dimensions:['query'], rowLimit:10 }) }),
                fetch(base, { method:'POST', headers, body: JSON.stringify({ startDate, endDate, dimensions:['page'], rowLimit:10 }) }),
                fetch(base, { method:'POST', headers, body: JSON.stringify({ startDate, endDate, dimensions:[], rowLimit:1 }) }),
            ]);
            if (!qRes.ok) throw new Error('token_expired_' + qRes.status);
            const [qj, pj, tj] = await Promise.all([qRes.json(), pRes.json(), totRes.json()]);
            const totRow = tj.rows?.[0] || {};
            return {
                queries: qj.rows || [],
                pages: pj.rows || [],
                totals: { clicks: totRow.clicks||0, impressions: totRow.impressions||0, ctr: totRow.ctr||0, position: totRow.position||0 }
            };
        }

        function _renderGscFull(data) {
            if (!datiGscCont) return;
            const { queries: qRows = [], pages: pRows = [], totals = {} } = data;
            const fmt = n => n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n);
            const bx = (label, value, sub) => `<div style="background:white;border:1px solid #e4e4ec;border-radius:4px;padding:14px 16px;text-align:center"><div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${label}</div><div style="font-size:28px;font-weight:800;color:#171b33;line-height:1">${value}</div><div style="font-size:11px;color:#666b84;margin-top:4px">${sub}</div></div>`;
            const tbl = (rows, col1) => `<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="color:#9ca3af;border-bottom:1px solid #f0f0f5"><td style="padding:4px 8px 4px 0">${col1}</td><td style="padding:4px 8px;text-align:right">Click</td><td style="padding:4px 8px;text-align:right">Impr.</td><td style="padding:4px 8px;text-align:right">CTR</td><td style="padding:4px 0;text-align:right">Pos.</td></tr>${rows.map(r=>`<tr style="border-bottom:1px solid #f4f4f8"><td style="padding:5px 8px 5px 0;color:#171b33;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.keys[0])}</td><td style="padding:5px 8px;text-align:right;color:#0D5F75;font-weight:600">${r.clicks}</td><td style="padding:5px 8px;text-align:right;color:#666b84">${r.impressions}</td><td style="padding:5px 8px;text-align:right;color:#666b84">${(r.ctr*100).toFixed(1)}%</td><td style="padding:5px 0;text-align:right;color:#666b84">${r.position.toFixed(1)}</td></tr>`).join('')}</table>`;
            const rangeLabel = _gscActiveDays===28?'ultimi 28 gg':_gscActiveDays===180?'ultimi 6 mesi':'tutti i dati';
            datiGscCont.innerHTML =
                `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;border-bottom:1px solid #f4f4f8">` +
                `<div style="font-size:11px;color:#666b84">Dati GSC — ${rangeLabel}</div>` +
                `<div style="display:flex;gap:14px">${[{d:28,l:'1M'},{d:180,l:'6M'},{d:9999,l:'Sempre'}].map(r=>`<span class="hgsc-range-btn" data-days="${r.d}" style="font-size:12px;font-weight:700;cursor:pointer;${_gscActiveDays===r.d?'color:#0D5F75;border-bottom:2px solid #0D5F75;padding-bottom:2px':'color:#9ca3af'}">${r.l}</span>`).join('')}</div>` +
                `</div>` +
                `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px">${bx('CLICK TOTALI',fmt(totals.clicks||0),'clic organici')}${bx('IMPRESSION TOTALI',fmt(totals.impressions||0),'visualizzazioni')}${bx('CTR MEDIO',totals.impressions?((totals.ctr||0)*100).toFixed(1)+'%':'—','click-through rate')}${bx('POSIZIONE MEDIA',totals.impressions?(totals.position||0).toFixed(1):'—','posizione media SERP')}</div>` +
                (qRows.length ? `<div style="padding:0 20px 14px"><div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">TOP QUERY</div>${tbl(qRows,'Query')}</div>` : '') +
                (pRows.length ? `<div style="padding:0 20px 14px;border-top:1px solid #f4f4f8"><div style="font-size:11px;font-weight:700;color:#666b84;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">TOP PAGINE</div>${tbl(pRows,'Pagina')}</div>` : '');
            datiGscCont.querySelectorAll('.hgsc-range-btn').forEach(btn => {
                btn.addEventListener('click', () => { _gscActiveDays = parseInt(btn.dataset.days); _loadGscData(); });
            });
        }

        async function _saveToken(token) {
            const now = Date.now();
            _activeToken = token; _activeTokenTs = now;
            try { localStorage.setItem('isi_gsc_tok_' + site.site_id, JSON.stringify({ token, ts: now })); } catch {}
            try {
                const { data: fresh } = await _SBq.from('isi_sites').select('hotel_profile').eq('site_id', site.site_id).single();
                const hp = fresh?.hotel_profile || site?.hotel_profile || {};
                const nc = { ...(hp.isi_config || {}), gsc_token: token, gsc_token_ts: now };
                await _SBq.from('isi_sites').update({ hotel_profile: { ...hp, isi_config: nc } }).eq('site_id', site.site_id);
                if (site?.hotel_profile?.isi_config) { site.hotel_profile.isi_config.gsc_token = token; site.hotel_profile.isi_config.gsc_token_ts = now; }
            } catch { /* token già in localStorage */ }
        }

        function _silentRefresh() {
            const clientId = localStorage.getItem('isi_gsc_client_id');
            if (!clientId || !window.google?.accounts?.oauth2) return Promise.reject(new Error('no_gis'));
            return new Promise((resolve, reject) => {
                const t = setTimeout(() => reject(new Error('timeout')), 6000);
                window.google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/webmasters.readonly',
                    hint: cfg.gsc_email || '',
                    callback: async function(resp) {
                        clearTimeout(t);
                        if (resp.error) { reject(new Error(resp.error)); return; }
                        await _saveToken(resp.access_token);
                        resolve(resp.access_token);
                    }
                }).requestAccessToken({ prompt: 'none' });
            });
        }

        function _autoReconnect() {
            const clientId = localStorage.getItem('isi_gsc_client_id');
            if (!clientId || !window.google?.accounts?.oauth2) return Promise.reject(new Error('no_gis'));
            return new Promise((resolve, reject) => {
                const t = setTimeout(() => reject(new Error('timeout')), 20000);
                window.google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/webmasters.readonly',
                    hint: cfg.gsc_email || '',
                    callback: async function(resp) {
                        clearTimeout(t);
                        if (resp.error) { reject(new Error(resp.error)); return; }
                        await _saveToken(resp.access_token);
                        resolve(resp.access_token);
                    }
                }).requestAccessToken({ prompt: '' });
            });
        }

        function _showReconnectBtn() {
            if (!datiGscCont) return;
            const clientId = localStorage.getItem('isi_gsc_client_id');
            datiGscCont.innerHTML =
                '<div style="display:flex;align-items:center;gap:12px;padding:16px 20px">' +
                '<span style="font-size:13px;color:#666b84">Aggiorna la sessione Google per vedere i dati.</span>' +
                '<button id="hbtn-gsc-reconnect" style="background:#0D5F75;color:white;border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Riconnetti Google</button>' +
                '</div>';
            const btn = document.getElementById('hbtn-gsc-reconnect');
            if (!btn || !clientId || !window.google?.accounts?.oauth2) return;
            btn.addEventListener('click', function() {
                btn.textContent = 'Connessione in corso…';
                btn.disabled = true;
                window.google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/webmasters.readonly',
                    callback: async function(resp) {
                        if (resp.error) { btn.textContent = 'Riprova'; btn.disabled = false; return; }
                        await _saveToken(resp.access_token);
                        _loadGscData();
                    }
                }).requestAccessToken({ prompt: 'select_account' });
                setTimeout(() => { if (btn.disabled) { btn.textContent = 'Riprova'; btn.disabled = false; } }, 20000);
            });
        }

        async function _loadGscData() {
            if (datiGscCont) datiGscCont.innerHTML = '<div style="padding:16px 20px;font-size:13px;color:#666b84">Caricamento...</div>';
            let token = _activeToken;
            if (tokenAgeSec >= 3000) {
                try { token = await _silentRefresh(); } catch { /* usa token esistente */ }
            }
            try {
                const data = await _fetchGscData(token, _gscActiveDays);
                _renderGscFull(data);
            } catch(e) {
                if (e.message?.includes('token_expired')) {
                    try { token = await _silentRefresh(); const data = await _fetchGscData(token, _gscActiveDays); _renderGscFull(data); return; } catch {}
                    if (datiGscCont) datiGscCont.innerHTML = '<div style="padding:16px 20px;font-size:13px;color:#666b84">Aggiornamento sessione Google...</div>';
                    try { token = await _autoReconnect(); const data = await _fetchGscData(token, _gscActiveDays); _renderGscFull(data); return; } catch {}
                    _showReconnectBtn();
                }
                else if (datiGscCont) datiGscCont.innerHTML = '<div style="padding:16px 20px;font-size:13px;color:#666b84">Errore nel caricamento dati GSC.</div>';
            }
        }

        _loadGscData();
    }
}

    if (!query) { input?.focus(); return; }
    if (!_site) { if(res){res.innerHTML='<div style="color:#d82d6b;font-size:13px">Sessione non disponibile</div>';res.style.display='block';} return; }
    const siteId = _site.site_id;
    const hp = _site.hotel_profile || {};
    const sc = _site.schema_data || {};
    const hotelCtx = {
        nome: sc.name || hp.nome_hotel || hp.nome || '',
        citta: sc.city || hp.citta || '',
        servizi: hp.servizi || sc.amenities?.join(', ') || '',
        descrizione: sc.description || hp.descrizione || '',
    };
    btn.disabled = true; btn.textContent = '⏳ Analisi in corso...';
    if(res) res.style.display = 'none';
    try {
        await _SBq.from('isi_sites').update({ pse_enabled: true }).eq('site_id', siteId);
        const { data: { session: sess } } = await _SB.auth.getSession();
        if (!sess) throw new Error('Sessione scaduta');
        const r = await fetch(`${SUPABASE_URL}/functions/v1/pse-query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sess.access_token },
            body: JSON.stringify({ site_id: siteId, query, hotel_context: hotelCtx })
        });
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || 'Errore PSE');
        const d = json.result || {};
        const groqP = d.llm_results?.groq?.probability ?? d.probability ?? null;
        const gemP  = d.llm_results?.gemini?.probability ?? null;
        const avgP  = gemP !== null ? Math.round((groqP + gemP) / 2) : groqP;
        const color = avgP !== null ? (avgP >= 60 ? '#0D5F75' : avgP >= 35 ? '#666b84' : '#d82d6b') : '#aaa';
        const verdict = d.verdict || (avgP >= 60 ? 'Probabile' : avgP >= 35 ? 'Incerto' : 'Improbabile');
        let html = `<div style="background:#f7f8fc;border-radius:8px;padding:18px 20px;border:1px solid #e4e4ec">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
                <div style="font-size:36px;font-weight:800;line-height:1;color:${color}">${avgP !== null ? avgP+'%' : '—'}</div>
                <div>
                    <div style="font-size:15px;font-weight:700;color:#171b33">${verdict}</div>
                    <div style="font-size:12px;color:#666b84;margin-top:2px">${gemP !== null ? 'Groq: '+groqP+'% &nbsp;•&nbsp; Gemini: '+gemP+'%' : 'Groq: '+(groqP ?? '—')+'%'}</div>
                </div>
            </div>`;
        if (d.why) html += `<div style="font-size:13px;color:#4b4d68;line-height:1.6;margin-bottom:10px">${esc(d.why)}</div>`;
        if (d.sample_answer) html += `<div style="font-size:13px;color:#171b33;background:white;border-left:3px solid #0D5F75;padding:8px 12px;border-radius:0 4px 4px 0;font-style:italic;margin-bottom:10px;line-height:1.6">"${esc(d.sample_answer)}"</div>`;
        if (d.suggestions?.length) html += `<div style="font-size:12px;color:#0D5F75;font-weight:600;margin-bottom:4px">Suggerimenti:</div><ul style="margin:0;padding-left:18px;font-size:13px;color:#4b4d68;line-height:1.7">${d.suggestions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
        html += '</div>';
        if(res){ res.innerHTML = html; res.style.display = 'block'; }
        setTimeout(() => { _pseChartsInited = false; }, 1200);
    } catch(e) {
        if(res){ res.innerHTML = `<div style="color:#d82d6b;font-size:13px">${esc(e.message)}</div>`; res.style.display = 'block'; }
    } finally {
        btn.disabled = false; btn.textContent = '✦ Analizza';
    }
};

// ─── GSC HELPERS ──────────────────────────────────────────────────────────────
async function _loadGisScript() {
    if (window.google?.accounts?.oauth2) return;
    await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
    });
}

async function _refreshGscTokenSilently(siteId, siteObj) {
    const clientId = localStorage.getItem('isi_gsc_client_id');
    if (!clientId) throw new Error('client_id_mancante');
    await _loadGisScript();
    return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('timeout')), 8000);
        const tc = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/webmasters.readonly',
            callback: async (resp) => {
                clearTimeout(timeout);
                if (resp.error) { reject(new Error(resp.error)); return; }
                try {
                    const { data: fresh } = await _SBq.from('isi_sites').select('hotel_profile').eq('site_id', siteId).single();
                    const hp = fresh?.hotel_profile || siteObj?.hotel_profile || {};
                    const newCfg = { ...(hp.isi_config || {}), gsc_token: resp.access_token };
                    await _SBq.from('isi_sites').update({ hotel_profile: { ...hp, isi_config: newCfg } }).eq('site_id', siteId);
                    if (siteObj?.hotel_profile?.isi_config) siteObj.hotel_profile.isi_config.gsc_token = resp.access_token;
                } catch { /* salvataggio fallito, usiamo il token in memoria */ }
                resolve(resp.access_token);
            }
        });
        tc.requestAccessToken({ prompt: 'none' });
    });
}

// ─── UTIL ─────────────────────────────────────────────────────────────────────
function timeAgo(d) {
    const s=(new Date()-new Date(d))/1000;
    if(s<60) return 'Adesso';
    if(s<3600) return Math.floor(s/60)+' min fa';
    if(s<86400) return Math.floor(s/3600)+' ore fa';
    return Math.floor(s/86400)+' giorni fa';
}
function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function semverGt(a,b) {
    if (!a||!b) return false;
    if (String(a).startsWith('js-')||String(b).startsWith('js-')) return false;
    const pa=a.split('.').map(Number), pb=b.split('.').map(Number);
    for (let i=0;i<3;i++) { if ((pa[i]||0)>(pb[i]||0)) return true; if ((pa[i]||0)<(pb[i]||0)) return false; }
    return false;
}

function showToast(msg) {

        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3500);
}

    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:32px 28px 24px;max-width:520px;width:90%;position:relative;font-family:'Source Code Pro',monospace;color:#0D5F75">
        <button onclick="document.getElementById('guida-overlay').style.display='none'" style="position:absolute;right:14px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:#999;line-height:1">×</button>
        <div style="font-size:20px;font-weight:600;margin-bottom:18px;color:#0D5F75">Guida Eletta</div>
        <div style="font-size:13px;line-height:1.7;color:#35364f;max-height:65vh;overflow-y:auto;padding-right:4px">
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Panoramica</div>
          <p style="margin:0 0 12px">Eletta è la piattaforma per la visibilità nelle intelligenze artificiali, che aumenta la presenza del sito del tuo hotel nelle risposte di ChatGPT, Google Gemini, Claude, Perplexity e delle principali intelligenze artificiali.</p>
          <p style="margin:0 0 12px">Il <strong>GEO Score</strong> è l'indicatore principale di Eletta. Va da 0 a 100 e indica quanto il tuo hotel è pronto per essere trovato dalle intelligenze artificiali. Un punteggio pari o superiore a 70 indica che il sito è ottimizzato per competere nelle nuove modalità di ricerca.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Cosa fa</div>
          <p style="margin:0 0 12px">Eletta analizza il sito della tua struttura e verifica se e quanto sia leggibile, comprensibile e autorevole per le intelligenze artificiali, individuando gli elementi che ne limitano la visibilità.</p>
          <p style="margin:0 0 12px">Analizza e ottimizza i contenuti, i dati strutturati, la copertura delle ricerche (query) e la coerenza delle informazioni online. Sulla base dei risultati, individua tutte le aree da migliorare per aumentare la visibilità del tuo hotel nelle risposte generate dall'intelligenza artificiale.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Schema.org — Dati strutturati</div>
          <p style="margin:0 0 12px">I dati strutturati aiutano le AI a comprendere e descrivere correttamente il tuo hotel. Completa le informazioni sulla struttura, le camere, i servizi, i contatti e la posizione. Più il profilo è completo, più aumentano le probabilità che le AI utilizzino dati corretti nelle loro risposte.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Mappa Query</div>
          <p style="margin:0 0 12px">La Mappa Query identifica e aggiorna continuamente le domande che gli utenti rivolgono alle AI quando cercano un hotel. Sulla base delle informazioni inserite nei dati strutturati Schema.org, Eletta genera automaticamente le risposte più rilevanti per ogni categoria di ricerca. In questo modo il tuo hotel amplia progressivamente la copertura delle query e aumenta le probabilità di essere citato nelle risposte di ChatGPT, Gemini, Perplexity e delle principali intelligenze artificiali.</p>
          <p style="margin:0 0 12px">Per ogni query puoi scegliere di generare una risposta automatica (<strong>✦ Genera risposta</strong>), scriverla manualmente (<strong>✎ Scrivi</strong>) oppure segnalarla come non pertinente (<strong>✕ Non rilevante</strong>). Le query segnalate non compaiono più tra quelle da coprire. Puoi recuperarle aprendo <em>Mostra non rilevanti</em> e cliccando <strong>↩ Ripristina</strong>.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Mappa Query — Intenti intelligenti</div>
          <p style="margin:0 0 12px">Eletta analizza i dati Schema.org del profilo hotel e assegna automaticamente una <strong>priorità</strong> a ciascuna categoria di query: <strong>Alta</strong> (servizio presente e rilevante), <strong>Media</strong> (generalmente utile), <strong>Bassa</strong> (marginale), <strong>Non rilevante</strong> (servizio assente — nascosta di default). In questo modo il lavoro di ottimizzazione si concentra dove ha più impatto per il tuo hotel.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Coerenza Contenuti</div>
          <p style="margin:0 0 12px">Le intelligenze artificiali confrontano le informazioni presenti su più fonti prima di formulare una risposta. Eletta verifica che dati, servizi e descrizioni siano coerenti tra sito web, OTA, Google e altri canali. Una maggiore coerenza aumenta l'affidabilità percepita del tuo hotel.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">AI Layer</div>
          <p style="margin:0 0 12px">L'AI Layer raccoglie e organizza le informazioni del tuo hotel in un formato facilmente interpretabile dalle AI. È il punto di accesso che consente ai modelli di comprendere rapidamente contenuti, servizi e caratteristiche della struttura. Mantenerlo attivo è fondamentale per una corretta visibilità nelle intelligenze artificiali.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Simulatore</div>
          <p style="margin:0 0 12px">Il Simulatore permette di testare come le intelligenze artificiali rispondono a domande specifiche sull'hotel. Inserisci una domanda come la farebbe un utente e il sistema verifica se il tuo hotel viene citato nella risposta. Usa questo strumento per capire la visibilità AI del tuo hotel su query specifiche e identificare aree di miglioramento.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Configurazione</div>
          <p style="margin:0 0 12px">La configurazione collega il sito del tuo hotel alla piattaforma Eletta. Una volta completata, permette di attivare il monitoraggio, aggiornare i dati e raccogliere informazioni utili per migliorare la presenza nelle AI.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">Google Search Console</div>
          <p style="margin:0 0 12px">Dal tab <strong>CONFIGURAZIONE</strong> puoi inserire il codice di verifica Google Search Console del tuo hotel. Una volta salvato, il plugin lo inserisce automaticamente nel <code style="background:#f4f4f8;padding:1px 6px;border-radius:4px;font-size:12px">&lt;head&gt;</code> del sito come meta tag di verifica, senza toccare manualmente il codice.</p>
          <p style="margin:0 0 12px">Il codice si trova in Google Search Console → Impostazioni → Verifica proprietà → seleziona <strong>Tag HTML</strong> → copia il valore del campo <code style="background:#f4f4f8;padding:1px 6px;border-radius:4px;font-size:12px">content</code>.</p>
          <div style="font-size:11px;font-weight:700;color:#0D5F75;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e8ecf7">FAQ</div>
          <p style="margin:0">Gestisci le domande e risposte che il tuo sito usa per rispondere alle ricerche AI. Ogni FAQ contribuisce direttamente alla copertura delle query e al GEO Score. Mantieni le risposte aggiornate, accurate e coerenti con il profilo hotel per massimizzare la visibilità nelle intelligenze artificiali.</p>
        </div>
        <div style="margin-top:22px;display:flex;justify-content:flex-end">
          <button onclick="document.getElementById('guida-overlay').style.display='none'" style="background:#C1CBE8;border:none;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:'Source Code Pro',monospace">Chiudi</button>
        </div>
      </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
    document.body.appendChild(overlay);
})();

// ─── FEEDBACK ──────────────────────────────────────────────────────────────────
(function() {
    const overlay = document.createElement('div');
    overlay.id = 'feedback-overlay';
    overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(23,27,51,.45);z-index:99999;align-items:center;justify-content:center';
    overlay.innerHTML = `
        <div style="background:white;border-radius:12px;padding:28px 28px 24px;max-width:440px;width:calc(100% - 32px);box-shadow:0 16px 48px rgba(0,0,0,.18);position:relative">
            <button onclick="document.getElementById('feedback-overlay').style.display='none'" style="position:absolute;right:14px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:#999;line-height:1">×</button>
            <div style="font-size:15px;font-weight:600;color:#171b33;margin-bottom:16px;line-height:1.4;padding-right:20px">Inviaci i tuoi suggerimenti o comunicaci un eventuale problema</div>
            <textarea id="fb-msg" placeholder="Scrivi qui..." style="width:100%;height:110px;border:1.5px solid #C1CBE8;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;box-sizing:border-box;outline:none"></textarea>
            <div style="margin-top:12px">
                <div style="font-size:12px;font-weight:600;color:#666b84;margin-bottom:6px">Rispondi all'e-mail</div>
                <input id="fb-email" type="email" style="width:100%;border:1.5px solid #C1CBE8;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;box-sizing:border-box;outline:none">
            </div>
            <div id="fb-msg-status" style="font-size:13px;margin-top:10px;display:none"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
                <button id="fb-submit" style="background:#0D5F75;color:white;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Invia feedback</button>
                <button onclick="document.getElementById('feedback-overlay').style.display='none'" style="background:none;border:1.5px solid #C1CBE8;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#171b33">Annulla</button>
            </div>
        </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
    document.body.appendChild(overlay);

    document.getElementById('fb-submit').addEventListener('click', async () => {
        const msg = document.getElementById('fb-msg').value.trim();
        const email = document.getElementById('fb-email').value.trim();
        const status = document.getElementById('fb-msg-status');
        if (!msg) { status.textContent = 'Scrivi un messaggio.'; status.style.color='#b00020'; status.style.display='block'; return; }
        const btn = document.getElementById('fb-submit');
        btn.disabled = true; btn.textContent = 'Invio…';
        try {
            const { data:{ session } } = await _SB.auth.getSession();
            const res = await fetch(SUPABASE_URL + '/functions/v1/isi-feedback', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, reply_to: email })
            });
            if (!res.ok) throw new Error('Errore invio');
            status.textContent = 'Feedback inviato. Grazie!'; status.style.color='#0D5F75'; status.style.display='block';
            document.getElementById('fb-msg').value = '';
            setTimeout(() => { overlay.style.display='none'; status.style.display='none'; }, 2000);
        } catch(e) {
            status.textContent = 'Errore durante l\'invio. Riprova.'; status.style.color='#b00020'; status.style.display='block';
        }
        btn.disabled = false; btn.textContent = 'Invia feedback';
    });
})();

// ── Linea divisoria sidebar
(function drawDivider() {
  const path = document.getElementById('h-divider-path');
  if (!path) return;
  const vh = window.innerHeight;
  const heroY = 100;
  const tiltX = (Math.tan(10 * Math.PI / 180) * heroY).toFixed(1);
  path.setAttribute('d', `M 3 ${vh} L 3 ${heroY} L ${(3 + parseFloat(tiltX)).toFixed(1)} 0`);
})();
window.addEventListener('scroll', function() {
  var scrolled = window.scrollY > 30;
  var logoImg = document.querySelector('.h-header-logo img');
  if (logoImg) logoImg.style.opacity = scrolled ? '0' : '1';
  var syncMain = document.getElementById('btn-sync-header');
  var syncAlt = document.getElementById('btn-sync-alt');
  if (syncMain) { syncMain.style.opacity = scrolled ? '0' : '1'; syncMain.style.pointerEvents = scrolled ? 'none' : 'auto'; }
  if (syncAlt) { syncAlt.style.opacity = scrolled ? '1' : '0'; syncAlt.style.pointerEvents = scrolled ? 'auto' : 'none'; }
  document.querySelectorAll('#sidebar-brand svg rect,#sidebar-brand svg path').forEach(function(el) {
    el.style.fill = scrolled ? '#0D5F75' : '#C1CBE8';
  });
});
window.addEventListener('resize', function() {
  const path = document.getElementById('h-divider-path');
  if (!path) return;
  const vh = window.innerHeight;
  const heroY = 100;
  const tiltX = (Math.tan(10 * Math.PI / 180) * heroY).toFixed(1);
  path.setAttribute('d', `M 3 ${vh} L 3 ${heroY} L ${(3 + parseFloat(tiltX)).toFixed(1)} 0`);
});
</script>
</body>
