    <style>
        .tip-q{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#EFF020;color:#0D5F75;font-size:9px;font-weight:800;cursor:default;flex-shrink:0;user-select:none;vertical-align:middle}

        /* ═══ LAYOUT PRINCIPALE ═══ */
        body{margin:0;padding:0;background:#EDEEF5;font-family:'Commissioner',sans-serif;}
        .h-layout{display:flex;min-height:100vh;}

        /* ═══ SIDEBAR ═══ */
        .h-sidebar{width:70px;min-height:100vh;background:#EDEEF5;display:flex;flex-direction:column;align-items:center;position:fixed;left:0;top:0;z-index:200;padding:10px 0 10px 20px;}
        .h-sidebar-brand{margin-bottom:14px;display:flex;align-items:center;justify-content:center;width:100%;}
        .h-sidebar-nav{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;width:100%;padding:100px 6px 0;}
        .h-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 4px;background:none;border:none;cursor:pointer;color:rgba(13,95,117,0.55);font-family:'Commissioner',sans-serif;font-size:10px;font-weight:700;letter-spacing:.01em;transition:all .15s;text-align:center;line-height:1.1;border-radius:10px;}
        .h-nav-item:hover{color:#0D5F75;}
        .h-nav-item.active{color:#0D5F75;}
        .h-nav-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;opacity:0.65;transition:opacity .15s;}
        .h-nav-icon svg{width:100%;height:100%;}
        .h-nav-item:hover .h-nav-icon{opacity:0.85;}
        .h-nav-item.active .h-nav-icon{opacity:1;}
        .h-nav-item.active .h-nav-icon svg circle{fill:#0D5F75!important;}
        .h-nav-item.active .h-nav-icon svg path,.h-nav-item.active .h-nav-icon svg rect,.h-nav-item.active .h-nav-icon svg polyline,.h-nav-item.active .h-nav-icon svg line,.h-nav-item.active .h-nav-icon svg polygon{fill:#fff!important;stroke:#fff!important;}
        .h-sidebar-sep{width:40px;height:1px;background:rgba(255,255,255,0.5);margin:8px 0;}
        .h-sidebar-bottom{width:100%;display:flex;flex-direction:column;align-items:center;padding:0 6px;}

        /* ═══ AREA DESTRA ═══ */
        .h-right{margin-left:70px;flex:1;display:flex;flex-direction:column;min-height:100vh;}

        /* ═══ HEADER ═══ */
        .h-header{background:transparent;height:52px;display:flex;align-items:center;padding:0 20px 0 40px;position:sticky;top:0;z-index:100;gap:14px;}
        .h-main-left{padding-left:40px;}
        .h-header-logo{display:flex;align-items:center;}
        .h-header-logo img{height:22px;width:auto;}
        .h-btn-sync{background:#EFF020;color:#0D5F75;border:0.5px solid #0D5F75;border-radius:24px;padding:8px 21px;font-family:'Commissioner',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;flex-shrink:0;}
        .h-btn-sync:hover{opacity:.88;}
        .h-btn-sync:disabled{opacity:.5;cursor:not-allowed;}
        .h-header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
        .h-bell{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#666b84;transition:background .15s;position:relative;}
        .h-bell:hover{background:#f4f4f8;}
        .h-bell-dot{position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:#ff6b2b;border:1.5px solid white;}

        /* ═══ HERO ═══ */
        .h-hero{background:#C1CBE8;padding:33px 28px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:16px;box-shadow:0 0 0 3px #C1CBE8;margin:10px 5% 30px 5%;position:relative;overflow:visible;}
        .h-hero-name{font-family:'Commissioner',sans-serif;font-size:35px;font-weight:300;color:#fff;flex-shrink:0;}
        .h-hero-chips{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
        .h-chip{background:#fff;border:none;border-radius:24px;padding:7px 17px;font-size:13px;color:#0D5F75;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Source Code Pro',monospace;font-weight:400;}
        .h-chip-lbl{font-size:12px;opacity:.65;font-weight:400;font-family:'Source Code Pro',monospace;}
        .h-chip-geo{font-weight:400;font-size:13px;font-family:'Source Code Pro',monospace;}

        /* ═══ CONTENT ═══ */
        .h-content{background:#EDEEF5;flex:1;padding:18px 18px 40px;}

        /* ═══ DASHBOARD HEADING ═══ */
        .h-dash-title{font-family:'Commissioner',sans-serif;font-size:33px;font-weight:400;color:#0D5F75;margin:0 0 14px;}

        /* ═══ KPI ROW ═══ */
        /* ═══ KPI ROW ═══ */
        .h-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px;max-width:84%;}
        .h-kpi{background:white;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.06);padding:19px 22px;position:relative;overflow:hidden;}
        .h-kpi-ttl{font-size:16px;font-weight:300;color:#0D5F75;letter-spacing:.01em;margin-bottom:10px;display:flex;align-items:center;gap:4px;font-family:'Commissioner',sans-serif;}
        .h-kpi-val{font-size:34px;font-weight:700;line-height:1;color:#0D5F75;font-family:'Commissioner',sans-serif;}
        .h-kpi-sub{font-size:18px;font-weight:400;color:#b0b7c2;margin-top:6px;font-family:'Source Code Pro',monospace;}
        .h-kpi-sub-nd{color:#C1CBE8;}
        .h-kpi-deco{position:absolute;bottom:4px;right:8px;opacity:0.13;pointer-events:none;}

        /* ═══ MAIN GRID: sinistra + destra ═══ */
        .h-main-grid{display:grid;grid-template-columns:1fr 285px;gap:12px;align-items:start;}

        /* ═══ CARD UNIVERSALE ═══ */
        .h-card{background:white;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.06);overflow:hidden;margin-bottom:12px;}
        .h-card-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
        .h-card-hdr-t{font-size:12px;font-weight:700;color:#0D5F75;display:flex;align-items:center;gap:6px;font-family:'Commissioner',sans-serif;}
        .h-card-body{padding:14px 16px;}
        .h-dot-ok{background:#0D5F75;} .h-dot-warn{background:var(--magenta);} .h-dot-err{background:var(--red);} .h-dot-nd{background:#ccc;}
        .h-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

        /* ═══ STATS + GEO ROW ═══ */
        .h-stats-row{display:flex;align-items:stretch;gap:24px;margin-bottom:12px;}
        .h-range-btn{font-size:10px;font-weight:300;cursor:pointer;color:#aaa;padding:4px 18px;border-radius:20px;border:1.5px solid #edeef5;transition:all .15s;font-family:'Commissioner',sans-serif;}
        .h-range-btn.active-range{color:#0D5F75;border:1.5px solid #0D5F75;background:white;}

        /* ═══ SECTION HEADING ═══ */
        .h-sec-hdr{display:flex;align-items:center;gap:10px;margin:18px 0 10px;}
        .h-sec-icon{width:28px;height:28px;border-radius:50%;background:#0D5F75;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-sec-texts{line-height:1.2;}
        .h-sec-title{font-family:'Commissioner',sans-serif;font-size:17px;font-weight:700;color:#171b33;margin:0;}
        .h-sec-sub{font-size:10px;color:#888;margin:0;}

        /* ═══ ELETTA CARD (float destra) ═══ */
        .h-eletta{background:#C1CBE8;border-radius:16px;padding:32px 16px calc(20px + 5vh) 46px;display:flex;flex-direction:column;align-items:flex-start;margin-left:-20px;margin-right:-18px;position:sticky;top:70px;}
        .h-eletta-title{font-family:'Commissioner',sans-serif;font-size:34px;font-weight:300;color:#fff;margin-bottom:20px;line-height:1.2;text-align:left;}
        .h-eletta-row{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;background:#fff;border-radius:50px;margin-bottom:20px;font-size:14px;font-family:'Source Code Pro',monospace;color:#0D5F75;font-weight:400;border:none;height:35px;width:fit-content;cursor:pointer;white-space:nowrap;}
        .h-eletta-ico{width:34px;height:34px;border-radius:50%;border:1.5px solid #0D5F75;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-eletta-chevron{margin-left:auto;width:12px;height:12px;border-radius:50%;background:rgba(13,95,117,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-eletta-badge{display:none;}
        .h-eletta-badge-warn{display:none;}
        #eletta-btn-semafori{margin-bottom:0;}
        .h-eletta-stato-block{background:#eeeef2;border-radius:0 0 14px 14px;padding:14px 16px;margin-bottom:10px;font-size:13px;font-family:'Source Code Pro',monospace;color:#0D5F75;}
        .h-eletta-stato-row{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid rgba(13,95,117,0.1);}
        .h-eletta-stato-row:last-child{border-bottom:none;padding-bottom:0;}
        .h-eletta-stato-lbl{font-weight:400;color:#0D5F75;margin-bottom:2px;}
        .h-eletta-stato-val{font-weight:400;color:rgba(13,95,117,0.6);font-size:11px;}
        .h-btn-supporto{width:50%;background:#EFF020;color:#0D5F75;border:none;border-radius:24px;padding:8px 21px;font-family:'Commissioner',sans-serif;font-size:12px;font-weight:400;cursor:pointer;margin-top:10px;transition:opacity .15s;align-self:flex-start;white-space:nowrap;}
        .h-btn-supporto:hover{opacity:.88;}

        /* ═══ OVERRIDE CARD GLOBALI per tab content ═══ */
        #hotel-content .card{border-radius:16px!important;box-shadow:0 2px 14px rgba(0,0,0,.06)!important;border:none!important;}
        #hotel-content .card-header{border-radius:16px 16px 0 0!important;background:white!important;border-bottom:1px solid #f0f0f6!important;}
    </style>
</head>

<script>
const SUPABASE_URL      = 'https://yyauvoqjdzrbmebeafit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w';
const _SB  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _SBq = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });

let _site = null, _pluginBase = '', _pluginSecret = '', _appFeatures = {}, _siteAppPerms = {};
let _faqItems = [], _faqFilter = 'all', _faqSearch = '';
let _pseChartsInited = false, _mappaInited = false, _coerenzaInited = false, _configInited = false;

// ─── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const { data:{ session } } = await _SB.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await _SBq.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token || '' });
    const user = session.user;

    // Supporto ?site_id=xxx per admin (preview specifico hotel)
    const urlParams = new URLSearchParams(location.search);
    const paramSiteId = urlParams.get('site_id');
    const isAdmin = user.user_metadata?.role === 'admin';
    if (isAdmin && !paramSiteId) { window.location.href = 'index.html'; return; }

    // Modalità admin: mostra freccia "← Hotels" nel brand sidebar
    if (isAdmin && paramSiteId) {
        const brand = document.getElementById('sidebar-brand');
        if (brand) {
            brand.innerHTML = `<a href="index.html" title="← Hotels" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:9px;font-family:'Sarabun',sans-serif;font-weight:600">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
                Hotels
            </a>`;
        }
    }

    const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Hotel';
    const ini  = name.charAt(0).toUpperCase();
    document.getElementById('nav-name').textContent   = name;
    document.getElementById('nav-avatar').textContent = ini;
    document.getElementById('dd-name').textContent    = name;
    document.getElementById('dd-email').textContent   = user.email || '';
    document.getElementById('dd-avatar').textContent  = ini;
    const fbEmail = document.getElementById('fb-email');
    if (fbEmail) fbEmail.value = user.email || '';

    const siteId = paramSiteId || user.user_metadata?.site_id;
    if (!siteId) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-icon">🏨</div><div class="empty-title">Hotel non collegato</div><div class="empty-sub">Contatta il supporto per collegare il tuo sito</div></div>';
        return;
    }

    const now = new Date();
    const [{ data:site }, { data:pseData }] = await Promise.all([
        _SBq.from('isi_sites').select('*').eq('site_id', siteId).single(),
        _SBq.from('isi_pse_queries').select('created_at,cost_usd,result').eq('site_id', siteId).order('created_at',{ascending:false}).limit(500),
    ]);
    if (!site) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-title">Sito non trovato</div></div>';
        return;
    }

    _site = site;
    _appFeatures = user.user_metadata?.app_features || {};
    _siteAppPerms = site.features_override?.app || {};
    _pluginBase   = (site.site_url || '').replace(/\/$/, '');
    _pluginSecret = site.site_id;
    try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/site-id', { signal:ctrl.signal });
        if (r.ok) { const d = await r.json().catch(()=>({})); if (d.site_id) _pluginSecret = d.site_id; }
    } catch(_) {}

    const siteName = site.site_name || site.site_url || '—';
    document.getElementById('hero-hotel-name').textContent = siteName;

    const urlEl = document.getElementById('hero-url');
    if (urlEl) urlEl.textContent = (site.site_url||'').replace(/^https?:\/\//,'').replace(/\/$/,'') || '—';
    const geo0 = site.geo_scores || {};
    const geoVal0 = geo0.completeness_score ?? geo0.ai_readiness ?? null;
    const geoEl = document.getElementById('hero-geo');
    if (geoEl) geoEl.textContent = geoVal0 !== null ? Math.round(geoVal0/10) : '—';
    const rinEl = document.getElementById('hero-rinnovo');
    if (rinEl) {
        const rd = site.renewal_date || site.renew_date || null;
        rinEl.textContent = rd ? new Date(rd).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
    }

    // ── Sidebar navigation
    document.querySelectorAll('.h-nav-item[data-htab]').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.htab;
            document.querySelectorAll('.h-nav-item[data-htab]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('[id^="htab-"]').forEach(p => p.style.display = 'none');
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = '';
            if (tab==='faq')      initHotelFaq();
            if (tab==='schema')   initHotelSchema(site);
            if (tab==='mappa')    initHotelMappa(site);
            if (tab==='coerenza') initHotelCoerenza();
            if (tab==='config')   initHotelConfig();
            if (tab==='pse')      initHotelPse(pseData||[], now);
        });
    });

    // ── Sync button
    document.getElementById('btn-sync-header')?.addEventListener('click', () => {
        document.getElementById('btn-hotel-sync')?.click();
    });

    // ── User pill + dropdown
    document.getElementById('user-pill')?.addEventListener('click', e => {
        e.stopPropagation();
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = d.style.display==='none'?'':'none';
    });
    document.addEventListener('click', () => {
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = 'none';
    });

    // ── Logout (sidebar + dropdown)
    const doLogout = async () => { await _SB.auth.signOut(); window.location.href='login.html'; };
    document.getElementById('btn-logout-sidebar')?.addEventListener('click', doLogout);
    document.getElementById('dd-logout')?.addEventListener('click', doLogout);

    renderContent(site, pseData || [], now);
    applyAppFeatures(_appFeatures, _siteAppPerms);
}

// ─── PERMESSI APP ──────────────────────────────────────────────────────────────
function applyAppFeatures(userF, siteF) {
    const tabMap = { panoramica:'panoramica', faq:'faq', schema_org:'schema', mappa_query:'mappa', coerenza:'coerenza', config:'config', statistiche:'pse' };
    const allowed = key => userF[key] !== false && siteF[key] !== false;
    Object.entries(tabMap).forEach(([key, tab]) => {
        if (!allowed(key)) {
            document.querySelector(`.h-nav-item[data-htab="${tab}"]`)?.remove();
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = 'none';
        }
    });
}

// ─── RENDER MAIN CONTENT ───────────────────────────────────────────────────────
function renderContent(site, pseData, now) {
    const geo = site.geo_scores || {};
    const hrs = site.last_heartbeat ? (now - new Date(site.last_heartbeat))/3600000 : 9999;
    const rawFallback = [geo.chunk_avg, geo.citation_avg].filter(v=>v!=null);
    const geoAvg = geo.completeness_score != null ? geo.completeness_score : (geo.ai_readiness != null ? geo.ai_readiness : (rawFallback.length ? Math.round(rawFallback.reduce((a,b)=>a+b,0)/rawFallback.length) : null));
    const cs = geo.completeness_score ?? null;
    const checklist = geo.checklist || [];
    const covPct = geo.coverage_pct ?? null;
    const missingAnswers = geo.missing_answers ?? null;
    const missingQueries = geo.missing_queries || [];
    const freshAlerts = geo.freshness_alerts || [];
    const qMapPct = geo.query_map_pct ?? null;
    const qUncovered = geo.query_uncovered ?? null;
    const qTotal = geo.query_total ?? null;
    const daysFaq = geo.days_since_faq ?? null;
    const daysSchema = geo.days_since_schema ?? null;
    const isOld = false;
    const statoGen = (hrs<25&&(geoAvg===null||geoAvg>=40))?'ok':(hrs>48?'err':'warn');

    const sf = (s,l,d) => {
        const c = s==='ok'?'#0D5F75':s==='warn'?'var(--magenta)':s==='err'?'var(--red)':'var(--grey-dot)';
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f4f4f8"><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0;display:inline-block"></span><span style="font-size:13px;font-weight:600;color:#4b4d68">${l}</span></div><span style="font-size:12px;color:#888">${d}</span></div>`;
    };

              const isBaseline=Math.abs(yp-ca.bottom)<2;
              c.setLineDash(isBaseline?[]:[10,5]);
              c.strokeStyle='#0D5F75';c.lineWidth=0.5;
              c.beginPath();c.moveTo(ca.left,yp);c.lineTo(ca.right,yp);c.stroke();
            });
            c.restore();
          }
        };
        const statsChart = new window.Chart(ctx, {
            type:'bar',
            data:{ labels:mkLabels(curN, curGran), datasets:buildDatasets(curN) },
            plugins:[dashedGridPlugin],
            options:{
                responsive:true, maintainAspectRatio:true,

                },

                statsChart.data.datasets = buildDatasets(curN);
                statsChart.update();

        } catch(e) { if(headerBtn){headerBtn.textContent='✗ Non raggiungibile';setTimeout(()=>{headerBtn.textContent='Sincronizza';headerBtn.disabled=false;},3000);} }

const _isScriptSite = () => (_site?.hotel_profile?.site_mode === 'script');

async function initHotelFaq() {
    const listEl = document.getElementById('faq-hotel-list');
    if (!listEl || _faqItems.length) { renderHotelFaqList(listEl); return; }
    listEl.innerHTML = '<div class="loading" style="padding:20px"><div class="spinner"></div></div>';
    try {
        if (_isScriptSite()) {
            _faqItems = (_site?.faq_data?.items || []);
        } else {
            const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 9000);
            const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/faq', { signal:ctrl.signal });
            if (!r.ok) {
                const cached = _site?.faq_data?.items;
                if (cached && cached.length) { _faqItems = cached; }
                else throw new Error('HTTP ' + r.status);
            } else {
                const data = await r.json();
                _faqItems = data.items || [];
            }
        }
        const badge = document.getElementById('faq-hotel-count');
        if (badge) badge.textContent = _faqItems.length ? '('+_faqItems.length+')' : '';
        renderHotelFaqList(listEl);
    } catch(e) {
        if (listEl) listEl.innerHTML = '<div style="color:#b00020;font-size:13px;padding:16px 20px">FAQ non caricate: '+esc(e.message)+'</div>';
    }
}

async function _scriptSaveFaq(action, faq) {
    const items = [...(_site?.faq_data?.items || [])];
    if (action === 'delete') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items.splice(idx, 1);
    } else if (action === 'add') {
        items.push({ id: Date.now(), question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false, status: 'publish', order: items.length });
    } else if (action === 'update') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items[idx] = { ...items[idx], question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false };
    }
    const newFaqData = { ...(_site?.faq_data || {}), items, total: items.length, _synced_at: new Date().toISOString(), _source: 'isi' };
    const { error } = await _SBq.from('isi_sites').update({ faq_data: newFaqData }).eq('site_id', _site.site_id);
    if (error) throw new Error(error.message);
    _site.faq_data = newFaqData;
    _faqItems = items;
}

function renderHotelFaqList(el) {
    if (!el) return;
    let items = _faqItems;
    if (_faqFilter==='publish') items = items.filter(f => f.status==='publish'||!f.status);
    if (_faqFilter==='draft')   items = items.filter(f => f.status==='draft');
    if (_faqFilter==='solo_ai') items = items.filter(f => f.solo_ai);
    if (_faqSearch) items = items.filter(f => (f.question||'').toLowerCase().includes(_faqSearch)||(f.answer||'').toLowerCase().includes(_faqSearch));
    if (!_faqItems.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ. Clicca + Aggiungi FAQ per iniziare.</div>'; return; }
    if (!items.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ corrisponde ai filtri.</div>'; return; }
    const fmt = d => { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };
    el.innerHTML = items.map((f,i) => {
        const pub = f.status==='draft'?'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Bozza</span>':'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Pubblicato</span>';
        const ai  = f.solo_ai?'<span style="background:#fce8ef;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px">Solo AI</span>':'';

function openHotelFaqModal(id) {

    document.getElementById('faq-hotel-modal-ttl').textContent = f ? 'Modifica FAQ' : 'Aggiungi FAQ';
    document.getElementById('fhm-id').value    = f ? f.id : '';

    document.getElementById('fhm-a').value     = f ? f.answer : '';
    document.getElementById('fhm-solo-ai').checked = f ? !!f.solo_ai : false;

document.getElementById('faq-hotel-modal-close').addEventListener('click', () => { document.getElementById('faq-hotel-modal').style.display='none'; });

document.getElementById('fhm-save').addEventListener('click', async () => {
    const btn=document.getElementById('fhm-save'), msg=document.getElementById('fhm-msg');
    const id=document.getElementById('fhm-id').value, q=document.getElementById('fhm-q').value.trim(), a=document.getElementById('fhm-a').value.trim(), sa=document.getElementById('fhm-solo-ai').checked;
    if (!q) { msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Inserisci la domanda.'; return; }
    btn.disabled=true; btn.textContent='Salvataggio...';
    try {
        const action=id?'update':'add', faq={question:q,answer:a,solo_ai:sa,order:0};
        if(id) faq.id=parseInt(id);
        if (_isScriptSite()) {
            await _scriptSaveFaq(action, faq);
            document.getElementById('faq-hotel-modal').style.display='none';
            renderHotelFaqList(document.getElementById('faq-hotel-list'));
        } else {
            const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),12000);
            const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action,faq}),signal:ctrl.signal});
            const d=await r.json().catch(()=>({}));
            if(r.ok&&d.ok){ document.getElementById('faq-hotel-modal').style.display='none'; _faqItems=[]; await initHotelFaq(); }
            else throw new Error(d.message||'Errore '+r.status);
        }
    } catch(e){ msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Errore: '+e.message; }
    finally { btn.disabled=false; btn.textContent='Salva FAQ'; }
});

window.deleteHotelFaq = async function(id) {
    const f=_faqItems.find(x=>x.id===id);
    if(!f||!confirm('Eliminare la FAQ "'+((f.question||'').substring(0,60))+'"?')) return;
    try {
        if (_isScriptSite()) {
            await _scriptSaveFaq('delete', {id});
            renderHotelFaqList(document.getElementById('faq-hotel-list'));
        } else {
            const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),10000);
            const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action:'delete',faq:{id}}),signal:ctrl.signal});

            if(r.ok&&d.ok){ _faqItems=[]; await initHotelFaq(); } else alert('Errore durante eliminazione');
        }
    } catch(e){ alert('Errore: '+e.message); }
};

let _hschemaInited = false;
async function initHotelSchema(site) {
    if (_hschemaInited) return; _hschemaInited = true;
    let schema = {};
    try {
        const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),9000);
        const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/schema',{signal:ctrl.signal});
        if(r.ok) schema=await r.json();
        const src=document.getElementById('hschema-source');
        if(src) src.textContent = schema._synced_at ? 'Dati plugin · '+new Date(schema._synced_at).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    } catch(_) {
        schema = site.schema_data || {};
        const src=document.getElementById('hschema-source');

    renderHotelSchemaView(schema);

}

async function saveHotelSchema() {
    const btn=document.getElementById('btn-save-hschema'), msg=document.getElementById('hschema-msg');
    btn.disabled=true; btn.textContent='Invio...';
    const g=id=>(document.getElementById('hsf-'+id)?.value||'').trim();

// ─── MAPPA QUERY ──────────────────────────────────────────────────────────────
async function initHotelMappa(site) {
    if (_mappaInited) return; _mappaInited = true;
    const cont=document.getElementById('hmappa-content'); if(!cont) return;
    const faqData=site.faq_data||{}, qmap=faqData.query_map||faqData.mappa_query||{}, cats=Object.keys(qmap);
    if(!cats.length){ cont.innerHTML='<div style="color:#aaa;font-size:13px">Nessuna categoria disponibile. Sincronizza dal plugin.</div>'; return; }
    cont.innerHTML=cats.map(cat=>{
        const entry=qmap[cat]||{}, queries=Array.isArray(entry.queries)?entry.queries:(entry.examples||[]), answer=entry.answer||entry.risposta||'', covered=entry.covered??!!answer;
        const badge=covered?'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Coperta</span>':'<span style="background:#fce8ef;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Mancante</span>';
        return `<div style="padding:16px 20px;border-bottom:1px solid #f4f4f8"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#171b33;text-transform:capitalize">${esc(cat.replace(/_/g,' '))}</div>${badge}</div>${queries.length?'<div style="margin-bottom:8px">'+queries.slice(0,3).map(q=>'<div style="font-size:12px;color:#666b84;padding:2px 0">• '+esc(q)+'</div>').join('')+(queries.length>3?'<div style="font-size:11px;color:#aaa">+'+( queries.length-3)+' altre...</div>':'')+'</div>':''}<div style="display:flex;gap:8px;align-items:flex-start"><textarea data-cat="${esc(cat)}" class="hqmap-answer" style="flex:1;border:1px solid #e4e4ec;border-radius:6px;padding:8px 10px;font-size:12px;resize:vertical;min-height:60px;color:#171b33;outline:none" placeholder="Scrivi la risposta...">${esc(answer)}</textarea><button class="btn-update" style="margin-left:0;padding:8px 14px;font-size:12px" onclick="saveHotelMappaAnswer('${esc(cat)}','${esc(site.site_id)}')">Salva</button></div></div>`;
    }).join('');
}

window.saveHotelMappaAnswer = async function(cat, siteId) {
    const el=document.querySelector('.hqmap-answer[data-cat="'+cat+'"]'); if(!el) return;
    const answer=el.value.trim();
    const {data:s}=await _SBq.from('isi_sites').select('faq_data').eq('site_id',siteId).single();
    const fd=s?.faq_data||{}, qm=fd.query_map||fd.mappa_query||{};
    qm[cat]={...(qm[cat]||{}),answer,covered:!!answer};
    const {error}=await _SBq.from('isi_sites').update({faq_data:{...fd,query_map:qm}}).eq('site_id',siteId);
    el.style.borderColor=error?'#0D5F75':'#0D5F75'; setTimeout(()=>{el.style.borderColor='#e4e4ec';},2000);
};

            '<button id="hcfg-copy-script" class="btn-update" style="flex-shrink:0;white-space:nowrap;margin-left:0">Copia</button>'+
            '</div></div>'+
            '<div style="padding:10px 20px 16px">'+
            '<a href="'+esc((site.site_url||'').replace(/\/$/,''))+'/faq" target="_blank" style="color:#0D5F75;font-weight:700;font-size:13px;text-decoration:none">Pagina FAQ pubblica →</a>'+
            '</div>'
        :
            '<div style="padding:10px 20px 16px">'+
            '<a href="'+esc((site.site_url||'').replace(/\/$/,''))+'/faq" target="_blank" style="color:#0D5F75;font-weight:700;font-size:13px;text-decoration:none">Pagina FAQ pubblica →</a>'+
            '</div>'
        )+
        '</div>';

    cont.innerHTML=
        connCard+
        cardH+chH('#0D5F75','Abilitazioni Plugin')+'<div style="padding:0 20px">'+
        toggl('chunk_engine','Chunk Engine',cfg.chunk_engine!==false)+
        toggl('citation_engine','Citation Engine',cfg.citation_engine!==false)+
        toggl('entity_graph','Entity Graph',cfg.entity_graph!==false)+
        toggl('faq_enabled','FAQ Pubbliche',cfg.faq_enabled!==false)+
        '</div><div style="padding:14px 20px;display:flex;gap:10px"><button id="hbtn-save-toggles" class="btn-update" style="margin-left:0">Salva abilitazioni</button></div></div>'+

        cardH+chH('#0D5F75','Chiavi API')+'<div style="padding:0 20px">'+
        inp('gemini_key','Chiave API Google Gemini',cfg.gemini_api_key?'••••••••••'+cfg.gemini_api_key.slice(-4):'','Incolla la chiave da aistudio.google.com')+
        inp('isi_token','Token ISI',cfg.isi_token?'••••'+cfg.isi_token.slice(-8):'','Token fornito da ISI')+
        '</div><div style="padding:14px 20px;display:flex;gap:10px"><button id="hbtn-save-keys" class="btn-update" style="margin-left:0">Salva chiavi</button><div id="hcfg-keys-msg" style="font-size:13px;padding:8px 0"></div></div></div>'+

        cardH+chH('#0D5F75','Sync ISI — Visibilità AI')+'<div style="padding:16px 20px">'+
        row('Ultimo sync ISI',cfg.last_isi_sync?new Date(cfg.last_isi_sync).toLocaleString('it-IT'):'—')+
        row('Stato ultimo sync',cfg.last_isi_sync_status||'—')+
        '</div></div>';

    document.getElementById('hbtn-save-toggles')?.addEventListener('click', async()=>{
        const newCfg={...cfg,chunk_engine:document.getElementById('hcfg-chunk_engine')?.checked,citation_engine:document.getElementById('hcfg-citation_engine')?.checked,entity_graph:document.getElementById('hcfg-entity_graph')?.checked,faq_enabled:document.getElementById('hcfg-faq_enabled')?.checked};
        await _SBq.from('isi_sites').update({hotel_profile:{...hp,isi_config:newCfg}}).eq('site_id',site.site_id);
        site.hotel_profile={...hp,isi_config:newCfg};
    });
    document.getElementById('hcfg-copy-script')?.addEventListener('click', function(){
        const tag=document.getElementById('hcfg-script-tag')?.textContent||'';
        navigator.clipboard.writeText(tag).then(()=>{this.textContent='✓ Copiato';setTimeout(()=>{this.textContent='Copia';},2000);});
    });
    document.getElementById('hbtn-save-keys')?.addEventListener('click', async()=>{
        const gKey=document.getElementById('hcfg-gemini_key')?.value.trim(), iKey=document.getElementById('hcfg-isi_token')?.value.trim(), msg=document.getElementById('hcfg-keys-msg');
        const newCfg={...cfg};
        if(gKey&&!gKey.startsWith('•')) newCfg.gemini_api_key=gKey;
        if(iKey&&!iKey.startsWith('•')) newCfg.isi_token=iKey;
        const{error}=await _SBq.from('isi_sites').update({hotel_profile:{...hp,isi_config:newCfg}}).eq('site_id',site.site_id);
        if(msg){msg.style.color=error?'#0D5F75':'#0D5F75';msg.textContent=error?'✗ Errore':'✓ Salvate';setTimeout(()=>{msg.textContent='';},3000);}
        site.hotel_profile={...hp,isi_config:newCfg};
    });
}

// ─── PSE CHARTS ───────────────────────────────────────────────────────────────
function initHotelPseCharts(pseData) {
    if (_pseChartsInited) return; _pseChartsInited = true;
    const items=pseData||[], cited=items.filter(r=>r.result?.cited||r.result?.found||r.result?.match_found).length, notCited=items.length-cited;
    const donutCtx=document.getElementById('hchart-pse-donut');
    if(donutCtx&&items.length>0){
        new Chart(donutCtx,{type:'doughnut',data:{labels:['Citato','Non citato'],datasets:[{data:[cited,notCited],backgroundColor:['#0D5F75','#ead0dc'],borderWidth:0}]},options:{cutout:'70%',plugins:{legend:{display:false}}}});
        document.getElementById('hpse-donut-legend').innerHTML='<span style="color:#0D5F75;font-weight:700">'+cited+' citazioni</span> su '+items.length+' query';
    } else if(donutCtx){
        donutCtx.parentElement.innerHTML='<div style="color:#aaa;font-size:13px;text-align:center">Nessuna query PSE registrata.</div>';
    }
    const barCtx=document.getElementById('hchart-pse-bar');
    if(barCtx&&items.length>0){
        const now2=new Date(), days={};
        for(let i=29;i>=0;i--){const d=new Date(now2);d.setDate(d.getDate()-i);days[d.toISOString().slice(0,10)]=0;}
        items.forEach(r=>{const k=(r.created_at||'').slice(0,10);if(k in days)days[k]++;});
        new Chart(barCtx,{type:'bar',data:{labels:Object.keys(days).map(d=>d.slice(5)),datasets:[{data:Object.values(days),backgroundColor:'#0D5F75',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,color:'#aaa',font:{size:10}}},y:{beginAtZero:true,grid:{color:'#f0f0f4'},ticks:{stepSize:1,color:'#aaa',font:{size:10}}}}}});
    }
}

// ─── UTIL ─────────────────────────────────────────────────────────────────────
function timeAgo(d) {
    const s=(new Date()-new Date(d))/1000;
    if(s<60) return 'Adesso';
    if(s<3600) return Math.floor(s/60)+' min fa';
    if(s<86400) return Math.floor(s/3600)+' ore fa';
    return Math.floor(s/86400)+' giorni fa';
}
function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();

// ─── FEEDBACK ──────────────────────────────────────────────────────────────────
(function() {
    const overlay = document.createElement('div');
    overlay.id = 'feedback-overlay';
    overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(23,27,51,.45);z-index:99999;align-items:center;justify-content:center';
    overlay.innerHTML = `
        <div style="background:white;border-radius:12px;padding:28px 28px 24px;max-width:440px;width:calc(100% - 32px);box-shadow:0 16px 48px rgba(0,0,0,.18);position:relative">
            <button onclick="document.getElementById('feedback-overlay').style.display='none'" style="position:absolute;right:14px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:#999;line-height:1">×</button>
            <div style="font-size:15px;font-weight:600;color:#171b33;margin-bottom:16px;line-height:1.4;padding-right:20px">Inviaci i tuoi suggerimenti o comunicaci un eventuale problema</div>
            <textarea id="fb-msg" placeholder="Scrivi qui..." style="width:100%;height:110px;border:1.5px solid #C1CBE8;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;box-sizing:border-box;outline:none"></textarea>
            <div style="margin-top:12px">
                <div style="font-size:12px;font-weight:600;color:#666b84;margin-bottom:6px">Rispondi all'e-mail</div>
                <input id="fb-email" type="email" style="width:100%;border:1.5px solid #C1CBE8;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;box-sizing:border-box;outline:none">
            </div>
            <div id="fb-msg-status" style="font-size:13px;margin-top:10px;display:none"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
                <button id="fb-submit" style="background:#0D5F75;color:white;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Invia feedback</button>
                <button onclick="document.getElementById('feedback-overlay').style.display='none'" style="background:none;border:1.5px solid #C1CBE8;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#171b33">Annulla</button>
            </div>
        </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
    document.body.appendChild(overlay);

    document.getElementById('fb-submit').addEventListener('click', async () => {
        const msg = document.getElementById('fb-msg').value.trim();
        const email = document.getElementById('fb-email').value.trim();
        const status = document.getElementById('fb-msg-status');
        if (!msg) { status.textContent = 'Scrivi un messaggio.'; status.style.color='#b00020'; status.style.display='block'; return; }
        const btn = document.getElementById('fb-submit');
        btn.disabled = true; btn.textContent = 'Invio…';
        try {
            const { data:{ session } } = await _SB.auth.getSession();
            const res = await fetch(SUPABASE_URL + '/functions/v1/isi-feedback', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, reply_to: email })
            });
            if (!res.ok) throw new Error('Errore invio');
            status.textContent = 'Feedback inviato. Grazie!'; status.style.color='#0D5F75'; status.style.display='block';
            document.getElementById('fb-msg').value = '';
            setTimeout(() => { overlay.style.display='none'; status.style.display='none'; }, 2000);
        } catch(e) {
            status.textContent = 'Errore durante l\'invio. Riprova.'; status.style.color='#b00020'; status.style.display='block';
        }
        btn.disabled = false; btn.textContent = 'Invia feedback';
    });
})();
</script>
