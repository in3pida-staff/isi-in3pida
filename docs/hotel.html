        /* ═══ LAYOUT PRINCIPALE ═══ */
        body{margin:0;padding:0;background:#EDEEF5;font-family:'Source Code Pro',monospace;}
        .h-layout{display:flex;min-height:100vh;}

        /* ═══ SIDEBAR ═══ */
        .h-sidebar{width:75px;min-height:100vh;background:#EDEEF5;display:flex;flex-direction:column;align-items:center;position:fixed;left:0;top:0;z-index:200;padding:10px 0 10px 25px;}
        .h-sidebar-brand{margin-bottom:14px;display:flex;align-items:center;justify-content:center;width:100%;}
        .h-sidebar-nav{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;width:100%;padding:100px 6px 0;}
        .h-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 4px;background:none;border:none;cursor:pointer;color:#0D5F75;font-family:'Source Code Pro',monospace;font-size:11px;font-weight:700;letter-spacing:.01em;transition:all .15s;text-align:center;line-height:1.1;border-radius:10px;}
        .h-nav-item:hover{color:#0D5F75;}
        .h-nav-item.active{color:#0D5F75;}
        .h-nav-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;opacity:0.65;transition:opacity .15s;overflow:hidden;}
        .h-nav-icon svg circle{transform:scale(1.1);transform-origin:center center;}
        .h-nav-icon svg{width:100%;height:100%;}
        .h-nav-item:hover .h-nav-icon{opacity:0.85;}
        .h-nav-item.active .h-nav-icon{opacity:1;}
        .h-nav-item.active .h-nav-icon svg circle{fill:#0D5F75!important;}
        .h-nav-item.active .h-nav-icon svg path,.h-nav-item.active .h-nav-icon svg rect,.h-nav-item.active .h-nav-icon svg polyline,.h-nav-item.active .h-nav-icon svg line,.h-nav-item.active .h-nav-icon svg polygon{fill:#fff!important;stroke:#fff!important;}
        .h-sidebar-sep{width:40px;height:1px;background:rgba(255,255,255,0.5);margin:8px 0;}
        .h-sidebar-bottom{width:75px;display:flex;flex-direction:column;align-items:center;padding:0 0 10px 25px;position:fixed;bottom:0;left:0;background:#EDEEF5;}

        /* ═══ AREA DESTRA ═══ */
        .h-right{margin-left:70px;flex:1;display:flex;flex-direction:column;min-height:100vh;}

        /* ═══ HEADER ═══ */
        .h-header{background:transparent;height:52px;display:flex;align-items:center;padding:0 20px 0 5%;position:sticky;top:0;z-index:100;gap:14px;}
        .h-main-left{padding-left:5%;padding-right:35px;}
        .h-header-logo{display:flex;align-items:center;margin-top:15px;}
        .h-header-logo img{height:24px;width:auto;transition:opacity .4s ease;}
        #sidebar-brand svg rect,#sidebar-brand svg path{transition:fill .4s ease;}
        .h-btn-sync{background:#EFF020;color:#0D5F75;border:0.5px solid #0D5F75;border-radius:24px;padding:8px 21px;font-family:'Source Code Pro',monospace;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s,opacity .2s ease;flex-shrink:0;margin-top:15px;}
        .h-btn-sync:hover{background:#0D5F75;color:#EFF020;border-color:#0D5F75;}
        .h-btn-sync:disabled{opacity:.5;cursor:not-allowed;}
        #btn-guida:hover{background:#0D5F75!important;color:#C1CBE8!important;transition:all .15s;}
        #btn-feedback:hover{background:#C1CBE8!important;color:#fff!important;transition:all .15s;}
        .h-header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
        .h-bell{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #e4e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;color:#C1CBE8;transition:background .15s;position:relative;}
        .h-bell:hover{background:#f9fafc;}
        .h-bell-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff6b2b;border:1.5px solid white;}

        /* ═══ HERO ═══ */
        .h-hero{background:#C1CBE8;padding:33px 28px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:16px;box-shadow:0 0 0 3px #C1CBE8;margin:25px 5% 30px 5%;position:relative;overflow:visible;}
        .h-hero-name{font-family:'Source Code Pro',monospace;font-size:42px;font-weight:300;color:#fff;flex-shrink:0;}
        .h-hero-chips{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
        .h-chip{background:#fff;border:none;border-radius:24px;padding:7px 17px;font-size:13px;color:#0D5F75;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Source Code Pro',monospace;font-weight:400;}
        .h-chip-lbl{font-size:12px;opacity:.65;font-weight:400;font-family:'Source Code Pro',monospace;}
        .h-chip-geo{font-weight:400;font-size:13px;font-family:'Source Code Pro',monospace;}

        /* ═══ CONTENT ═══ */
        .h-content{background:#EDEEF5;flex:1;padding:18px 18px 40px;}

        /* ═══ DASHBOARD HEADING ═══ */
        .h-dash-title{font-family:'Source Code Pro',monospace;font-size:33px;font-weight:400;color:#0D5F75;margin:0 0 21px;}

        /* ═══ KPI ROW ═══ */
        /* ═══ KPI ROW ═══ */
        .h-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px;max-width:92%;}
        .h-kpi{background:white;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.06);padding:19px 22px;position:relative;overflow:hidden;}
        .h-kpi-ttl{font-size:16px;font-weight:300;color:#0D5F75;letter-spacing:.01em;margin-bottom:10px;display:flex;align-items:center;gap:4px;font-family:'Source Code Pro',monospace;white-space:nowrap;}
        .h-kpi-val{font-size:34px;font-weight:700;line-height:1;color:#0D5F75;font-family:'Source Code Pro',monospace;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;vertical-align:baseline;}
        .h-kpi-sub{font-size:18px;font-weight:400;color:#b0b7c2;margin-top:6px;font-family:'Source Code Pro',monospace;}
        .h-kpi-sub-nd{color:#C1CBE8;}
        .h-kpi-deco{position:absolute;bottom:4px;right:8px;opacity:0.13;pointer-events:none;}

        /* ═══ MAIN GRID: sinistra + destra ═══ */
        .h-main-grid{display:grid;grid-template-columns:1fr 285px;gap:12px;align-items:start;}

        /* ═══ CARD UNIVERSALE ═══ */
        .h-card{background:white;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.06);overflow:hidden;margin-bottom:12px;}
        .h-card-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
        .h-card-hdr-t{font-size:12px;font-weight:700;color:#0D5F75;display:flex;align-items:center;gap:6px;font-family:'Commissioner',sans-serif;}
        .h-card-body{padding:14px 16px;}
        .h-dot-ok{background:#0D5F75;} .h-dot-warn{background:var(--magenta);} .h-dot-err{background:var(--red);} .h-dot-nd{background:#ccc;}
        .h-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

        /* ═══ STATS + GEO ROW ═══ */
        .h-stats-row{display:flex;align-items:stretch;gap:24px;margin-bottom:12px;}
        .h-range-btn{font-size:10px;font-weight:300;cursor:pointer;color:#aaa;padding:4px 18px;border-radius:20px;border:1.5px solid #edeef5;transition:all .15s;font-family:'Source Code Pro',monospace;}
        .h-range-btn.active-range{color:#0D5F75;border:1.5px solid #0D5F75;background:white;}

        /* ═══ SECTION HEADING ═══ */
        .h-sec-hdr{display:flex;align-items:center;gap:20px;margin:36px 0 40px;}
        .h-sec-icon{width:56px;height:56px;border-radius:50%;background:#0D5F75;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-sec-texts{line-height:1.2;}
        .h-sec-title{font-family:'Source Code Pro',monospace;font-size:34px;font-weight:700;color:#0D5F75;margin:0;}
        .h-sec-sub{font-size:16px;color:#0D5F75;margin:0;font-family:'Source Code Pro',monospace;}

        /* ═══ ELETTA CARD (float destra) ═══ */
        .h-eletta{background:#C1CBE8;border-radius:16px;padding:32px 16px calc(20px + 5vh) 46px;display:flex;flex-direction:column;align-items:flex-start;margin-left:-20px;margin-right:-18px;position:sticky;top:70px;}
        .h-eletta-title{font-family:'Source Code Pro',monospace;font-size:34px;font-weight:300;color:#fff;margin-bottom:20px;line-height:1.2;text-align:left;}
        .h-eletta-row{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;background:#fff;border-radius:50px;margin-bottom:20px;font-size:14px;font-family:'Source Code Pro',monospace;color:#0D5F75;font-weight:400;border:none;height:35px;width:fit-content;cursor:pointer;white-space:nowrap;}
        .h-eletta-ico{width:34px;height:34px;border-radius:50%;border:0.75px solid #0D5F75;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-eletta-chevron{margin-left:auto;width:12px;height:12px;border-radius:50%;background:rgba(13,95,117,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .h-eletta-badge{display:none;}
        .h-eletta-badge-warn{display:none;}
        #eletta-btn-semafori{margin-bottom:0;position:relative;z-index:1;}
        .h-eletta-stato-block{background:#eeeef2;border-radius:0 0 14px 14px;padding:26px 16px 14px;margin-top:-17px;margin-bottom:10px;font-size:12px;font-family:'Source Code Pro',monospace;color:#0D5F75;}
        .h-eletta-stato-row{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid rgba(13,95,117,0.1);}
        .h-eletta-stato-row:last-child{border-bottom:none;padding-bottom:0;}
        .h-eletta-stato-lbl{font-weight:400;color:#0D5F75;margin-bottom:2px;white-space:nowrap;}
        .h-eletta-stato-val{font-weight:400;color:rgba(13,95,117,0.6);font-size:10px;}
        .h-btn-supporto{width:fit-content;background:#EFF020;color:#0D5F75;border:none;border-radius:24px;padding:8px 21px;font-family:'Source Code Pro',monospace;font-size:12px;font-weight:400;cursor:pointer;margin-top:10px;transition:all .15s;align-self:flex-start;white-space:nowrap;}
        .h-btn-supporto:hover{background:#0D5F75;color:#EFF020;}

        /* ═══ OVERRIDE CARD GLOBALI per tab content ═══ */
        #hotel-content .card{border-radius:16px!important;box-shadow:0 2px 14px rgba(0,0,0,.06)!important;border:none!important;}
        #hotel-content .card-header{border-radius:16px 16px 0 0!important;background:white!important;border-bottom:1px solid #f0f0f6!important;}

</head>

const _SBq = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });

let _site = null, _pluginBase = '', _pluginSecret = '', _appFeatures = {}, _siteAppPerms = {};
let _faqItems = [], _faqFilter = 'all', _faqSearch = '';
let _pseChartsInited = false, _mappaInited = false, _coerenzaInited = false, _configInited = false;

// ─── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const { data:{ session } } = await _SB.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await _SBq.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token || '' });
    const user = session.user;

    // Supporto ?site_id=xxx per admin (preview specifico hotel)
    const urlParams = new URLSearchParams(location.search);
    const paramSiteId = urlParams.get('site_id');
    const isAdmin = user.user_metadata?.role === 'admin';
    if (isAdmin && !paramSiteId) { window.location.href = 'index.html'; return; }

    // Modalità admin: mostra freccia "← Hotels" nel brand sidebar
    if (isAdmin && paramSiteId) {
        const brand = document.getElementById('sidebar-brand');
        if (brand) {
            brand.innerHTML = `<a href="index.html" title="← Hotels" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:9px;font-family:'Sarabun',sans-serif;font-weight:600">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
                Hotels
            </a>`;
        }
    }

    const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Hotel';
    const ini  = name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('nav-name').textContent   = name;
    document.getElementById('dd-name').textContent    = name;
    document.getElementById('dd-email').textContent   = user.email || '';
    const avatarUrl = user.user_metadata?.avatar_url || user.user_metadata?.picture || null;
    function setAvatarImg(src) {
        ['nav-avatar','dd-avatar'].forEach(id => {
            const el = document.getElementById(id);
            el.textContent = '';
            let img = el.querySelector('img');
            if (!img) { img = document.createElement('img'); el.appendChild(img); }
            img.src = src; img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';
        });
    }
    if (avatarUrl) { setAvatarImg(avatarUrl); }
    else { document.getElementById('nav-avatar').textContent = ini; document.getElementById('dd-avatar').textContent = ini; }
    const fbEmail = document.getElementById('fb-email');
    if (fbEmail) fbEmail.value = user.email || '';

    const siteId = paramSiteId || user.user_metadata?.site_id;
    if (!siteId) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-icon">🏨</div><div class="empty-title">Hotel non collegato</div><div class="empty-sub">Contatta il supporto per collegare il tuo sito</div></div>';
        return;
    }

    const now = new Date();
    const [{ data:site }, { data:pseData }] = await Promise.all([
        _SBq.from('isi_sites').select('*').eq('site_id', siteId).single(),
        _SBq.from('isi_pse_queries').select('created_at,cost_usd,result').eq('site_id', siteId).order('created_at',{ascending:false}).limit(500),
    ]);
    if (!site) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-title">Sito non trovato</div></div>';
        return;
    }

    _site = site;
    _appFeatures = user.user_metadata?.app_features || {};
    _siteAppPerms = site.features_override?.app || {};
    _pluginBase   = (site.site_url || '').replace(/\/$/, '');
    _pluginSecret = site.site_id;
    try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/site-id', { signal:ctrl.signal });
        if (r.ok) { const d = await r.json().catch(()=>({})); if (d.site_id) _pluginSecret = d.site_id; }
    } catch(_) {}

    const siteName = site.site_name || site.site_url || '—';
    document.getElementById('hero-hotel-name').textContent = siteName;

    const urlEl = document.getElementById('hero-url');
    if (urlEl) urlEl.textContent = (site.site_url||'').replace(/^https?:\/\//,'').replace(/\/$/,'') || '—';
    const geo0 = site.geo_scores || {};
    const geoVal0 = geo0.completeness_score ?? geo0.ai_readiness ?? null;
    const geoEl = document.getElementById('hero-geo');
    if (geoEl) geoEl.textContent = geoVal0 !== null ? Math.round(geoVal0/10) : '—';
    const rinEl = document.getElementById('hero-rinnovo');
    if (rinEl) {
        const rd = site.renewal_date || site.renew_date || null;
        rinEl.textContent = rd ? new Date(rd).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
    }

    // ── Sidebar navigation
    document.querySelectorAll('.h-nav-item[data-htab]').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.htab;
            document.querySelectorAll('.h-nav-item[data-htab]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('[id^="htab-"]').forEach(p => p.style.display = 'none');
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = '';
            if (tab==='faq')      initHotelFaq();
            if (tab==='schema')   initHotelSchema(site);
            if (tab==='mappa')    initHotelMappa(site);
            if (tab==='coerenza') { initHotelCoerenza(site); initAiLayerPanel(site); }
            if (tab==='config')   { initHotelConfig(site); initDatiSito(site, pseData||[]); }
            if (tab==='pse')      initHotelPseCharts(pseData||[]);
        });
    });

    // ── Sync button
    document.getElementById('btn-sync-header')?.addEventListener('click', () => {
        document.getElementById('btn-hotel-sync')?.click();
    });

    // ── User pill + dropdown
    document.getElementById('user-pill')?.addEventListener('click', e => {
        e.stopPropagation();
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = d.style.display==='none'?'':'none';
    });

        const p = document.getElementById('bell-panel');
        const d = document.getElementById('user-dropdown');

        if (p) {

                if (dot) dot.style.display = 'none';
                localStorage.setItem('isi_bell_seen', document.getElementById('bell-list')?.dataset.sig || '');
            }
        }
    });

    document.addEventListener('click', () => {
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = 'none';
        const p = document.getElementById('bell-panel');
        if (p) p.style.display = 'none';
    });

    // ── Logout (sidebar + dropdown)
    const doLogout = async () => { await _SB.auth.signOut(); window.location.href='login.html'; };
    document.getElementById('btn-logout-sidebar')?.addEventListener('click', doLogout);
    document.getElementById('dd-logout')?.addEventListener('click', doLogout);

    // ── Cambio nome
    const savedName = localStorage.getItem('isi_display_name');
    if (savedName) {
        document.getElementById('nav-name').textContent = savedName;
        document.getElementById('dd-name').textContent = savedName;
        const si = savedName.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
        document.getElementById('nav-avatar').textContent = si;
        document.getElementById('dd-avatar').textContent = si;
    }
    document.getElementById('profile-name-input').value = document.getElementById('nav-name').textContent;
    document.getElementById('profile-save-btn').addEventListener('click', () => {
        const n = document.getElementById('profile-name-input').value.trim();
        if (!n) return;
        localStorage.setItem('isi_display_name', n);
        const si = n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
        document.getElementById('nav-name').textContent = n;
        document.getElementById('dd-name').textContent = n;
        const av = document.getElementById('nav-avatar');
        const dav = document.getElementById('dd-avatar');
        if (!av.querySelector('img')) { av.textContent = si; dav.textContent = si; }
        document.getElementById('profile-modal').style.display = 'none';
    });

    // ── Cambio foto
    const savedPhoto = localStorage.getItem('isi_avatar_photo');
    if (savedPhoto) setAvatarImg(savedPhoto);
    document.getElementById('photo-input').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => { localStorage.setItem('isi_avatar_photo', ev.target.result); setAvatarImg(ev.target.result); };
        reader.readAsDataURL(file);
        e.target.value = '';
    });

    renderContent(site, pseData || [], now);
    applyAppFeatures(_appFeatures, _siteAppPerms);
}

// ─── PERMESSI APP ──────────────────────────────────────────────────────────────
function applyAppFeatures(userF, siteF) {
    const tabMap = { panoramica:'panoramica', faq:'faq', schema_org:'schema', mappa_query:'mappa', coerenza:'coerenza', config:'config', statistiche:'pse' };
    const allowed = key => userF[key] !== false && siteF[key] !== false;
    Object.entries(tabMap).forEach(([key, tab]) => {
        if (!allowed(key)) {
            document.querySelector(`.h-nav-item[data-htab="${tab}"]`)?.remove();
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = 'none';
        }
    });
}

const _isScriptSite = () => (_site?.hotel_profile?.site_mode === 'script');

async function initHotelFaq() {
    const listEl = document.getElementById('faq-hotel-list');
    if (!listEl || _faqItems.length) { renderHotelFaqList(listEl); return; }
    listEl.innerHTML = '<div class="loading" style="padding:20px"><div class="spinner"></div></div>';
    try {
        if (_isScriptSite()) {
            _faqItems = (_site?.faq_data?.items || []);
        } else {
            const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 9000);
            const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/faq', { signal:ctrl.signal });
            if (!r.ok) {
                const cached = _site?.faq_data?.items;
                if (cached && cached.length) { _faqItems = cached; }
                else throw new Error('HTTP ' + r.status);
            } else {
                const data = await r.json();
                _faqItems = data.items || [];
            }
        }
        // Deduplica per domanda: mantieni l'ID più alto, cancella i vecchi in background
        if (_pluginBase && !_isScriptSite()) {
            const seen = new Map();
            const toDelete = [];
            _faqItems.forEach(f => {
                const key = (f.question||'').trim().toLowerCase();
                if (seen.has(key)) {
                    const prev = seen.get(key);
                    if ((f.id||0) > (prev.id||0)) { toDelete.push(prev.id); seen.set(key, f); }
                    else { toDelete.push(f.id); }
                } else { seen.set(key, f); }
            });
            if (toDelete.length) {
                _faqItems = Array.from(seen.values());
                toDelete.forEach(id => fetch(_pluginBase + '/wp-json/in3pida/v1/faq', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({secret: _pluginSecret, action: 'delete', faq: {id}})
                }).catch(()=>{}));
            }
        }
        const badge = document.getElementById('faq-hotel-count');
        if (badge) badge.textContent = _faqItems.length ? '('+_faqItems.length+')' : '';
        renderHotelFaqList(listEl);
    } catch(e) {
        if (listEl) listEl.innerHTML = '<div style="color:#b00020;font-size:13px;padding:16px 20px">FAQ non caricate: '+esc(e.message)+'</div>';
    }
}

async function _scriptSaveFaq(action, faq) {
    const items = [...(_site?.faq_data?.items || [])];
    if (action === 'delete') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items.splice(idx, 1);
    } else if (action === 'add') {
        items.push({ id: Date.now(), question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false, status: 'publish', order: items.length });
    } else if (action === 'update') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items[idx] = { ...items[idx], question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false };
    }
    const newFaqData = { ...(_site?.faq_data || {}), items, total: items.length, _synced_at: new Date().toISOString(), _source: 'isi' };
    const { error } = await _SBq.from('isi_sites').update({ faq_data: newFaqData }).eq('site_id', _site.site_id);
    if (error) throw new Error(error.message);
    _site.faq_data = newFaqData;
    _faqItems = items;
}

function renderHotelFaqList(el) {
    if (!el) return;
    let items = _faqItems;
    if (_faqFilter==='publish') items = items.filter(f => f.status==='publish'||!f.status);
    if (_faqFilter==='draft')   items = items.filter(f => f.status==='draft');
    if (_faqFilter==='solo_ai') items = items.filter(f => f.solo_ai);
    if (_faqSearch) items = items.filter(f => (f.question||'').toLowerCase().includes(_faqSearch)||(f.answer||'').toLowerCase().includes(_faqSearch));
    if (!_faqItems.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ. Clicca + Aggiungi FAQ per iniziare.</div>'; return; }
    if (!items.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ corrisponde ai filtri.</div>'; return; }
    const fmt = d => { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };
    el.innerHTML = items.map((f,i) => {
        const pub = f.status==='draft'?'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Bozza</span>':'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Pubblicato</span>';
        const ai  = f.solo_ai?'<span style="background:#fce8ef;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px">Solo AI</span>':'';
        return `<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:0;align-items:center;padding:12px 20px;border-bottom:1px solid #f4f4f8">
            <div style="min-width:0"><div style="font-size:13px;font-weight:700;color:#171b33;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i+1}. ${esc(f.question)}</div><div style="font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((f.answer||'').substring(0,80))}${(f.answer||'').length>80?'…':''}</div></div>
            <div style="padding:0 16px;text-align:center;font-size:11px;color:#666b84;white-space:pre-line;line-height:1.4">${fmt(f.date||f.created_at)}</div>
            <div style="padding:0 12px;text-align:center;font-size:13px;font-weight:700;color:#171b33">${f.menu_order??f.order??0}</div>
            <div style="padding:0 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px">${pub}${ai}<div style="display:flex;gap:4px;margin-top:4px"><button class="btn-ping" style="font-size:11px;padding:3px 8px" onclick="openHotelFaqModal(${f.id})">✏️</button><button class="btn-ping" style="font-size:11px;padding:3px 8px;color:#b00020" onclick="deleteHotelFaq(${f.id})">🗑️</button></div></div>
        </div>`;
    }).join('');
}

function openHotelFaqModal(id) {
    const f = id ? _faqItems.find(x=>x.id===id) : null;
    document.getElementById('faq-hotel-modal-ttl').textContent = f ? 'Modifica FAQ' : 'Aggiungi FAQ';
    document.getElementById('fhm-id').value    = f ? f.id : '';

    document.getElementById('fhm-a').value     = f ? f.answer : '';

    document.getElementById('fhm-msg').style.display = 'none';
    document.getElementById('faq-hotel-modal').style.display = 'flex';

document.getElementById('fhm-save').addEventListener('click', async () => {
    const btn=document.getElementById('fhm-save'), msg=document.getElementById('fhm-msg');
    const id=document.getElementById('fhm-id').value, q=document.getElementById('fhm-q').value.trim(), a=document.getElementById('fhm-a').value.trim(), sa=document.getElementById('fhm-solo-ai').checked;
    if (!q) { msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Inserisci la domanda.'; return; }
    btn.disabled=true; btn.textContent='Salvataggio...';
    try {
        const action=id?'update':'add', faq={question:q,answer:a,solo_ai:sa,order:0};

            const d=await r.json().catch(()=>({}));

            else throw new Error(d.message||'Errore '+r.status);
        }
    } catch(e){ msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Errore: '+e.message; }
    finally { btn.disabled=false; btn.textContent='Salva FAQ'; }
});

window.deleteHotelFaq = async function(id) {
    const f=_faqItems.find(x=>x.id===id);
    if(!f||!confirm('Eliminare la FAQ "'+((f.question||'').substring(0,60))+'"?')) return;
    try {
        if (_isScriptSite()) {
            await _scriptSaveFaq('delete', {id});
            renderHotelFaqList(document.getElementById('faq-hotel-list'));
        } else {
            const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),10000);
            const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action:'delete',faq:{id}}),signal:ctrl.signal});
            const d=await r.json().catch(()=>({}));
            if(r.ok&&d.ok){ _faqItems=[]; await initHotelFaq(); } else alert('Errore durante eliminazione');
        }
    } catch(e){ alert('Errore: '+e.message); }
};

function buildSchemaJsonLd(p) {
    const obj = {
        '@context':'https://schema.org',
        '@type': p.tipo_struttura||p.type||'LodgingBusiness',
        'name': p.nome_hotel||p.name||'',
        'description': p.descrizione||p.description||undefined,
        'url': p.sito_web||p.url||undefined,
        'telephone': p.telefono||p.telephone||undefined,
        'email': p.email||undefined,
        'address': (p.via||p.street||p.citta||p.city) ? {
            '@type':'PostalAddress',
            'streetAddress':[p.via||p.street,p.numero_civico].filter(Boolean).join(' ')||undefined,
            'postalCode':p.cap||p.postal_code||undefined,
            'addressLocality':p.citta||p.city||undefined,
            'addressRegion':p.regione||p.region||undefined,
            'addressCountry':p.paese||p.country||'IT'
        } : undefined,
        'geo': (p.latitudine||p.latitude)&&(p.longitudine||p.longitude) ? {'@type':'GeoCoordinates','latitude':parseFloat(p.latitudine||p.latitude),'longitude':parseFloat(p.longitudine||p.longitude)} : undefined,
        'image': p.foto_principale||p.image||undefined,
        'starRating': (p.stelle||p.official_rating) ? {'@type':'Rating','ratingValue':parseInt(p.stelle||p.official_rating)} : undefined,
        'checkinTime': p.checkin_dalle||p.checkin_time||undefined,
        'checkoutTime': p.checkout_dalle||p.checkout_time||undefined,
        'priceRange': p.prezzo_medio||p.price_range||undefined,
        'numberOfRooms': (p.n_camere)?parseInt(p.n_camere):undefined,
        'aggregateRating': (function(){
            const candidates = [
                {src:'Booking.com',v:parseFloat(p.booking_rating),scale:10,n:parseInt(p.booking_n_recensioni||0)},
                {src:'Google',v:parseFloat(p.google_rating),scale:5,n:parseInt(p.google_n_recensioni||0)},
                {src:'TripAdvisor',v:parseFloat(p.tripadvisor_rating),scale:5,n:parseInt(p.tripadvisor_n_recensioni||0)},
            ].filter(c=>!isNaN(c.v)&&c.v>0);
            if(!candidates.length) return undefined;
            const best = candidates.reduce((a,b)=>(a.v/a.scale>=b.v/b.scale?a:b));
            return {'@type':'AggregateRating','ratingValue':best.v,'bestRating':best.scale,'reviewCount':best.n,'description':best.src};
        })(),
        'sameAs': [p.facebook_url,p.instagram_url,p.tripadvisor_url,p.google_business_url,...(p.social_custom||[]).map(x=>x.url)].filter(Boolean)||undefined,
        'amenityFeature': p.servizi ? p.servizi.split(',').map(x=>x.trim()).filter(Boolean).map(x=>({'@type':'LocationFeatureSpecification','name':x,'value':true})) : undefined,
    };
    function clean(o) {
        if (Array.isArray(o)) return o.map(clean);
        if (o&&typeof o==='object'){const r={};for(const k of Object.keys(o)){if(o[k]!==undefined&&o[k]!==''&&o[k]!==null&&!(Array.isArray(o[k])&&!o[k].length)){r[k]=clean(o[k]);}}return r;}
        return o;
    }
    return clean(obj);
}

async function rilevaStiloSito(siteId) {
    const btn = document.getElementById('btn-rileva-stile');
    const statusEl = document.getElementById('stile-status');
    const badgesEl = document.getElementById('stile-badges');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = 'Rilevamento...';
    if (statusEl) { statusEl.style.color = '#4b4d68'; statusEl.textContent = ''; }
    try {
        const { data: { session } } = await _SB.auth.getSession();
        if (!session) throw new Error('Sessione scaduta');
        const res = await fetch(SUPABASE_URL+'/functions/v1/pse-query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
            body: JSON.stringify({ site_id: siteId, action: 'detect_style' })
        });
        const json = await res.json();
        if (!json.writing_style) throw new Error(json.error || 'Nessuno stile rilevato');
        const ws = json.writing_style;
        const { data: freshSite } = await _SBq.from('isi_sites').select('hotel_profile').eq('site_id', siteId).single();
        const hp = freshSite?.hotel_profile || {};
        await _SBq.from('isi_sites').update({ hotel_profile: { ...hp, writing_style: ws } }).eq('site_id', siteId);
        if (badgesEl) {
            const badges = [ws.tono, ws.persona ? 'usa "'+ws.persona+'"' : '', ws.personalita].filter(Boolean)
                .map(b => '<span style="background:#e8f4f7;color:#0D5F75;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700">'+esc(b)+'</span>').join('');
            badgesEl.innerHTML = badges + (ws.esempio ? '<div style="background:#f7f8fc;border-radius:6px;padding:10px 14px;font-size:13px;color:#4b4d68;font-style:italic;margin-top:10px;line-height:1.6">"'+esc(ws.esempio)+'"</div>' : '');
        }
        if (statusEl) { statusEl.style.color = '#0D5F75'; statusEl.textContent = '✓ Stile rilevato e salvato.'; }
    } catch(e) {
        if (statusEl) { statusEl.style.color = '#d82d6b'; statusEl.textContent = 'Errore: ' + e.message; }
    }
    btn.disabled = false;
    btn.textContent = 'Rileva stile dal sito';
}

async function _detectRatings(silent = false) {
    const btn = document.getElementById('btn-detect-ratings');
    const status = document.getElementById('detect-ratings-status');
    const g = id => (document.getElementById('hsf-' + id)?.value || '').trim();
    const s = (text, color) => { if (!silent && status) { status.textContent = text; status.style.color = color || '#666b84'; } };
    const taUrl   = g('tripadvisor_url');
    const gUrl    = g('google_business_url');
    const bkUrl   = g('url_recensioni');
    if (!taUrl && !gUrl && !bkUrl) { s('Nessun URL trovato — inserisci prima i link', '#b00020'); return; }
    const { data: { session } } = await _SB.auth.getSession();
    if (!session) return;
    if (!silent) { btn.disabled = true; btn.textContent = 'Rilevamento...'; }
    s('Contatto i portali...', '#0D5F75');
    const call = async (url, source) => {
        if (!url) return null;
        try {
            const r = await fetch(SUPABASE_URL+'/functions/v1/fetch-rating', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                body: JSON.stringify({ url, source }),
            });
            return await r.json();
        } catch { return null; }
    };
    const [ta, goog, bk] = await Promise.all([call(taUrl,'tripadvisor'),call(gUrl,'google'),call(bkUrl,'booking')]);
    const fill = (id, val) => {
        const el = document.getElementById('hsf-' + id);
        if (el && val) { el.value = val; el.style.border = '2px solid #0D5F75'; el.style.background = '#eaf4f7'; setTimeout(() => { el.style.border = ''; el.style.background = ''; }, 4000); }
    };
    let found = 0;
    const portaliAggiornati = [];
    if (ta?.rating || ta?.n_recensioni) { if (ta.rating) { fill('tripadvisor_rating', ta.rating); found++; } if (ta.n_recensioni) { fill('tripadvisor_n_recensioni', ta.n_recensioni); found++; } portaliAggiornati.push('TripAdvisor'); }
    if (goog?.rating || goog?.n_recensioni) { if (goog.rating) { fill('google_rating', goog.rating); found++; } if (goog.n_recensioni) { fill('google_n_recensioni', goog.n_recensioni); found++; } portaliAggiornati.push('Google'); }
    if (bk?.rating || bk?.n_recensioni) { if (bk.rating) { fill('booking_rating', bk.rating); found++; } if (bk.n_recensioni) { fill('booking_n_recensioni', bk.n_recensioni); found++; } portaliAggiornati.push('Booking'); }
    if (!silent) { btn.disabled = false; btn.textContent = 'Rileva automaticamente'; }
    if (found > 0) s('Aggiornati: ' + portaliAggiornati.join(', ') + ' — salva per confermare', '#0D5F75');
    else s('Controllo effettuato — nessun aggiornamento trovato', '#666b84');
}

async function revertToPluginProfile() {

        site_id: _pluginSecret,
        page_title:    (document.getElementById('faq-setting-title')?.value||'').trim(),
        page_subtitle: (document.getElementById('faq-setting-subtitle')?.value||'').trim(),
        color_primary:         document.getElementById('faq-setting-color1')?.value||'',
        color_primary_inherit: document.getElementById('faq-setting-color1-inherit')?.checked||false,

        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 8000);

async function forceSync(siteId, siteUrl, btn) {
    const base = (siteUrl || '').replace(/\/$/, '');
    const orig = btn.textContent;
    btn.textContent = 'Sync...';
    btn.disabled = true;
    try {
        const { data: site, error } = await _SBq.from('isi_sites').select('hotel_profile, sync_secret').eq('site_id', siteId).single();
        if (error || !site) throw new Error('Sito non trovato in Supabase');
        if (!site.sync_secret) throw new Error('Secret non configurato');
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 15000);
        const r = await fetch(base + '/wp-json/in3pida/v1/receive-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ secret: site.sync_secret, hotel_profile: site.hotel_profile || {} }),
            signal: ctrl.signal,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Errore '+r.status);
        fetch(base + '/wp-json/in3pida/v1/force-heartbeat', { method:'POST', headers:{'Content-Type':'application/json'} }).catch(()=>{});
        btn.textContent = '✓ Sync OK';
        setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 2000);
    } catch(e) {
        btn.textContent = '✗ ' + e.message.slice(0, 25);
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 4000);
    }
}

function buildHotelFeatures(site) {
    const sc  = site.schema_data   || {};
    const hp  = site.hotel_profile || {};
    const am  = Array.isArray(sc.amenities) ? sc.amenities.map(a => a.toLowerCase()).join(' ') : '';
    const kw  = (sc.keywords     || '').toLowerCase();
    const des = (sc.description  || hp.descrizione || '').toLowerCase();
    const hpSrv = (hp.servizi || '').toLowerCase();
    const hpKnw = Array.isArray(hp.knowsabout) ? hp.knowsabout.join(' ').toLowerCase() : (hp.knowsabout || '').toLowerCase();
    const txt = am + ' ' + kw + ' ' + des + ' ' + hpSrv + ' ' + hpKnw;
    const hpTgt = (hp.target_clientela || '').toLowerCase();
    const city = (sc.city || sc.address?.addressLocality || hp.citta || hp.comune || '').toLowerCase();
    const beachCity = /cattolica|rimini|riccione|cesenatico|bellaria|igea|misano|cervia|milano marittima|pescara|jesolo|bibione|lignano|viareggio|forte dei marmi|marina di|lido di/i;
    return {
        city:              sc.city || sc.address?.addressLocality || hp.citta || hp.comune || '',
        hasMare:           beachCity.test(city) || /spiaggia|mare|beach|lungomare|riviera/.test(txt),
        hasMontagna:       /montagna|alpi|dolomiti|\bsci\b|trekking/.test(txt),
        hasSpiaggiaPropria:/spiaggia privata|spiaggia convenzionata|spiaggia riservata|ombrellone incluso|lettino incluso|accesso diretto.{0,12}mare|primo fila/.test(txt),
        hasFamily:         /famil|bambini/.test(txt),
        hasRomantic:       /romantic|luna di miele|honeymoon|suite nuziale|pacchett.{0,8}coppia|camera romantica/.test(txt),
        hasElderly:        /over.?65|terza.?et|anziani|senior|men[uù] dietetico|antiscivolo|servizio medico/.test(txt) || /anziani|over.?65|terza.?et/i.test(hpTgt),
        hasAccessibility:  /accessib|disabil|barriere architetton/.test(txt) || String(hp.servizi_accessibilita||'').trim().length > 5,
        hasPiscina:        /piscin/.test(txt),
        hasSpa:            /\bspa\b|sauna|hammam|bagno turco|centro benessere/.test(txt),
        hasPets:           /^s[iì]$/i.test(String(sc.pets_allowed||'')) || sc.pets_allowed === true || sc.pets_allowed === 'true' || /animali|pet friendly|cani/.test(txt),
        hasRistorante:     /ristorante|cucina|dining/.test(txt),
        hasColazione:      /colazione|breakfast/.test(txt),
        hasParcheggio:     /parcheggio|parking|garage/.test(txt),
        hasBusiness:       /sala meeting|sala conferenz|coworking|centro congressi/.test(txt),
        hasSports:         /palestra|biciclette|sport|fitness|escursion/.test(txt),
        hasMarriages:      /matrimon|wedding|riceviment|cerimoni|banchett/.test(txt),
        hasWellness:       /\bspa\b|benessere|wellness|sauna|massagg/.test(txt),
    };
}

function generateQueriesForHotel(site) {
    const features = buildHotelFeatures(site);
    const dest = features.city || 'Italia';
    const month = new Date().getMonth() + 1;
    const isSeason = month >= 3 && month <= 9;
    const result = {};
    INTENT_LIBRARY.forEach(intent => {
        if (!intent.appliesWhen(features)) return;
        const queries = [...intent.templates(dest)];
        if (isSeason && intent.seasonalTemplates) {
            intent.seasonalTemplates(dest).forEach(q => { if (!queries.includes(q)) queries.push(q); });
        }
        const cat = intent.category;
        if (!result[cat]) result[cat] = [];
        queries.forEach(q => { if (!result[cat].includes(q)) result[cat].push(q); });
    });
    return result;
}

function getPriorityForCategory(category, features, hotelQueries) {
    const alwaysMedia = ['prenotazione_prezzi', 'check_in_out', 'trasporti_arrivo'];
    const score = INTENT_LIBRARY
        .filter(i => i.category === category)
        .reduce((sum, i) => sum + i.priorityScore(features), 0);
    let prio;
    if (score >= 15) prio = 'alta';
    else if (score >= 8) prio = 'media';
    else if (score >= 3) prio = 'bassa';
    else if (hotelQueries[category]?.length) prio = 'bassa';
    else prio = 'non_rilevante';
    if (alwaysMedia.includes(category) && (prio === 'bassa' || prio === 'non_rilevante')) return 'media';
    return prio;
}

function applySignalBoost(priorityScores, signals) {
    if (!signals || !signals.length) return;
    const catKeywords = {
        'famiglie_con_bambini': /bambin|family|famil|piscin/i,
        'coppie_romantici':     /romantico|anniversario|luna.di.miele|coppia/i,
        'business_lavoro':      /meeting|business|conferenz|coworking|aziend/i,
        'animali_domestici':    /cane|gatto|animali|pet/i,
        'benessere_spa':        /spa|benessere|massagg|sauna|wellness/i,
        'matrimoni_eventi':     /matrimon|riceviment|nozze|cerimoni/i,
        'spiaggia_mare':        /spiaggia|mare|beach|lungomare/i,
        'sport_avventura':      /sport|palestra|escursion|biciclette|trekking/i,
        'prenotazione_prezzi':  /prenota|preventivo|offerta|tariffa|prezzo/i,
    };
    signals.forEach(sig => {
        const text = ((sig.page_url || '') + ' ' + (sig.element_text || '')).toLowerCase();
        Object.entries(catKeywords).forEach(([cat, rx]) => {
            if (rx.test(text)) priorityScores[cat] = (priorityScores[cat] || 0) + 5;
        });
    });
}

let _mappaCurrentSite = null, _mappaCurrentPseData = null;

async function initHotelMappa(site) {
    if (_mappaInited) return; _mappaInited = true;
    const cont = document.getElementById('hmappa-content');
    if (!cont) return;
    try { await _initHotelMappaInner(site, cont); }
    catch(e) { _mappaInited = false; cont.innerHTML = `<div style="padding:20px;color:#b00020;font-size:13px">Errore: ${esc(e.message)}</div>`; }
}

async function _initHotelMappaInner(site, cont) {
    _mappaCurrentSite = site;
    const faqData = site?.faq_data || {};
    const qmap = faqData.query_map || faqData.mappa_query || {};
    const faqQuestions = new Set((faqData.items || []).map(f => (f.question || '').toLowerCase().trim()));
    const hotelFeatures = buildHotelFeatures(site);
    const hotelQueries  = generateQueriesForHotel(site);

    const priorityScores = {};
    const allCats = [...new Set(INTENT_LIBRARY.map(i => i.category))];
    allCats.forEach(cat => {
        priorityScores[cat] = INTENT_LIBRARY
            .filter(i => i.category === cat && i.appliesWhen(hotelFeatures))
            .reduce((sum, i) => sum + i.priorityScore(hotelFeatures), 0);
    });
    try {
        const { data: signals } = await _SBq.from('isi_signals').select('event_type,page_url,element_text').eq('site_id', site.site_id).order('created_at', { ascending: false }).limit(200);
        if (signals && signals.length) applySignalBoost(priorityScores, signals);
    } catch(e) {}

    const cats = allCats.sort((a, b) =>
        PRIORITY_ORDER[getPriorityForCategory(a, hotelFeatures, hotelQueries)] -
        PRIORITY_ORDER[getPriorityForCategory(b, hotelFeatures, hotelQueries)]);

    let totalQ = 0, coveredQ = 0, dismissedQ = 0;
    cats.forEach(cat => {
        const qs = hotelQueries[cat] || [];
        const entry = qmap[cat] || {};
        const dismissed = Array.isArray(entry.dismissed_queries) ? entry.dismissed_queries : [];
        const activeQs = qs.filter(q => !dismissed.includes(q));
        const _storedCov = Array.isArray(entry.covered_queries) ? entry.covered_queries.filter(q => q.trim().endsWith('?')) : (entry.covered ? qs : []);
        const coveredSet = new Set([..._storedCov, ...qs.filter(q => faqQuestions.has(q.toLowerCase().trim()))]);
        totalQ += activeQs.length;
        coveredQ += activeQs.filter(q => coveredSet.has(q) || coveredSet.has(q.toLowerCase())).length;
        dismissedQ += dismissed.filter(q => qs.includes(q)).length;
    });
    const pct = totalQ > 0 ? Math.round(coveredQ / totalQ * 100) : 0;

    // Build intent queries map for this hotel
    const intentQueriesMap = {};
    INTENT_LIBRARY.forEach(intent => {
        if (!intent.appliesWhen(hotelFeatures)) return;
        const dest = hotelFeatures.city || 'Italia';
        const month = new Date().getMonth() + 1;
        const isSeason = month >= 3 && month <= 9;
        const queries = [...intent.templates(dest)];
        if (isSeason && intent.seasonalTemplates) {
            intent.seasonalTemplates(dest).forEach(q => { if (!queries.includes(q)) queries.push(q); });
        }
        if (!intentQueriesMap[intent.category]) intentQueriesMap[intent.category] = [];
        intentQueriesMap[intent.category].push({ intent, queries });
    });

    const renderQueryRow = (q, cat, isCov, sid) => {
        const qE = esc(q).replace(/'/g,"\\'");
        const cE = esc(cat);
        const sE = esc(sid);
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid #f4f4f8">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
                <span style="font-size:15px;color:${isCov?'#0D5F75':'#C1CBE8'};font-weight:800;flex-shrink:0">${isCov?'✓':'✗'}</span>
                <span style="font-size:13px;color:#171b33;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-left:12px;flex-shrink:0">
                ${isCov ? '<span style="font-size:11px;color:#0D5F75;font-weight:700;white-space:nowrap">Coperta ✓</span>' : ''}
                <button class="btn-update" style="padding:4px 10px;font-size:11px" onclick="generaRispostaQuery(this,'${cE}','${qE}','${sE}')">✦ Genera</button>
                <button class="btn-ping" style="padding:4px 8px;font-size:11px" onclick="apriModaleFaqHotel('${qE}')">✎ Scrivi</button>
                <button style="padding:4px 8px;font-size:11px;font-weight:600;background:white;border:1px solid #e4e4ec;border-radius:8px;cursor:pointer;color:#9ca3af;font-family:'Source Code Pro',monospace;white-space:nowrap" onclick="dismissHotelQuery(this,'${cE}','${qE}','${sE}')">✕</button>
            </div>
        </div>`;
    };

    const renderCat = cat => {
        const label = cat.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
        const prio  = getPriorityForCategory(cat, hotelFeatures, hotelQueries);
        const qs    = hotelQueries[cat] || [];
        const entry = qmap[cat] || {};
        const dismissedArr = Array.isArray(entry.dismissed_queries) ? entry.dismissed_queries : [];
        const dismissedSet = new Set(dismissedArr);
        const activeQs = qs.filter(q => !dismissedSet.has(q));
        const _storedCov = Array.isArray(entry.covered_queries) ? entry.covered_queries.filter(q => q.trim().endsWith('?')) : (entry.covered ? qs : []);
        const coveredSet = new Set([..._storedCov, ...qs.filter(q => faqQuestions.has(q.toLowerCase().trim()))]);
        const covQ = activeQs.filter(q => coveredSet.has(q) || coveredSet.has(q.toLowerCase())).length;
        const dotColor = prio==='alta'?'#0D5F75':prio==='media'?'#666b84':'#9ca3af';
        const catIntents = intentQueriesMap[cat] || [];
        let bodyHtml = '';
        if (catIntents.length > 0) {
            catIntents.forEach((item, idx) => {
                const activeIntentQs = item.queries.filter(q => !dismissedSet.has(q));
                if (!activeIntentQs.length) return;
                bodyHtml += `<div style="font-size:10px;font-weight:700;color:#666b84;text-transform:uppercase;padding:8px 20px 4px${idx>0?';border-top:1px solid #ececf2':''}">${esc(item.intent.label)}</div>`;
                bodyHtml += activeIntentQs.map(q => renderQueryRow(q, cat, coveredSet.has(q)||coveredSet.has(q.toLowerCase()), site.site_id)).join('');
            });
            const intentQs = new Set(catIntents.flatMap(i => i.queries));
            activeQs.filter(q => !intentQs.has(q)).forEach(q => {
                bodyHtml += renderQueryRow(q, cat, coveredSet.has(q)||coveredSet.has(q.toLowerCase()), site.site_id);
            });
        } else {
            bodyHtml = activeQs.map(q => renderQueryRow(q, cat, coveredSet.has(q)||coveredSet.has(q.toLowerCase()), site.site_id)).join('');
        }
        let dismissedHtml = '';
        if (dismissedArr.length > 0) {
            const dId = 'hdism-' + cat.replace(/[^a-z0-9]/gi,'_');
            dismissedHtml = `<div style="border-top:1px solid #ececf2">
                <button onclick="var c=document.getElementById('${dId}');var o=c.style.display!=='none';c.style.display=o?'none':'block';this.textContent=o?'▸ Mostra ${dismissedArr.length} non rilevanti':'▴ Nascondi non rilevanti';" style="width:100%;text-align:left;background:#fafafa;border:none;padding:8px 20px;font-size:10px;font-weight:600;color:#9ca3af;cursor:pointer;font-family:'Source Code Pro',monospace">▸ Mostra ${dismissedArr.length} non rilevanti</button>
                <div id="${dId}" style="display:none">${dismissedArr.map(q=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-top:1px solid #f4f4f8"><span style="font-size:12px;color:#9ca3af;text-decoration:line-through">${esc(q)}</span><button style="padding:4px 8px;font-size:11px;background:white;border:1px solid #e4e4ec;border-radius:6px;cursor:pointer;color:#0D5F75;font-family:'Source Code Pro',monospace" onclick="restoreHotelQuery(this,'${esc(cat)}','${esc(q).replace(/'/g,"\\'")}','${esc(site.site_id)}')">↩ Ripristina</button></div>`).join('')}</div>

        }
        return `<div class="card" style="margin-bottom:12px;border:1px solid #e4e4ec;box-shadow:none${prio==='non_rilevante'?';opacity:.45':''}">

                <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${dotColor};display:inline-block;flex-shrink:0"></span><div style="font-size:11px;font-weight:700;color:#171b33;letter-spacing:.05em;text-transform:uppercase">${esc(label)}</div>${PRIORITY_BADGE[prio]}</div>

            </div>
            ${bodyHtml}${dismissedHtml}
        </div>`;
    };

    const relevantCats   = cats.filter(c => getPriorityForCategory(c, hotelFeatures, hotelQueries) !== 'non_rilevante');
    const irrelevantCats = cats.filter(c => getPriorityForCategory(c, hotelFeatures, hotelQueries) === 'non_rilevante');

    // Summary bar
    cont.innerHTML = `<div style="background:#fafafa;border-bottom:1px solid #e4e4ec;padding:12px 20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:16px">

            <span style="font-size:12px;font-weight:700;color:#0D5F75;white-space:nowrap">${pct}% coperta</span>
        </div>
        <span style="font-size:11px;color:#666b84">${coveredQ}/${totalQ} query coperte</span>
        ${dismissedQ ? `<span style="font-size:11px;color:#9ca3af">${dismissedQ} ignorate</span>` : ''}
    </div>` +
    relevantCats.map(renderCat).join('') +
    (irrelevantCats.length ? `<div style="margin-bottom:12px"><button class="btn-ping" style="font-size:11px;margin-left:0" onclick="var s=document.getElementById('hirrel-cats');var sh=s.style.display!=='none';s.style.display=sh?'none':'block';this.textContent=sh?'▸ Mostra ${irrelevantCats.length} non rilevanti':'▴ Nascondi non rilevanti';">▸ Mostra ${irrelevantCats.length} categorie non rilevanti per questo hotel</button></div><div id="hirrel-cats" style="display:none">${irrelevantCats.map(renderCat).join('')}</div>` : '');
}

window.generaRispostaQuery = async function(btn, cat, query, siteId) {
    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳...';
    try {
        const { data: { session } } = await _SB.auth.getSession();
        if (!session) throw new Error('Sessione scaduta');
        const r = await fetch(`${SUPABASE_URL}/functions/v1/pse-query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
            body: JSON.stringify({ site_id: siteId, query, action: 'faq_generate' })
        });
        const json = await r.json();
        if (!json.answer) throw new Error(json.error || 'Nessuna risposta generata');
        const aiAnswer = json.answer;
        // Save to Supabase faq_data
        const { data: siteRow } = await _SBq.from('isi_sites').select('faq_data').eq('site_id', siteId).single();
        const fd = siteRow?.faq_data || {};
        const items = Array.isArray(fd.items) ? [...fd.items] : [];
        const existingIdx = items.findIndex(f => (f.question||'').trim().toLowerCase() === query.trim().toLowerCase());
        if (existingIdx >= 0) {
            items[existingIdx] = { ...items[existingIdx], answer: aiAnswer, solo_ai: true, status: 'publish', updated_at: new Date().toISOString() };
        } else {
            items.push({ id: Date.now(), question: query, answer: aiAnswer, solo_ai: true, status: 'publish', menu_order: 0, created_at: new Date().toISOString() });
        }
        const qmSave = fd.query_map || {};
        const catEntry = qmSave[cat] || {};
        const covQ2 = Array.isArray(catEntry.covered_queries) ? catEntry.covered_queries : [];
        if (!covQ2.includes(query)) covQ2.push(query);
        qmSave[cat] = { ...catEntry, covered_queries: covQ2 };
        await _SBq.from('isi_sites').update({ faq_data: { ...fd, items, query_map: qmSave } }).eq('site_id', siteId);
        if (_site) { _site.faq_data = { ...fd, items, query_map: qmSave }; _faqItems = []; }
        const wrapper = btn.closest('div[style*="gap:6px"]');
        if (wrapper) wrapper.innerHTML = `<span style="font-size:11px;color:#0D5F75;font-weight:700">Coperta ✓</span><button class="btn-update" style="padding:4px 10px;font-size:11px" onclick="generaRispostaQuery(this,'${esc(cat)}','${esc(query).replace(/'/g,"\\'")}','${esc(siteId)}')">✦ Genera</button>`;
        showToast('✓ FAQ generata e salvata');
    } catch(e) {
        showToast('⚠ ' + e.message);
        apriModaleFaqHotel(query);
    }
    btn.disabled = false; btn.textContent = origText;
};

window.dismissHotelQuery = async function(btn, cat, query, siteId) {
    btn.disabled = true; btn.textContent = '...';
    try {
        const { data: fresh } = await _SBq.from('isi_sites').select('faq_data').eq('site_id', siteId).single();
        const faq = fresh?.faq_data || _mappaCurrentSite?.faq_data || {};
        const qm = faq.query_map || {};
        const entry = qm[cat] || {};
        const dismissed = Array.isArray(entry.dismissed_queries) ? [...entry.dismissed_queries] : [];
        if (!dismissed.includes(query)) dismissed.push(query);
        const newFaq = { ...faq, query_map: { ...qm, [cat]: { ...entry, dismissed_queries: dismissed } } };
        await _SBq.from('isi_sites').update({ faq_data: newFaq }).eq('site_id', siteId);
        if (_mappaCurrentSite) _mappaCurrentSite.faq_data = newFaq;
        _mappaInited = false;
        if (_mappaCurrentSite) await initHotelMappa(_mappaCurrentSite);
    } catch(e) { btn.textContent = '✕'; btn.disabled = false; }
};

window.restoreHotelQuery = async function(btn, cat, query, siteId) {
    btn.disabled = true; btn.textContent = '...';
    try {
        const { data: fresh } = await _SBq.from('isi_sites').select('faq_data').eq('site_id', siteId).single();
        const faq = fresh?.faq_data || _mappaCurrentSite?.faq_data || {};
        const qm = faq.query_map || {};
        const entry = qm[cat] || {};
        const dismissed = (Array.isArray(entry.dismissed_queries) ? entry.dismissed_queries : []).filter(q => q !== query);
        const newFaq = { ...faq, query_map: { ...qm, [cat]: { ...entry, dismissed_queries: dismissed } } };
        await _SBq.from('isi_sites').update({ faq_data: newFaq }).eq('site_id', siteId);
        if (_mappaCurrentSite) _mappaCurrentSite.faq_data = newFaq;
        _mappaInited = false;
        if (_mappaCurrentSite) await initHotelMappa(_mappaCurrentSite);
    } catch(e) { btn.textContent = '↩ Ripristina'; btn.disabled = false; }
};

window.apriModaleFaqHotel = function(query, prefillAnswer, errorMsg) {

// ─── COERENZA ─────────────────────────────────────────────────────────────────
const _DEFAULT_COERENZA_CHANNELS_H = ['Google Business','Booking.com','TripAdvisor','Airbnb','Expedia'];

async function initHotelCoerenza(site) {
    if (_coerenzaInited) return; _coerenzaInited = true;
    const hp = site?.hotel_profile || {};
    const sc = site?.schema_data   || {};
    const cont = document.getElementById('hcoerenza-content');
    if (!cont) return;

    const addr = [hp.via, hp.numero_civico, hp.cap, hp.citta].filter(Boolean).join(', ') ||
                 [sc.street, sc.city, sc.postal_code].filter(Boolean).join(', ') || '—';

    const savedRaw = hp.coerenza_channels || {};
    const channels = {};
    const channelList = [..._DEFAULT_COERENZA_CHANNELS_H];

    if (Object.keys(savedRaw).length === 0) {
        channelList.forEach(ch => { channels[ch] = { url: '', last_scan_at: null, results: [], error: null }; });
        const hp2 = { ...hp, coerenza_channels: channels };
        site.hotel_profile = hp2;
        _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
    } else {
        channelList.length = 0;
        Object.keys(savedRaw).forEach(ch => {
            const s = savedRaw[ch];
            channelList.push(ch);
            channels[ch] = s && typeof s === 'object'
                ? { url: s.url || '', last_scan_at: s.last_scan_at || null, results: s.results || [], error: s.error || null }
                : { url: '', last_scan_at: null, results: [], error: null };
        });
    }

    const refData = {
        'Nome struttura': sc.name || hp.nome_hotel || hp.nome || '',
        'Stelle':         String(sc.official_rating || hp.stelle || ''),
        'Indirizzo':      addr !== '—' ? addr : '',
        'Telefono':       hp.telefono || sc.telephone || '',
        'Email':          hp.email || sc.email || '',
        'Check-in':       hp.checkin_dalle || sc.checkin_time || '',
        'Check-out':      hp.checkout_alle || sc.checkout_time || '',
        'Sito web':       hp.sito_web || sc.url || '',
    };

    const expandedChannels = new Set();

    function renderChannels() {
        cont.innerHTML = channelList.map(ch => {
            const d = channels[ch];
            const hasUrl = !!d.url;
            const hasResults = d.results && d.results.length > 0;
            const hasDetail = hasResults || !!d.error;
            const matchCount    = hasResults ? d.results.filter(r => r.match).length : 0;
            const totalCount    = hasResults ? d.results.length : 0;
            const incoerCount   = hasResults ? d.results.filter(r => !r.match && r.found_value).length : 0;
            const notFoundCount = hasResults ? d.results.filter(r => !r.match && !r.found_value).length : 0;
            const isExpanded    = expandedChannels.has(ch);

            let statusHtml;
            if (!hasUrl) {
                statusHtml = '<span style="font-size:13px;color:#9ca3af">URL non configurato — inserisci il link alla tua scheda su questo portale</span>';
            } else if (d.error) {
                statusHtml = '<span style="font-size:13px;color:#b00020">⚠ ' + esc(d.error) + '</span>';
            } else if (!hasResults) {
                statusHtml = '<span style="font-size:13px;color:#666b84">Non ancora scansionato</span>';
            } else if (incoerCount === 0) {
                const nf = notFoundCount > 0 ? ' · '+notFoundCount+' non trovati' : '';
                statusHtml = '<span style="font-size:13px;color:#0D5F75">✓ '+matchCount+'/'+totalCount+' campi allineati'+nf+'</span>';
            } else {
                const nf = notFoundCount > 0 ? ' · '+notFoundCount+' non trovati' : '';
                statusHtml = '<span style="font-size:13px;color:#b00020">✗ '+matchCount+'/'+totalCount+' allineati · '+incoerCount+' incoerenze'+nf+'</span>';
            }

            const arrowSvg = hasDetail
                ? `<button type="button" class="hbtn-toggle-ch" data-channel="${esc(ch)}"
                    style="background:none;border:none;cursor:pointer;padding:1px 3px;flex-shrink:0;display:inline-flex;align-items:center;line-height:1;vertical-align:middle">
                    <svg viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="width:9px;height:9px;transition:transform .18s ease;transform:rotate(${isExpanded ? '0' : '-90'}deg)">
                        <path d="M1 1L5 5.5L9 1" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg></button>` : '';

            let detailHtml = '';
            if (hasDetail && isExpanded) {
                if (d.error) {
                    detailHtml = `<div style="margin-top:10px;padding:10px 12px;background:#fff5f7;border:1px solid #C1CBE8;border-radius:6px;font-size:13px;color:#b00020">
                        ${esc(d.error)}
                        ${d.last_scan_at ? `<div style="margin-top:4px;font-size:12px;color:#9ca3af">Ultima scansione: ${new Date(d.last_scan_at).toLocaleDateString('it-IT')} alle ${new Date(d.last_scan_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div>` : ''}
                    </div>`;
                } else if (hasResults) {
                    detailHtml = '<div style="margin-top:12px;border-top:1px solid #f4f4f8;padding-top:10px">' +
                        '<div style="display:grid;grid-template-columns:130px 1fr 1fr 28px;gap:8px;padding:0 0 6px 0;border-bottom:1px solid #e4e4ec;margin-bottom:4px">' +
                            '<div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em">Campo</div>' +
                            '<div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em">I tuoi dati</div>' +
                            '<div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em">Trovato su '+esc(ch)+'</div>' +
                            '<div></div>' +
                        '</div>' +
                        d.results.map(r =>
                            `<div style="display:grid;grid-template-columns:130px 1fr 1fr 28px;gap:8px;align-items:start;padding:5px 0;border-bottom:1px solid #f4f4f8">
                                <div style="font-size:12px;font-weight:700;color:#666b84;padding-top:1px">${esc(r.field)}</div>
                                <div style="font-size:13px;color:#4b4d68">${esc(r.our_value || '—')}</div>
                                <div style="font-size:13px;color:${r.match ? '#4b4d68' : (r.found_value ? '#b00020' : '#9ca3af')};font-weight:${r.match ? '400' : (r.found_value ? '700' : '400')}">${esc(r.found_value || '—')}</div>
                                <div style="font-size:15px;text-align:center;padding-top:1px">${r.match ? '<span style="color:#C1CBE8">✓</span>' : (r.found_value ? '<span style="color:#b00020">✗</span>' : '<span style="color:#9ca3af">○</span>')}</div>
                            </div>`
                        ).join('') + '</div>';
                    if (d.last_scan_at) {
                        const dt = new Date(d.last_scan_at);
                        detailHtml += `<div style="font-size:12px;color:#9ca3af;margin-top:8px">Ultima scansione: ${dt.toLocaleDateString('it-IT')} alle ${dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div>`;
                    }
                }
            }

            return `<div style="border:1px solid #e4e4ec;border-radius:8px;padding:14px 16px;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                    <div style="font-size:14px;font-weight:700;color:#171b33;flex-shrink:0">${esc(ch)}</div>
                    <input type="url" class="hcoer-url-inp" data-channel="${esc(ch)}" value="${esc(d.url||'')}" placeholder="https://..." style="flex:1;min-width:0;border:1px solid #e4e4ec;border-radius:6px;padding:7px 10px;font-size:13px;outline:none;color:#171b33;background:#fff">
                    <button type="button" class="hbtn-scan-ch" data-channel="${esc(ch)}" style="background:#0D5F75;color:white;border:none;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Source Code Pro',monospace;white-space:nowrap;flex-shrink:0">Scansiona</button>
                    <button type="button" class="hbtn-save-ch" data-channel="${esc(ch)}" style="background:transparent;color:#171b33;border:1.5px solid #e4e4ec;border-radius:4px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Source Code Pro',monospace;white-space:nowrap;flex-shrink:0">Salva</button>
                    <button type="button" class="hbtn-remove-ch" data-channel="${esc(ch)}" style="background:none;border:1px solid #e4e4ec;border-radius:4px;padding:5px 8px;cursor:pointer;color:#9ca3af;font-size:13px;line-height:1">✕</button>
                </div>
                <div class="${hasDetail ? 'hcoer-status-row' : ''}" data-channel="${esc(ch)}" style="${hasDetail ? 'cursor:pointer;' : ''}display:inline-flex;align-items:center;gap:5px">
                    ${statusHtml}
                    ${arrowSvg}
                </div>
                ${detailHtml}
            </div>`;
        }).join('');

        cont.querySelectorAll('.hcoer-url-inp').forEach(inp => {
            inp.onblur = async () => {
                const ch = inp.dataset.channel, url = inp.value.trim();
                if (channels[ch].url === url) return;
                channels[ch].url = url;
                const hp2 = site?.hotel_profile || {};
                await _SBq.from('isi_sites').update({ hotel_profile: {...hp2, coerenza_channels: channels} }).eq('site_id', site.site_id);
                renderChannels();
            };
            inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
        });
        cont.querySelectorAll('.hbtn-save-ch').forEach(btn => {
            btn.onclick = async () => {
                const ch = btn.dataset.channel;
                const url = cont.querySelector(`.hcoer-url-inp[data-channel="${ch}"]`)?.value?.trim() || '';
                channels[ch].url = url;
                const hp2 = site?.hotel_profile || {};
                hp2.coerenza_channels = channels;
                site.hotel_profile = hp2;
                await _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
                btn.textContent = '✓ Salvato'; btn.style.color = '#0D5F75'; btn.style.borderColor = '#C1CBE8';
                setTimeout(() => { btn.textContent = 'Salva'; btn.style.color = '#171b33'; btn.style.borderColor = '#e4e4ec'; }, 2000);
            };
        });
        cont.querySelectorAll('.hbtn-scan-ch').forEach(btn => {
            btn.onclick = () => {
                const ch = btn.dataset.channel;
                const url = (cont.querySelector(`.hcoer-url-inp[data-channel="${ch}"]`))?.value?.trim() || channels[ch]?.url;
                if (!url) { showToast('Inserisci prima il link per ' + ch); return; }
                channels[ch].url = url;
                scanHotelChannel(ch, url, btn);
            };
        });
        cont.querySelectorAll('.hbtn-remove-ch').forEach(btn => {
            btn.onclick = () => {
                const ch = btn.dataset.channel;
                const modal = document.getElementById('hmodal-del-canale');
                if (modal) {
                    document.getElementById('hmodal-del-canale-msg').textContent = 'Rimuovere il canale "' + ch + '"?';
                    modal.style.display = 'flex';
                    const okBtn = document.getElementById('hbtn-ok-del-canale');
                    const newOkBtn = okBtn.cloneNode(true);
                    okBtn.parentNode.replaceChild(newOkBtn, okBtn);
                    newOkBtn.onclick = async () => {
                        modal.style.display = 'none';
                        const idx = channelList.indexOf(ch);
                        if (idx > -1) channelList.splice(idx, 1);
                        delete channels[ch];
                        expandedChannels.delete(ch);
                        const hp2 = site?.hotel_profile || {};
                        hp2.coerenza_channels = channels;
                        site.hotel_profile = hp2;
                        await _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
                        renderChannels();
                    };
                }
            };
        });
        cont.querySelectorAll('.hbtn-toggle-ch, .hcoer-status-row').forEach(el => {
            el.onclick = (e) => {
                if (el.classList.contains('hcoer-status-row') && e.target.closest('.hbtn-toggle-ch')) return;
                const ch = el.dataset.channel;
                if (!ch) return;
                if (expandedChannels.has(ch)) expandedChannels.delete(ch);
                else expandedChannels.add(ch);
                renderChannels();
            };
        });
    }

    async function scanHotelChannel(ch, url, btn) {
        const origText = btn ? btn.textContent : '';
        if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }
        try {
            const { data: { session } } = await _SB.auth.getSession();
            if (!session) throw new Error('Sessione scaduta');
            const r = await fetch(`${SUPABASE_URL}/functions/v1/channel-scan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                body: JSON.stringify({ site_id: site.site_id, channel: ch, url }),
            });
            const res = await r.json();
            if (res.results && res.results.length) {
                channels[ch].results = res.results;
                channels[ch].last_scan_at = new Date().toISOString();
                channels[ch].error = null;
                expandedChannels.add(ch);
                const hp2 = site?.hotel_profile || {};
                hp2.coerenza_channels = channels;
                site.hotel_profile = hp2;
                await _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
                renderChannels();
                showToast('Scansione ' + ch + ' completata.');
            } else {
                const msg = res.message || 'Impossibile leggere la pagina. Prova con un URL diretto alla scheda hotel.';
                channels[ch].error = msg;
                channels[ch].last_scan_at = new Date().toISOString();
                expandedChannels.add(ch);
                const hp2 = site?.hotel_profile || {};
                hp2.coerenza_channels = channels;
                site.hotel_profile = hp2;
                await _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
                renderChannels();
                showToast('⚠ ' + ch + ': ' + msg);
            }
        } catch(e) { showToast('Errore: ' + e.message); }
        if (btn) { btn.textContent = origText || 'Scansiona'; btn.disabled = false; }
    }

    renderChannels();

    window._hDoAggiungiCanale = async () => {
        const inp = document.getElementById('hinput-nuovo-canale');
        const ch = (inp?.value || '').trim();
        if (!ch) return;
        if (channelList.includes(ch)) { showToast('Canale già presente.'); document.getElementById('hmodal-canale').style.display = 'none'; return; }
        channelList.push(ch);
        channels[ch] = { url: '', last_scan_at: null, results: [] };
        const hp2 = site?.hotel_profile || {};
        hp2.coerenza_channels = channels;
        site.hotel_profile = hp2;
        await _SBq.from('isi_sites').update({ hotel_profile: hp2 }).eq('site_id', site.site_id);
        renderChannels();
        document.getElementById('hmodal-canale').style.display = 'none';
    };

    function buildHReportRows() {

        let html = '';

            html += `<div style="border:1px solid #e4e4ec;border-radius:8px;margin-bottom:12px;overflow:hidden">`;
            html += `<div style="background:#f7f7fb;padding:10px 14px;border-bottom:1px solid #e4e4ec;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                <span style="font-weight:700;font-size:14px;color:#171b33">${esc(ch)}</span>
                ${shortUrl ? `<span style="font-size:12px;color:#C1CBE8">${esc(shortUrl)}</span>` : ''}

            } else if (!d.results?.length) {
                html += `<div style="padding:10px 14px;font-size:13px;color:#666b84">Non ancora scansionato</div>`;
            } else {
                html += `<table style="width:100%;border-collapse:collapse">
                    <thead><tr>
                        <th style="${thS};width:120px">Campo</th>
                        <th style="${thS}">I tuoi dati</th>
                        <th style="${thS}">Trovato sul portale</th>
                        <th style="${thS};width:36px;text-align:center">✓/✗</th>
                    </tr></thead><tbody>`;
                d.results.forEach(r => {
                    const icon = r.match ? '✓' : (r.found_value ? '✗' : '○');
                    const iconColor = r.match ? '#C1CBE8' : (r.found_value ? '#b00020' : '#9ca3af');
                    html += `<tr>
                        <td style="padding:8px 14px;font-size:13px;font-weight:600;color:#4b4d68;border-bottom:1px solid #f4f4f8">${esc(r.field)}</td>

        w.document.close();

    const btnAll = document.getElementById('btn-avvia-scansione-h');
    if (btnAll) btnAll.onclick = async () => {
        const configured = channelList.filter(ch => channels[ch]?.url);
        if (!configured.length) { showToast('Inserisci prima i link ai portali per avviare la scansione.'); return; }

        ) : '') +

    // ── Google Search Console OAuth ─────────────────────────────────────────
    async function hSaveGscConfig(email, gscSite, accessToken) {
        const { data: freshSC } = await _SBq.from('isi_sites').select('hotel_profile').eq('site_id', site.site_id).single();
        const hp3 = freshSC?.hotel_profile || hp;

    async function hFetchGscData(accessToken, gscSite) {
        const endDate = new Date().toISOString().slice(0,10);
        const startDate = new Date(Date.now() - 28*86400000).toISOString().slice(0,10);
        const res = await fetch(`https://searchconsole.googleapis.com/webmasters/v3/sites/${encodeURIComponent(gscSite)}/searchAnalytics/query`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ startDate, endDate, dimensions: ['query'], rowLimit: 10, startRow: 0 })
        });
        if (!res.ok) throw new Error('GSC API error ' + res.status);
        return await res.json();
    }

    function hRenderGscData(data) {
        const gc = document.getElementById('hgsc-data-container');
        if (!gc) return;
        const rows = data.rows || [];
        if (!rows.length) { gc.innerHTML = '<div style="font-size:13px;color:#9ca3af">Nessun dato disponibile negli ultimi 28 giorni.</div>'; return; }
        gc.innerHTML = `<div style="font-size:11px;font-weight:700;color:#666b84;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Top query (ultimi 28 gg)</div>` +
            `<table style="width:100%;border-collapse:collapse;font-size:12px">` +
            `<tr style="color:#9ca3af;border-bottom:1px solid #f0f0f5"><td style="padding:4px 8px 4px 0">Query</td><td style="padding:4px 8px;text-align:right">Click</td><td style="padding:4px 8px;text-align:right">Impr.</td><td style="padding:4px 8px;text-align:right">CTR</td><td style="padding:4px 0;text-align:right">Pos.</td></tr>` +

    }

    const btnConnectGsc = document.getElementById('hbtn-connect-gsc');

        btnConnectGsc.addEventListener('click', async () => {
            const msg = document.getElementById('hgsc-msg');
            btnConnectGsc.disabled = true; btnConnectGsc.textContent = '⏳ Connessione...';
            try {
                let clientId = localStorage.getItem('isi_gsc_client_id') || '';
                if (!clientId) {
                    clientId = await new Promise((res2, rej2) => {
                        const ov = document.createElement('div');
