<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Eletta — Posiziona il tuo sito nelle ricerche AI</title>
    <link rel="icon" type="image/png" href="images/favicon.png?v=2">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        .tip-q{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#0D5F75;color:white;font-size:9px;font-weight:800;cursor:default;flex-shrink:0;user-select:none;vertical-align:middle}

        /* ─── LAYOUT ─── */
        body{margin:0;padding:0;background:#eef1f8;}
        .eletta-layout{display:flex;min-height:100vh;}

        /* ─── SIDEBAR ─── */
        .eletta-sidebar{width:68px;min-height:100vh;background:#1e2140;display:flex;flex-direction:column;align-items:center;position:fixed;top:0;left:0;z-index:200;padding:14px 0;}
        .sidebar-brand{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;cursor:pointer;}
        .sidebar-nav{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;width:100%;}
        .sidebar-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:9px 4px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.45);font-family:'Sarabun',sans-serif;font-size:9px;font-weight:600;letter-spacing:.01em;transition:all .15s;text-align:center;line-height:1.2;}
        .sidebar-item:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.06);}
        .sidebar-item.active{color:white;background:rgba(255,255,255,0.1);}
        .sidebar-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .sidebar-sep{width:36px;height:1px;background:rgba(255,255,255,0.1);margin:6px 0;}
        .sidebar-bottom{width:100%;display:flex;flex-direction:column;align-items:center;}

        /* ─── RIGHT AREA ─── */
        .eletta-right-area{margin-left:68px;flex:1;display:flex;flex-direction:column;min-height:100vh;}

        /* ─── HEADER ─── */
        .eletta-header{background:white;height:60px;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 #e8e8f0;gap:16px;}
        .eletta-header-logo{display:flex;align-items:center;flex-shrink:0;}
        .eletta-header-logo img{height:26px;width:auto;}
        .btn-sincronizza{background:#EFEF14;color:#0D5F75;border:none;border-radius:24px;padding:8px 22px;font-family:'Commissioner',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;flex-shrink:0;}
        .btn-sincronizza:hover{opacity:.88;}
        .btn-sincronizza:disabled{opacity:.5;cursor:not-allowed;}
        .eletta-header-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
        .header-bell{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#666b84;position:relative;transition:background .15s;}
        .header-bell:hover{background:#f4f4f8;}
        .header-bell-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#ff6b2b;border:2px solid white;}

        /* ─── HERO ─── */
        .eletta-hero{background:linear-gradient(135deg,#0D5F75 0%,#0a4d60 100%);padding:18px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
        .eletta-hero-name{font-family:'Commissioner',sans-serif;font-size:24px;font-weight:700;color:white;flex-shrink:0;}
        .eletta-hero-chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
        .hero-chip{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);border-radius:24px;padding:5px 14px;font-size:12px;color:white;display:flex;align-items:center;gap:6px;white-space:nowrap;}
        .hero-chip-label{font-size:10px;opacity:.65;font-weight:600;}
        .hero-chip-solid{background:rgba(255,255,255,0.88);color:#0D5F75;border-color:transparent;font-weight:700;}

        /* ─── CONTENT ─── */
        .eletta-content{background:#eef1f8;flex:1;padding:24px 28px;}
        .dash-heading{font-family:'Commissioner',sans-serif;font-size:24px;font-weight:700;color:#171b33;margin-bottom:20px;}

        /* ─── KPI CARDS ─── */
        .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
        .kpi-card{background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px 22px;position:relative;}
        .kpi-card-title{font-size:12px;font-weight:600;color:#666b84;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
        .kpi-card-value{font-size:42px;font-weight:800;line-height:1;color:#171b33;margin-bottom:6px;}
        .kpi-card-sub{font-size:12px;font-weight:500;color:#888;}
        .kpi-card-icon{position:absolute;top:18px;right:18px;}

        /* ─── ELETTA CARD (right float) ─── */
        .eletta-info-card{background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px;margin-bottom:16px;}
        .eletta-info-title{font-family:'Commissioner',sans-serif;font-size:18px;font-weight:700;color:#0D5F75;margin-bottom:16px;line-height:1.3;}
        .eletta-info-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f6;font-size:13px;color:#4b4d68;}
        .eletta-info-row:last-of-type{border-bottom:none;}
        .eletta-info-icon{width:28px;height:28px;border-radius:50%;background:#eef1f8;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

        /* ─── SECTION HEADING ─── */
        .section-heading{display:flex;align-items:center;gap:10px;margin:20px 0 14px;}
        .section-heading-icon{width:30px;height:30px;border-radius:50%;background:#0D5F75;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .section-heading h2{font-size:19px;font-weight:700;color:#171b33;line-height:1;margin:0;}
        .section-heading p{font-size:12px;color:#666b84;margin:2px 0 0;}

        /* ─── ELETTA CARD (pannello) ─── */
        .h-card{background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px;}
        .h-card-header{padding:14px 20px;border-bottom:1px solid #f0f0f6;display:flex;align-items:center;justify-content:space-between;}
        .h-card-title{font-size:13px;font-weight:700;color:#171b33;display:flex;align-items:center;gap:6px;}
        .h-card-body{padding:16px 20px;}

        /* ─── OVERRIDE GLOBAL CARD STYLE ─── */
        .card{border-radius:14px!important;box-shadow:0 2px 12px rgba(0,0,0,.06)!important;border:none!important;background:white;}
        .card-header{border-radius:14px 14px 0 0!important;background:white!important;border-bottom:1px solid #f0f0f6!important;}
        .card-header .card-title,.card-header div{color:#171b33;}
    </style>
</head>
<body>

<!-- MODAL FAQ -->
<div id="faq-hotel-modal" class="info-overlay" style="display:none">
    <div class="info-card" style="max-width:600px">
        <div class="info-card-header">
            <span id="faq-hotel-modal-ttl">Aggiungi FAQ</span>
            <button class="info-close" id="faq-hotel-modal-close">✕</button>
        </div>
        <div class="info-card-body">
            <input type="hidden" id="fhm-id">
            <div class="profile-field">
                <label class="profile-label">Domanda *</label>
                <input type="text" id="fhm-q" class="profile-input" placeholder="Es: Dove si trova l'hotel?">
            </div>
            <div class="profile-field">
                <label class="profile-label">Risposta</label>
                <textarea id="fhm-a" class="profile-input" rows="5" style="resize:vertical" placeholder="Scrivi la risposta completa..."></textarea>
            </div>
            <div class="profile-field" style="display:flex;align-items:center;gap:10px">
                <input type="checkbox" id="fhm-solo-ai" style="width:16px;height:16px;cursor:pointer;accent-color:#0D5F75">
                <label for="fhm-solo-ai" style="font-size:13px;font-weight:600;cursor:pointer;color:#171b33">Solo AI <span style="color:var(--grey);font-weight:400">— visibile solo al layer LLM, non sul sito pubblico</span></label>
            </div>
            <div id="fhm-msg" style="font-size:13px;margin-top:10px;display:none;padding:8px 12px;border-radius:8px"></div>
            <div class="profile-actions" style="margin-top:16px">
                <button class="btn-save-profile" id="fhm-save">Salva FAQ</button>
                <button class="btn-ping" id="fhm-cancel" style="margin-left:8px">Annulla</button>
            </div>
        </div>
    </div>
</div>

<div class="eletta-layout">

    <!-- ─── SIDEBAR ─── -->
    <div class="eletta-sidebar">
        <div class="sidebar-brand">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="rgba(255,255,255,0.12)"/><text x="14" y="20" text-anchor="middle" font-family="Commissioner,sans-serif" font-size="14" font-weight="700" fill="white">E</text></svg>
        </div>
        <nav class="sidebar-nav">
            <button class="sidebar-item active" data-htab="panoramica">
                <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
                Panoramica

            <button class="sidebar-item" data-htab="faq">

            <button class="sidebar-item" data-htab="schema">

            </button>
            <button class="sidebar-item" data-htab="mappa">
                <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></span>

            </button>
            <button class="sidebar-item" data-htab="config">
                <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
                Config.
            </button>
        </nav>
        <div class="sidebar-bottom">
            <div class="sidebar-sep"></div>
            <button class="sidebar-item" id="dd-logout">
                <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></span>
                Esci
            </button>
        </div>
    </div>

    <!-- ─── RIGHT AREA ─── -->
    <div class="eletta-right-area">

        <!-- HEADER -->
        <header class="eletta-header">
            <div class="eletta-header-logo">
                <img src="images/logo-eletta.png" alt="Eletta">
            </div>
            <button class="btn-sincronizza" id="btn-header-sync">Sincronizza</button>
            <div class="eletta-header-right">
                <button id="btn-feedback" onclick="document.getElementById('feedback-overlay').style.display='flex'" style="background:none;border:1px solid #C1CBE8;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:#0D5F75;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Sarabun',sans-serif"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Feedback</button>
                <div class="navbar-user-pill" id="user-pill" style="cursor:pointer">
                    <div class="navbar-avatar" id="nav-avatar">H</div>
                    <div class="navbar-user-text">
                        <div class="navbar-user-name" id="nav-name">Hotel</div>
                        <div class="navbar-user-sub">Pannello Hotel</div>
                    </div>
                </div>
                <button class="header-bell" id="btn-bell">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
                    <span class="header-bell-dot" id="bell-dot" style="display:none"></span>
                </button>
                <div class="user-dropdown" id="user-dropdown" style="display:none;position:absolute;top:70px;right:24px;">
                    <div class="user-dropdown-header">
                        <div class="user-dropdown-avatar" id="dd-avatar">H</div>
                        <div>
                            <div class="user-dropdown-name" id="dd-name">Hotel</div>
                            <div class="user-dropdown-email" id="dd-email"></div>

                    </div>
                    <div class="user-dropdown-divider"></div>
                    <button class="user-dropdown-item logout" id="dd-logout-inner">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                        Esci
                    </button>
                </div>
            </div>
        </header>

        <!-- HERO -->
        <div class="eletta-hero">
            <div class="eletta-hero-name" id="hero-hotel-name">—</div>
            <div class="eletta-hero-chips">
                <div class="hero-chip">
                    <span class="hero-chip-label">Url del sito</span>
                    <span id="hero-url">—</span>
                </div>
                <div class="hero-chip hero-chip-solid">
                    Punteggio GEO <span id="hero-geo-score">—</span>/10

        <!-- MAIN CONTENT -->

</div><!-- /eletta-layout -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL      = 'https://yyauvoqjdzrbmebeafit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w';
const _SB  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _SBq = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });

let _site = null, _pluginBase = '', _pluginSecret = '', _appFeatures = {}, _siteAppPerms = {};
let _faqItems = [], _faqFilter = 'all', _faqSearch = '';
let _pseChartsInited = false, _mappaInited = false, _coerenzaInited = false, _configInited = false;

// ─── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const { data:{ session } } = await _SB.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await _SBq.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token || '' });
    const user = session.user;
    if (user.user_metadata?.role === 'admin') { window.location.href = 'index.html'; return; }

    const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Hotel';
    const ini  = name.charAt(0).toUpperCase();
    document.getElementById('nav-name').textContent   = name;
    document.getElementById('nav-avatar').textContent = ini;
    document.getElementById('dd-name').textContent    = name;
    document.getElementById('dd-email').textContent   = user.email || '';
    document.getElementById('dd-avatar').textContent  = ini;
    const fbEmail = document.getElementById('fb-email');
    if (fbEmail) fbEmail.value = user.email || '';

    const siteId = user.user_metadata?.site_id;
    if (!siteId) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-icon">🏨</div><div class="empty-title">Hotel non collegato</div><div class="empty-sub">Contatta il supporto per collegare il tuo sito</div></div>';
        return;
    }

    const now = new Date();
    const [{ data:site }, { data:pseData }] = await Promise.all([
        _SBq.from('isi_sites').select('*').eq('site_id', siteId).single(),
        _SBq.from('isi_pse_queries').select('created_at,cost_usd,result').eq('site_id', siteId).order('created_at',{ascending:false}).limit(500),
    ]);
    if (!site) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-title">Sito non trovato</div></div>';
        return;
    }

    _site = site;
    _appFeatures = user.user_metadata?.app_features || {};
    _siteAppPerms = site.features_override?.app || {};
    _pluginBase   = (site.site_url || '').replace(/\/$/, '');
    _pluginSecret = site.site_id;
    try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/site-id', { signal:ctrl.signal });
        if (r.ok) { const d = await r.json().catch(()=>({})); if (d.site_id) _pluginSecret = d.site_id; }
    } catch(_) {}

    const siteName = site.site_name || site.site_url || '—';
    document.getElementById('hero-hotel-name').textContent = siteName;

    const urlEl = document.getElementById('hero-url');
    if (urlEl) urlEl.textContent = (site.site_url || '').replace(/^https?:\/\//, '').replace(/\/$/, '') || '—';

    const geoEl = document.getElementById('hero-geo-score');
    const geo0 = site.geo_scores || {};
    const geoAvg0 = geo0.completeness_score != null ? geo0.completeness_score : (geo0.ai_readiness != null ? geo0.ai_readiness : null);
    if (geoEl) geoEl.textContent = geoAvg0 !== null ? Math.round(geoAvg0/10) : '—';

    const rinEl = document.getElementById('hero-rinnovo');
    if (rinEl) {
        const ren = site.renewal_date || site.renew_date || null;
        rinEl.textContent = ren ? new Date(ren).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
    }

    // Sidebar navigation
    document.querySelectorAll('.sidebar-item[data-htab]').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.htab;
            document.querySelectorAll('.sidebar-item[data-htab]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('[id^="htab-"]').forEach(p => p.style.display = 'none');
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = '';
            if (tab === 'faq')      initHotelFaq();
            if (tab === 'schema')   initHotelSchema(site);
            if (tab === 'mappa')    initHotelMappa(site);
            if (tab === 'coerenza') initHotelCoerenza();
            if (tab === 'config')   initHotelConfig();
            if (tab === 'pse')      initHotelPse(pseData || [], now);
        });
    });

    // Sync button in header
    const syncHeader = document.getElementById('btn-header-sync');
    if (syncHeader) {
        syncHeader.addEventListener('click', () => {
            const syncBtn = document.getElementById('btn-hotel-sync');
            if (syncBtn) syncBtn.click(); else syncHeader.textContent = 'Sincronizza...';
        });
    }

    // Logout (sidebar + dropdown)
    const logoutSidebar = document.getElementById('dd-logout');
    const logoutInner   = document.getElementById('dd-logout-inner');
    const doLogout = async () => { await _SB.auth.signOut(); window.location.href = 'login.html'; };
    if (logoutSidebar)  logoutSidebar.addEventListener('click', doLogout);
    if (logoutInner)    logoutInner.addEventListener('click', doLogout);

    // User pill → dropdown toggle
    document.getElementById('user-pill')?.addEventListener('click', e => {
        e.stopPropagation();
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = d.style.display === 'none' ? '' : 'none';
    });
    document.addEventListener('click', () => {
        const d = document.getElementById('user-dropdown');
        if (d) d.style.display = 'none';
    });

    renderContent(site, pseData || [], now);
    applyAppFeatures(_appFeatures, _siteAppPerms);
}

// ─── PERMESSI APP ──────────────────────────────────────────────────────────────
function applyAppFeatures(userF, siteF) {
    const tabMap = { panoramica:'panoramica', faq:'faq', schema_org:'schema', mappa_query:'mappa', coerenza:'coerenza', config:'config', statistiche:'pse' };
    const allowed = key => userF[key] !== false && siteF[key] !== false;
    Object.entries(tabMap).forEach(([key, tab]) => {
        if (!allowed(key)) {
            document.querySelector(`.sidebar-item[data-htab="${tab}"]`)?.remove();
            const pane = document.getElementById('htab-' + tab);
            if (pane) pane.style.display = 'none';
        }
    });
}

// ─── FAQ ──────────────────────────────────────────────────────────────────────
const _isScriptSite = () => (_site?.hotel_profile?.site_mode === 'script');

async function initHotelFaq() {
    const listEl = document.getElementById('faq-hotel-list');
    if (!listEl || _faqItems.length) { renderHotelFaqList(listEl); return; }
    listEl.innerHTML = '<div class="loading" style="padding:20px"><div class="spinner"></div></div>';
    try {
        if (_isScriptSite()) {
            _faqItems = (_site?.faq_data?.items || []);
        } else {
            const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 9000);
            const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/faq', { signal:ctrl.signal });
            if (!r.ok) {
                const cached = _site?.faq_data?.items;
                if (cached && cached.length) { _faqItems = cached; }
                else throw new Error('HTTP ' + r.status);
            } else {
                const data = await r.json();
                _faqItems = data.items || [];
            }
        }
        const badge = document.getElementById('faq-hotel-count');
        if (badge) badge.textContent = _faqItems.length ? '('+_faqItems.length+')' : '';
        renderHotelFaqList(listEl);
    } catch(e) {
        if (listEl) listEl.innerHTML = '<div style="color:#b00020;font-size:13px;padding:16px 20px">FAQ non caricate: '+esc(e.message)+'</div>';
    }
}

async function _scriptSaveFaq(action, faq) {
    const items = [...(_site?.faq_data?.items || [])];
    if (action === 'delete') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items.splice(idx, 1);
    } else if (action === 'add') {
        items.push({ id: Date.now(), question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false, status: 'publish', order: items.length });
    } else if (action === 'update') {
        const idx = items.findIndex(x => x.id == faq.id);
        if (idx !== -1) items[idx] = { ...items[idx], question: faq.question, answer: faq.answer, solo_ai: faq.solo_ai||false };
    }
    const newFaqData = { ...(_site?.faq_data || {}), items, total: items.length, _synced_at: new Date().toISOString(), _source: 'isi' };
    const { error } = await _SBq.from('isi_sites').update({ faq_data: newFaqData }).eq('site_id', _site.site_id);
    if (error) throw new Error(error.message);
    _site.faq_data = newFaqData;
    _faqItems = items;
}

function renderHotelFaqList(el) {
    if (!el) return;
    let items = _faqItems;
    if (_faqFilter==='publish') items = items.filter(f => f.status==='publish'||!f.status);
    if (_faqFilter==='draft')   items = items.filter(f => f.status==='draft');
    if (_faqFilter==='solo_ai') items = items.filter(f => f.solo_ai);
    if (_faqSearch) items = items.filter(f => (f.question||'').toLowerCase().includes(_faqSearch)||(f.answer||'').toLowerCase().includes(_faqSearch));
    if (!_faqItems.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ. Clicca + Aggiungi FAQ per iniziare.</div>'; return; }
    if (!items.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ corrisponde ai filtri.</div>'; return; }
    const fmt = d => { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };
    el.innerHTML = items.map((f,i) => {
        const pub = f.status==='draft'?'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Bozza</span>':'<span style="background:#fbf4f7;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Pubblicato</span>';
        const ai  = f.solo_ai?'<span style="background:#fce8ef;color:#0D5F75;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px">Solo AI</span>':'';
        return `<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:0;align-items:center;padding:12px 20px;border-bottom:1px solid #f4f4f8">
            <div style="min-width:0"><div style="font-size:13px;font-weight:700;color:#171b33;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i+1}. ${esc(f.question)}</div><div style="font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((f.answer||'').substring(0,80))}${(f.answer||'').length>80?'…':''}</div></div>
            <div style="padding:0 16px;text-align:center;font-size:11px;color:#666b84;white-space:pre-line;line-height:1.4">${fmt(f.date||f.created_at)}</div>
            <div style="padding:0 12px;text-align:center;font-size:13px;font-weight:700;color:#171b33">${f.menu_order??f.order??0}</div>
            <div style="padding:0 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px">${pub}${ai}<div style="display:flex;gap:4px;margin-top:4px"><button class="btn-ping" style="font-size:11px;padding:3px 8px" onclick="openHotelFaqModal(${f.id})">✏️</button><button class="btn-ping" style="font-size:11px;padding:3px 8px;color:#b00020" onclick="deleteHotelFaq(${f.id})">🗑️</button></div></div>
        </div>`;
    }).join('');
}

function openHotelFaqModal(id) {
    const f = id ? _faqItems.find(x=>x.id===id) : null;
    document.getElementById('faq-hotel-modal-ttl').textContent = f ? 'Modifica FAQ' : 'Aggiungi FAQ';
    document.getElementById('fhm-id').value    = f ? f.id : '';
    document.getElementById('fhm-q').value     = f ? f.question : '';
    document.getElementById('fhm-a').value     = f ? f.answer : '';
    document.getElementById('fhm-solo-ai').checked = f ? !!f.solo_ai : false;
    document.getElementById('fhm-msg').style.display = 'none';
    document.getElementById('faq-hotel-modal').style.display = 'flex';
    document.getElementById('fhm-q').focus();
}

document.getElementById('fhm-save').addEventListener('click', async () => {
    const btn=document.getElementById('fhm-save'), msg=document.getElementById('fhm-msg');
    const id=document.getElementById('fhm-id').value, q=document.getElementById('fhm-q').value.trim(), a=document.getElementById('fhm-a').value.trim(), sa=document.getElementById('fhm-solo-ai').checked;
    if (!q) { msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Inserisci la domanda.'; return; }
    btn.disabled=true; btn.textContent='Salvataggio...';
    try {
        const action=id?'update':'add', faq={question:q,answer:a,solo_ai:sa,order:0};
        if(id) faq.id=parseInt(id);
        if (_isScriptSite()) {
            await _scriptSaveFaq(action, faq);
            document.getElementById('faq-hotel-modal').style.display='none';
            renderHotelFaqList(document.getElementById('faq-hotel-list'));
        } else {
            const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),12000);
            const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action,faq}),signal:ctrl.signal});
            const d=await r.json().catch(()=>({}));
            if(r.ok&&d.ok){ document.getElementById('faq-hotel-modal').style.display='none'; _faqItems=[]; await initHotelFaq(); }
            else throw new Error(d.message||'Errore '+r.status);
        }
    } catch(e){ msg.style.display='block'; msg.style.background='#fce8ef'; msg.style.color='#b00020'; msg.textContent='Errore: '+e.message; }
    finally { btn.disabled=false; btn.textContent='Salva FAQ'; }
});

window.deleteHotelFaq = async function(id) {
    const f=_faqItems.find(x=>x.id===id);
    if(!f||!confirm('Eliminare la FAQ "'+((f.question||'').substring(0,60))+'"?')) return;
    try {
        if (_isScriptSite()) {
            await _scriptSaveFaq('delete', {id});
            renderHotelFaqList(document.getElementById('faq-hotel-list'));
        } else {
            const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),10000);
            const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action:'delete',faq:{id}}),signal:ctrl.signal});
            const d=await r.json().catch(()=>({}));
            if(r.ok&&d.ok){ _faqItems=[]; await initHotelFaq(); } else alert('Errore durante eliminazione');
        }
    } catch(e){ alert('Errore: '+e.message); }
};

let _hschemaInited = false;
async function initHotelSchema(site) {
    if (_hschemaInited) return; _hschemaInited = true;

        if(src) src.textContent = schema._synced_at ? 'Dati plugin · '+new Date(schema._synced_at).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    } catch(_) {
        schema = site.schema_data || {};
        const src=document.getElementById('hschema-source');

    renderHotelSchemaView(schema);

async function saveHotelSchema() {
    const btn=document.getElementById('btn-save-hschema'), msg=document.getElementById('hschema-msg');
    btn.disabled=true; btn.textContent='Invio...';
    const g=id=>(document.getElementById('hsf-'+id)?.value||'').trim();
    const schema={name:g('name'),type:g('type'),official_rating:g('official_rating'),description:g('description'),price_range:g('price_range'),street:g('street'),postal_code:g('postal_code'),city:g('city'),region:g('region'),country:g('country'),latitude:g('latitude'),longitude:g('longitude'),telephone:g('telephone'),email:g('email'),url:g('url'),checkin_time:g('checkin_time'),checkout_time:g('checkout_time'),pets_allowed:g('pets_allowed')};
    try {
        const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),15000);
        const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/schema',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,schema}),signal:ctrl.signal});
        const d=await r.json().catch(()=>({}));
        if(r.ok&&d.ok){ msg.style.display='block'; msg.style.color='#0D5F75'; msg.textContent='✓ Salvato sul plugin. Sync in corso...'; renderHotelSchemaView(schema); fetch(_pluginBase+'/wp-json/in3pida/v1/force-heartbeat',{method:'POST',headers:{'Content-Type':'application/json'}}).catch(()=>{}); setTimeout(()=>{toggleHotelSchemaEdit(false);msg.style.display='none';},2000); }
        else throw new Error(d.message||'Risposta '+r.status);
    } catch(e){ msg.style.display='block'; msg.style.color='#b00020'; msg.textContent='Errore: '+e.message; }

window.saveHotelMappaAnswer = async function(cat, siteId) {
    const el=document.querySelector('.hqmap-answer[data-cat="'+cat+'"]'); if(!el) return;
    const answer=el.value.trim();
    const {data:s}=await _SBq.from('isi_sites').select('faq_data').eq('site_id',siteId).single();
    const fd=s?.faq_data||{}, qm=fd.query_map||fd.mappa_query||{};
    qm[cat]={...(qm[cat]||{}),answer,covered:!!answer};
    const {error}=await _SBq.from('isi_sites').update({faq_data:{...fd,query_map:qm}}).eq('site_id',siteId);

function initHotelPseCharts(pseData) {
    if (_pseChartsInited) return; _pseChartsInited = true;
    const items=pseData||[], cited=items.filter(r=>r.result?.cited||r.result?.found||r.result?.match_found).length, notCited=items.length-cited;
    const donutCtx=document.getElementById('hchart-pse-donut');
    if(donutCtx&&items.length>0){
        new Chart(donutCtx,{type:'doughnut',data:{labels:['Citato','Non citato'],datasets:[{data:[cited,notCited],backgroundColor:['#0D5F75','#ead0dc'],borderWidth:0}]},options:{cutout:'70%',plugins:{legend:{display:false}}}});
        document.getElementById('hpse-donut-legend').innerHTML='<span style="color:#0D5F75;font-weight:700">'+cited+' citazioni</span> su '+items.length+' query';
    } else if(donutCtx){
        donutCtx.parentElement.innerHTML='<div style="color:#aaa;font-size:13px;text-align:center">Nessuna query PSE registrata.</div>';
    }
    const barCtx=document.getElementById('hchart-pse-bar');
    if(barCtx&&items.length>0){
        const now2=new Date(), days={};
        for(let i=29;i>=0;i--){const d=new Date(now2);d.setDate(d.getDate()-i);days[d.toISOString().slice(0,10)]=0;}
        items.forEach(r=>{const k=(r.created_at||'').slice(0,10);if(k in days)days[k]++;});
        new Chart(barCtx,{type:'bar',data:{labels:Object.keys(days).map(d=>d.slice(5)),datasets:[{data:Object.values(days),backgroundColor:'#0D5F75',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,color:'#aaa',font:{size:10}}},y:{beginAtZero:true,grid:{color:'#f0f0f4'},ticks:{stepSize:1,color:'#aaa',font:{size:10}}}}}});
    }
}

// ─── UTIL ─────────────────────────────────────────────────────────────────────
function timeAgo(d) {
    const s=(new Date()-new Date(d))/1000;
    if(s<60) return 'Adesso';
    if(s<3600) return Math.floor(s/60)+' min fa';
    if(s<86400) return Math.floor(s/3600)+' ore fa';
    return Math.floor(s/86400)+' giorni fa';
}
function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

        const status = document.getElementById('fb-msg-status');
        if (!msg) { status.textContent = 'Scrivi un messaggio.'; status.style.color='#b00020'; status.style.display='block'; return; }
        const btn = document.getElementById('fb-submit');
        btn.disabled = true; btn.textContent = 'Invio…';
        try {
            const { data:{ session } } = await _SB.auth.getSession();
            const res = await fetch(SUPABASE_URL + '/functions/v1/isi-feedback', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, reply_to: email })
            });
            if (!res.ok) throw new Error('Errore invio');
            status.textContent = 'Feedback inviato. Grazie!'; status.style.color='#0D5F75'; status.style.display='block';
            document.getElementById('fb-msg').value = '';
            setTimeout(() => { overlay.style.display='none'; status.style.display='none'; }, 2000);
        } catch(e) {
            status.textContent = 'Errore durante l\'invio. Riprova.'; status.style.color='#b00020'; status.style.display='block';
        }
        btn.disabled = false; btn.textContent = 'Invia feedback';
    });
})();
</script>
</body>
</html>
