<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>iSI — Sito Intelligente</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        .tip-q{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#009bb9;color:white;font-size:9px;font-weight:800;cursor:default;flex-shrink:0;user-select:none;vertical-align:middle}
    </style>
</head>
<body>

<!-- MODAL FAQ -->
<div id="faq-hotel-modal" class="info-overlay" style="display:none">
    <div class="info-card" style="max-width:600px">
        <div class="info-card-header">
            <span id="faq-hotel-modal-ttl">Aggiungi FAQ</span>
            <button class="info-close" id="faq-hotel-modal-close">✕</button>
        </div>
        <div class="info-card-body">
            <input type="hidden" id="fhm-id">
            <div class="profile-field">
                <label class="profile-label">Domanda *</label>
                <input type="text" id="fhm-q" class="profile-input" placeholder="Es: Dove si trova l'hotel?">
            </div>
            <div class="profile-field">
                <label class="profile-label">Risposta</label>
                <textarea id="fhm-a" class="profile-input" rows="5" style="resize:vertical" placeholder="Scrivi la risposta completa..."></textarea>
            </div>
            <div class="profile-field" style="display:flex;align-items:center;gap:10px">
                <input type="checkbox" id="fhm-solo-ai" style="width:16px;height:16px;cursor:pointer;accent-color:#d82d6b">
                <label for="fhm-solo-ai" style="font-size:13px;font-weight:600;cursor:pointer;color:#171b33">Solo AI <span style="color:var(--grey);font-weight:400">— visibile solo al layer LLM, non sul sito pubblico</span></label>
            </div>
            <div id="fhm-msg" style="font-size:13px;margin-top:10px;display:none;padding:8px 12px;border-radius:8px"></div>
            <div class="profile-actions" style="margin-top:16px">
                <button class="btn-save-profile" id="fhm-save">Salva FAQ</button>
                <button class="btn-ping" id="fhm-cancel" style="margin-left:8px">Annulla</button>
            </div>
        </div>
    </div>
</div>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-inner">
        <div class="navbar-left">
            <div class="navbar-logo"><img src="images/logo.png" alt="in3pida"></div>
            <span class="navbar-badge">iSI</span>
        </div>
        <div class="navbar-center">
            <span id="nav-site-name" style="font-size:13px;font-weight:600;color:var(--grey)"></span>
        </div>
        <div class="navbar-right">
            <div class="navbar-user-pill" id="user-pill" style="cursor:pointer">
                <div class="navbar-avatar" id="nav-avatar">H</div>
                <div class="navbar-user-text">
                    <div class="navbar-user-name" id="nav-name">Hotel</div>
                    <div class="navbar-user-sub">Pannello Hotel</div>
                </div>
            </div>
            <div class="user-dropdown" id="user-dropdown" style="display:none">
                <div class="user-dropdown-header">
                    <div class="user-dropdown-avatar" id="dd-avatar">H</div>
                    <div>
                        <div class="user-dropdown-name" id="dd-name">Hotel</div>
                        <div class="user-dropdown-email" id="dd-email"></div>
                    </div>
                </div>
                <div class="user-dropdown-divider"></div>
                <button class="user-dropdown-item logout" id="dd-logout">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Esci
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="hero-label" id="hero-greeting">in3pida Sito Intelligente</div>
    <div class="hero-title" id="hero-hotel-name">—</div>
</div>

<!-- MAIN -->
<div class="main">
    <div id="hotel-content"><div class="loading"><div class="spinner"></div> Caricamento...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL      = 'https://yyauvoqjdzrbmebeafit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YXV2b3FqZHpyYm1lYmVhZml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MDAsImV4cCI6MjA5NTM2OTYwMH0.M6kD56PEO_UcJ68Vjquo03vuORjv62MflIzGLzYKN9w';
const _SB  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const _SBq = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });

let _site = null, _pluginBase = '', _pluginSecret = '';
let _faqItems = [], _faqFilter = 'all', _faqSearch = '';
let _pseChartsInited = false, _mappaInited = false, _coerenzaInited = false, _configInited = false;

// ─── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
    const { data:{ session } } = await _SB.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const user = session.user;
    if (user.user_metadata?.role === 'admin') { window.location.href = 'index.html'; return; }

    const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Hotel';
    const ini  = name.charAt(0).toUpperCase();
    document.getElementById('nav-name').textContent   = name;
    document.getElementById('nav-avatar').textContent = ini;
    document.getElementById('dd-name').textContent    = name;
    document.getElementById('dd-email').textContent   = user.email || '';
    document.getElementById('dd-avatar').textContent  = ini;
    document.getElementById('hero-greeting').textContent = 'Ciao ' + name + '!';

    const siteId = user.user_metadata?.site_id;
    if (!siteId) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-icon">🏨</div><div class="empty-title">Hotel non collegato</div><div class="empty-sub">Contatta il supporto per collegare il tuo sito</div></div>';
        return;
    }

    const now = new Date();
    const [{ data:site }, { data:pseData }] = await Promise.all([
        _SBq.from('isi_sites').select('*').eq('site_id', siteId).single(),
        _SBq.from('isi_pse_queries').select('created_at,cost_usd,result').eq('site_id', siteId).order('created_at',{ascending:false}).limit(500),
    ]);
    if (!site) {
        document.getElementById('hotel-content').innerHTML = '<div class="empty-state"><div class="empty-title">Sito non trovato</div></div>';
        return;
    }

    _site = site;
    _pluginBase   = (site.site_url || '').replace(/\/$/, '');
    _pluginSecret = site.site_id;
    try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/site-id', { signal:ctrl.signal });
        if (r.ok) { const d = await r.json().catch(()=>({})); if (d.site_id) _pluginSecret = d.site_id; }
    } catch(_) {}

    const siteName = site.site_name || site.site_url || '—';
    document.getElementById('hero-hotel-name').textContent = siteName;
    document.getElementById('nav-site-name').textContent   = siteName;

    renderContent(site, pseData || [], now);
}

// ─── RENDER MAIN CONTENT ───────────────────────────────────────────────────────
function renderContent(site, pseData, now) {
    const geo = site.geo_scores || {};
    const hrs = site.last_heartbeat ? (now - new Date(site.last_heartbeat))/3600000 : 9999;
    const rawFallback = [geo.chunk_avg, geo.citation_avg].filter(v=>v!=null);
    const geoAvg = geo.completeness_score != null ? geo.completeness_score : (geo.ai_readiness != null ? geo.ai_readiness : (rawFallback.length ? Math.round(rawFallback.reduce((a,b)=>a+b,0)/rawFallback.length) : null));
    const cs = geo.completeness_score ?? null;
    const checklist = geo.checklist || [];
    const covPct = geo.coverage_pct ?? null;
    const missingAnswers = geo.missing_answers ?? null;
    const missingQueries = geo.missing_queries || [];
    const freshAlerts = geo.freshness_alerts || [];
    const qMapPct = geo.query_map_pct ?? null;
    const qUncovered = geo.query_uncovered ?? null;
    const qTotal = geo.query_total ?? null;
    const daysFaq = geo.days_since_faq ?? null;
    const daysSchema = geo.days_since_schema ?? null;
    const isOld = false;
    const statoGen = (hrs<25&&(geoAvg===null||geoAvg>=40))?'ok':(hrs>48?'err':'warn');

    const sf = (s,l,d) => {
        const c = s==='ok'?'var(--cyan)':s==='warn'?'var(--magenta)':s==='err'?'var(--red)':'var(--grey-dot)';
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f4f4f8"><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0;display:inline-block"></span><span style="font-size:13px;font-weight:600;color:#4b4d68">${l}</span></div><span style="font-size:12px;color:#888">${d}</span></div>`;
    };
    const regIl = site.created_at ? new Date(site.created_at).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}) : '—';

    const geoTips = {ai_readiness:'Prontezza complessiva del sito per essere letto e citato dai sistemi AI.',answer_extraction:'Capacità del sito di fornire risposte dirette ed estraibili dai motori AI.',quality_safety:'Qualità e sicurezza dei contenuti — testo chiaro, non ambiguo.',ai_visibility:'Visibilità stimata del sito sui principali sistemi AI come ChatGPT, Perplexity ecc.',entity_authority:"Autorevolezza delle entità semantiche del sito.",chunk_avg:'Media della citabilità dei singoli blocchi di contenuto.',citation_avg:'Media del punteggio Citation Engine.'};
    const geoRows = [{k:'ai_readiness',l:'AI Readiness'},{k:'answer_extraction',l:'Answer Extraction'},{k:'quality_safety',l:'Quality Safety'},{k:'ai_visibility',l:'AI Visibility'},{k:'entity_authority',l:'Entity Authority'},{k:'chunk_avg',l:'Chunk Citation'},{k:'citation_avg',l:'Citation Engine'}].map(({k,l})=>{const v=geo[k]??null;const vc=v===null?'#ead0dc':v>=70?'#009bb9':'#d82d6b';const bg=v!==null&&v<40?'linear-gradient(135deg,#ffffff 0%,#fce8ef 100%)':'white';const br=v!==null&&v<40?'#ead0dc':'#e4e4ec';const st=v===null?'nessun dato':v>=70?'ottimizzato':v>=40?'da migliorare':'critico';return `<div style="background:${bg};border:1px solid ${br};border-radius:8px;padding:16px 18px"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#aaa;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px">${l} <span class='tip-q' data-tip='${geoTips[k]}'>?</span></div><div style="font-size:32px;font-weight:800;line-height:1;color:${v!==null?'#171b33':'#ead0dc'}">${v!==null?v:'—'}</div><div style="font-size:11px;font-weight:600;color:${vc};margin-top:6px">${st}</div></div>`;}).join('');

    const dtabInact = 'padding:10px 20px;border:none;background:none;font-size:12px;font-weight:700;letter-spacing:.05em;cursor:pointer;white-space:nowrap;color:#666b84;border-bottom:2px solid transparent;margin-bottom:-2px';
    const dtabAct   = 'padding:10px 20px;border:none;background:none;font-size:12px;font-weight:700;letter-spacing:.05em;cursor:pointer;white-space:nowrap;color:#d82d6b;border-bottom:2px solid #d82d6b;margin-bottom:-2px';

    const el = document.getElementById('hotel-content');
    el.innerHTML = `
        <!-- KPI -->
        <div style="background:white;border-radius:16px;box-shadow:0 2px 20px rgba(0,0,0,0.07);overflow:hidden;margin-bottom:20px">
            <div style="padding:14px 20px;border-bottom:1px solid #f0f0f6;display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#d82d6b;display:inline-block;flex-shrink:0"></span>
                <span style="font-size:11px;font-weight:700;color:#171b33;letter-spacing:.05em;text-transform:uppercase">PANORAMICA GEO SCORE</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#f0f0f6">
            <div style="background:linear-gradient(135deg,#ffffff 0%,#fce8ef 100%);padding:18px 20px">
                <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#4a4a6a;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px">GEO SCORE <span class='tip-q' data-tip='Punteggio complessivo AI. ≥70 ottimizzato, 40–69 da migliorare.'>?</span></div>
                <div style="font-size:34px;font-weight:800;line-height:1;color:${geoAvg!==null?'#171b33':'#ead0dc'}">${geoAvg!==null?geoAvg:'—'}</div>
                <div style="font-size:11px;font-weight:600;color:${geoAvg!==null?(geoAvg>=70?'#009bb9':'#d82d6b'):'#ead0dc'};margin-top:6px">${geoAvg!==null?(geoAvg>=70?'ottimizzato':geoAvg>=40?'da migliorare':'critico'):'nessun dato'}</div>
            </div>
            <div style="background:white;padding:18px 20px">
                <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#4a4a6a;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px">COMPLETEZZA AI <span class='tip-q' data-tip='Completezza del profilo AI: nome, indirizzo, descrizione, contatti, FAQ ecc.'>?</span></div>
                <div style="font-size:34px;font-weight:800;line-height:1;color:${cs!==null?'#171b33':'#ead0dc'}">${cs!==null?cs:'—'}</div>
                <div style="font-size:11px;font-weight:600;color:${cs!==null?(cs>=70?'#009bb9':'#d82d6b'):'#ead0dc'};margin-top:6px">${cs!==null?(cs>=70?'ottimizzato':cs>=40?'da migliorare':'critico'):'nessun dato'}</div>
            </div>
            <div style="background:white;padding:18px 20px">
                <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#4a4a6a;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px">COVERAGE FAQ <span class='tip-q' data-tip='Percentuale di domande degli ospiti coperta dalle FAQ. ≥80% buona copertura.'>?</span></div>
                <div style="font-size:34px;font-weight:800;line-height:1;color:${covPct!==null?'#171b33':'#ead0dc'}">${covPct!==null?covPct+'%':'—'}</div>
                <div style="font-size:11px;font-weight:600;color:${covPct!==null?(covPct>=80?'#009bb9':'#d82d6b'):'#ead0dc'};margin-top:6px">${covPct!==null?covPct+'% coperto':'nessun dato'}</div>
            </div>
            <div style="background:white;padding:18px 20px">
                <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#4a4a6a;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px">MAPPA QUERY <span class='tip-q' data-tip='Percentuale di categorie di query conversazionali coperte. ≥70% buona copertura.'>?</span></div>
                <div style="font-size:34px;font-weight:800;line-height:1;color:${qMapPct!==null?'#171b33':'#ead0dc'}">${qMapPct!==null?qMapPct+'%':'—'}</div>
                <div style="font-size:11px;font-weight:600;color:${qMapPct!==null?(qMapPct>=70?'#009bb9':'#d82d6b'):'#ead0dc'};margin-top:6px">${qMapPct!==null?qMapPct+'% coperto':'nessun dato'}</div>
            </div>
            </div>
        </div>

        <!-- TAB BAR -->
        <div style="display:flex;border-bottom:2px solid #e4e4ec;margin-bottom:20px;overflow-x:auto;gap:0">
            <button class="htab-btn" data-tab="panoramica" style="${dtabAct}">PANORAMICA</button>
            <button class="htab-btn" data-tab="faq" style="${dtabInact}">FAQ</button>
            <button class="htab-btn" data-tab="schema" style="${dtabInact}">SCHEMA.ORG</button>
            <button class="htab-btn" data-tab="mappa" style="${dtabInact}">MAPPA QUERY</button>
            <button class="htab-btn" data-tab="coerenza" style="${dtabInact}">COERENZA</button>
            <button class="htab-btn" data-tab="config" style="${dtabInact}">CONFIGURAZIONE</button>
            <button class="htab-btn" data-tab="pse" style="${dtabInact}">STATISTICHE PSE</button>
        </div>

        <!-- ═══ TAB: PANORAMICA ═══ -->
        <div id="htab-panoramica">
            <div style="display:grid;grid-template-columns:260px 1fr;gap:20px;margin-bottom:20px;align-items:start">

                <!-- Stato contenuti (stile Statistiche) -->
                <div style="background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.07)">
                    <div style="padding:16px 20px 14px">
                        <div style="font-size:18px;font-weight:800;color:#171b33;letter-spacing:-.01em">Stato contenuti</div>
                    </div>
                    <div style="border-top:1px solid #f0f0f6">
                        <div style="font-size:10px;font-weight:700;color:#aaa;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px 6px">SEZIONI</div>
                        ${[
                            {k:'faq',     l:'FAQ',            v: covPct!==null?(covPct+'% coperto'):'1 pubblicata'},
                            {k:'schema',  l:'SCHEMA.ORG',     v: daysSchema===null?'Non aggiornato':(daysSchema+' giorni fa')},
                            {k:'mappa',   l:'MAPPA QUERY',    v: qMapPct!==null?(qMapPct+'% coperto'):'Nessun dato'},
                            {k:'coerenza',l:'COERENZA',       v:'Confronta canali'},
                            {k:'config',  l:'CONFIGURAZIONE', v:'Chiavi e abilitazioni'},
                            {k:'pse',     l:'STATISTICHE PSE',v:(pseData.length||0)+' query registrate'},
                        ].map(({k,l,v})=>
                            '<div class="hstato-row" data-tab="'+k+'" style="display:flex;align-items:center;justify-content:space-between;padding:11px 20px;cursor:pointer;border-bottom:1px solid #f0f0f6;transition:background .15s" onmouseenter="this.style.background=\'#fbf4f7\'" onmouseleave="this.style.background=\'white\'">'
                            + '<span style="font-size:10px;font-weight:700;color:#4a4a6a;letter-spacing:.07em;text-transform:uppercase">'+l+'</span>'
                            + '<span style="font-size:13px;color:#181834;text-align:right;max-width:120px;font-weight:600">'+v+'</span>'
                            + '</div>'
                        ).join('')}
                        <div style="padding:16px 20px">
                            <button id="btn-hotel-sync" style="width:100%;background:#d82d6b;color:white;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:800;letter-spacing:.08em;cursor:pointer;font-family:var(--font)">SINCRONIZZA</button>
                        </div>
                    </div>
                </div>

                <!-- Stato Semafori + Info Sito -->
                <div style="display:flex;flex-direction:column;gap:16px">
                    <div class="card" style="margin:0;border-radius:8px;border:1px solid #e4e4ec;box-shadow:none">
                        <div class="card-header" style="border-bottom:1px solid #ececf2;background:#fafafa"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#d82d6b;display:inline-block;flex-shrink:0"></span><div style="font-size:11px;font-weight:700;color:#171b33;letter-spacing:.05em;text-transform:uppercase">Stato semafori</div></div></div>
                        <div style="padding:0 20px 8px">
                            ${sf(statoGen,'<strong>Stato generale: '+(statoGen==='ok'?'Tutto OK':statoGen==='warn'?'Attenzione':'Problemi rilevati')+'</strong>','')}
                            ${sf(hrs<25?'ok':hrs<48?'warn':'err','Plugin attivo sul sito',site.last_heartbeat?'Ultimo segnale: '+timeAgo(site.last_heartbeat):'Nessun segnale ricevuto')}
                            ${sf(geoAvg===null?'grey':geoAvg>=70?'ok':geoAvg>=40?'warn':'err','GEO Score',geoAvg!==null?geoAvg+'/100':'Nessun dato disponibile')}
                            ${geo.has_ai_profile===true?sf('ok','/ai-profile','Endpoint attivo — leggibile dai crawler AI'):geo.has_ai_profile===false?sf('err','/ai-profile','LLM layer disabilitato — attivalo in Configurazione'):sf('warn','/ai-profile','In attesa del prossimo heartbeat')}
                        </div>
                    </div>
                    <div class="card" style="margin:0;border-radius:8px;border:1px solid #e4e4ec;box-shadow:none">
                        <div class="card-header" style="border-bottom:1px solid #ececf2;background:#fafafa"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#d82d6b;display:inline-block;flex-shrink:0"></span><div style="font-size:11px;font-weight:700;color:#171b33;letter-spacing:.05em;text-transform:uppercase">Informazioni sito</div></div></div>
                        <div style="padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
                            <div style="background:#f7f7fb;border-radius:8px;padding:12px 14px"><div style="font-size:10px;color:#aaa;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px">Sito</div><div style="font-size:14px;font-weight:600;color:#35364f">${esc(site.site_name||'—')}</div></div>

// ─── FAQ ──────────────────────────────────────────────────────────────────────
async function initHotelFaq() {
    const listEl = document.getElementById('faq-hotel-list');
    if (!listEl || _faqItems.length) { renderHotelFaqList(listEl); return; }
    listEl.innerHTML = '<div class="loading" style="padding:20px"><div class="spinner"></div></div>';
    try {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 9000);
        const r = await fetch(_pluginBase + '/wp-json/in3pida/v1/faq', { signal:ctrl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        _faqItems = data.items || [];
        const badge = document.getElementById('faq-hotel-count');
        if (badge) badge.textContent = _faqItems.length ? '('+_faqItems.length+')' : '';
        renderHotelFaqList(listEl);
    } catch(e) {
        if (listEl) listEl.innerHTML = '<div style="color:#b00020;font-size:13px;padding:16px 20px">FAQ non caricate: '+esc(e.message)+'</div>';
    }
}

function renderHotelFaqList(el) {
    if (!el) return;
    let items = _faqItems;
    if (_faqFilter==='publish') items = items.filter(f => f.status==='publish'||!f.status);
    if (_faqFilter==='draft')   items = items.filter(f => f.status==='draft');
    if (_faqFilter==='solo_ai') items = items.filter(f => f.solo_ai);
    if (_faqSearch) items = items.filter(f => (f.question||'').toLowerCase().includes(_faqSearch)||(f.answer||'').toLowerCase().includes(_faqSearch));
    if (!_faqItems.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ. Clicca + Aggiungi FAQ per iniziare.</div>'; return; }
    if (!items.length) { el.innerHTML='<div style="padding:20px;color:var(--grey);font-size:13px">Nessuna FAQ corrisponde ai filtri.</div>'; return; }
    const fmt = d => { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };
    el.innerHTML = items.map((f,i) => {
        const pub = f.status==='draft'?'<span style="background:#fbf4f7;color:#d82d6b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Bozza</span>':'<span style="background:#e9f7fb;color:#009bb9;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Pubblicato</span>';
        const ai  = f.solo_ai?'<span style="background:#fce8ef;color:#d82d6b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px">Solo AI</span>':'';

window.deleteHotelFaq = async function(id) {

        const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),10000);
        const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/faq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:_pluginSecret,action:'delete',faq:{id}}),signal:ctrl.signal});

        if(r.ok&&d.ok){ _faqItems=[]; await initHotelFaq(); } else alert('Errore durante eliminazione');

};

let _hschemaInited = false;
async function initHotelSchema(site) {
    if (_hschemaInited) return; _hschemaInited = true;
    let schema = {};
    try {
        const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),9000);
        const r=await fetch(_pluginBase+'/wp-json/in3pida/v1/schema',{signal:ctrl.signal});
        if(r.ok) schema=await r.json();
        const src=document.getElementById('hschema-source');
        if(src) src.textContent = schema._synced_at ? 'Dati plugin · '+new Date(schema._synced_at).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    } catch(_) {
        schema = site.schema_data || {};
        const src=document.getElementById('hschema-source');
        if(src) src.textContent='Dati Supabase (plugin non raggiungibile)';

    renderHotelSchemaView(schema);

    document.getElementById('btn-cancel-hschema')?.addEventListener('click', () => toggleHotelSchemaEdit(false));

async function saveHotelSchema() {

    btn.disabled=true; btn.textContent='Invio...';

async function initHotelMappa(site) {
    if (_mappaInited) return; _mappaInited = true;
    const cont=document.getElementById('hmappa-content'); if(!cont) return;
    const faqData=site.faq_data||{}, qmap=faqData.query_map||faqData.mappa_query||{}, cats=Object.keys(qmap);
    if(!cats.length){ cont.innerHTML='<div style="color:#aaa;font-size:13px">Nessuna categoria disponibile. Sincronizza dal plugin.</div>'; return; }
    cont.innerHTML=cats.map(cat=>{
        const entry=qmap[cat]||{}, queries=Array.isArray(entry.queries)?entry.queries:(entry.examples||[]), answer=entry.answer||entry.risposta||'', covered=entry.covered??!!answer;
        const badge=covered?'<span style="background:#e9f7fb;color:#009bb9;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Coperta</span>':'<span style="background:#fce8ef;color:#d82d6b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">Mancante</span>';
        return `<div style="padding:16px 20px;border-bottom:1px solid #f4f4f8"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#171b33;text-transform:capitalize">${esc(cat.replace(/_/g,' '))}</div>${badge}</div>${queries.length?'<div style="margin-bottom:8px">'+queries.slice(0,3).map(q=>'<div style="font-size:12px;color:#666b84;padding:2px 0">• '+esc(q)+'</div>').join('')+(queries.length>3?'<div style="font-size:11px;color:#aaa">+'+( queries.length-3)+' altre...</div>':'')+'</div>':''}<div style="display:flex;gap:8px;align-items:flex-start"><textarea data-cat="${esc(cat)}" class="hqmap-answer" style="flex:1;border:1px solid #e4e4ec;border-radius:6px;padding:8px 10px;font-size:12px;resize:vertical;min-height:60px;color:#171b33;outline:none" placeholder="Scrivi la risposta...">${esc(answer)}</textarea><button class="btn-update" style="margin-left:0;padding:8px 14px;font-size:12px" onclick="saveHotelMappaAnswer('${esc(cat)}','${esc(site.site_id)}')">Salva</button></div></div>`;
    }).join('');
}

window.saveHotelMappaAnswer = async function(cat, siteId) {
    const el=document.querySelector('.hqmap-answer[data-cat="'+cat+'"]'); if(!el) return;
    const answer=el.value.trim();
    const {data:s}=await _SBq.from('isi_sites').select('faq_data').eq('site_id',siteId).single();
    const fd=s?.faq_data||{}, qm=fd.query_map||fd.mappa_query||{};
    qm[cat]={...(qm[cat]||{}),answer,covered:!!answer};
    const {error}=await _SBq.from('isi_sites').update({faq_data:{...fd,query_map:qm}}).eq('site_id',siteId);
    el.style.borderColor=error?'#d82d6b':'#009bb9'; setTimeout(()=>{el.style.borderColor='#e4e4ec';},2000);
};

        '</div></div>';

    document.getElementById('hbtn-save-toggles')?.addEventListener('click', async()=>{
        const newCfg={...cfg,chunk_engine:document.getElementById('hcfg-chunk_engine')?.checked,citation_engine:document.getElementById('hcfg-citation_engine')?.checked,entity_graph:document.getElementById('hcfg-entity_graph')?.checked,faq_enabled:document.getElementById('hcfg-faq_enabled')?.checked};
        await _SBq.from('isi_sites').update({hotel_profile:{...hp,isi_config:newCfg}}).eq('site_id',site.site_id);
        site.hotel_profile={...hp,isi_config:newCfg};
    });
    document.getElementById('hbtn-save-keys')?.addEventListener('click', async()=>{
        const gKey=document.getElementById('hcfg-gemini_key')?.value.trim(), iKey=document.getElementById('hcfg-isi_token')?.value.trim(), msg=document.getElementById('hcfg-keys-msg');
        const newCfg={...cfg};
        if(gKey&&!gKey.startsWith('•')) newCfg.gemini_api_key=gKey;
        if(iKey&&!iKey.startsWith('•')) newCfg.isi_token=iKey;
        const{error}=await _SBq.from('isi_sites').update({hotel_profile:{...hp,isi_config:newCfg}}).eq('site_id',site.site_id);
        if(msg){msg.style.color=error?'#d82d6b':'#009bb9';msg.textContent=error?'✗ Errore':'✓ Salvate';setTimeout(()=>{msg.textContent='';},3000);}
        site.hotel_profile={...hp,isi_config:newCfg};
    });
}

// ─── PSE CHARTS ───────────────────────────────────────────────────────────────
function initHotelPseCharts(pseData) {
    if (_pseChartsInited) return; _pseChartsInited = true;
    const items=pseData||[], cited=items.filter(r=>r.result?.cited||r.result?.found||r.result?.match_found).length, notCited=items.length-cited;
    const donutCtx=document.getElementById('hchart-pse-donut');
    if(donutCtx&&items.length>0){
        new Chart(donutCtx,{type:'doughnut',data:{labels:['Citato','Non citato'],datasets:[{data:[cited,notCited],backgroundColor:['#009bb9','#ead0dc'],borderWidth:0}]},options:{cutout:'70%',plugins:{legend:{display:false}}}});
        document.getElementById('hpse-donut-legend').innerHTML='<span style="color:#009bb9;font-weight:700">'+cited+' citazioni</span> su '+items.length+' query';
    } else if(donutCtx){
        donutCtx.parentElement.innerHTML='<div style="color:#aaa;font-size:13px;text-align:center">Nessuna query PSE registrata.</div>';
    }
    const barCtx=document.getElementById('hchart-pse-bar');
    if(barCtx&&items.length>0){
        const now2=new Date(), days={};
        for(let i=29;i>=0;i--){const d=new Date(now2);d.setDate(d.getDate()-i);days[d.toISOString().slice(0,10)]=0;}
        items.forEach(r=>{const k=(r.created_at||'').slice(0,10);if(k in days)days[k]++;});
        new Chart(barCtx,{type:'bar',data:{labels:Object.keys(days).map(d=>d.slice(5)),datasets:[{data:Object.values(days),backgroundColor:'#b3e0ea',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,color:'#aaa',font:{size:10}}},y:{beginAtZero:true,grid:{color:'#f0f0f4'},ticks:{stepSize:1,color:'#aaa',font:{size:10}}}}}});
    }
}

// ─── UTIL ─────────────────────────────────────────────────────────────────────
function timeAgo(d) {
    const s=(new Date()-new Date(d))/1000;
    if(s<60) return 'Adesso';
    if(s<3600) return Math.floor(s/60)+' min fa';
    if(s<86400) return Math.floor(s/3600)+' ore fa';
    return Math.floor(s/86400)+' giorni fa';
}
function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
